<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选址沙盘</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* ============================================================
     主题令牌：深色为基准，浅色只覆盖取值，CSS 结构两档共用。
     纪律：--y 只用于文字 细线 小圆点；--yFill 用于大面积填充（其上压 --onY）。
           发光一律 calc(Npx * var(--glowK))，浅色把 --glowK 置 0 关掉 ——
           白底上的彩色发光只会糊成一团脏晕。
     ============================================================ */
  :root{color-scheme:dark;--bg:#07080e;--panel:#10111e;--panel2:#161730;
    --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
    --txt:#E9EEF9;--mut:#93A1C0;--mut2:#6B7997;--y:#FFD100;--yglow:rgba(255,209,0,.18);
    --done:#2ED47A;--doing:#FFD100;--block:#FF5E5E;--teal:#5E84F5;--orange:#ff9a56;--internal:#34D3FF;
    --yFill:#FFD100;--onY:#1a1300;--onAccent:#08090f;--glowK:1;--tintK:1;
    --wash:rgba(255,255,255,.02);--washH:rgba(255,255,255,.03);--track:rgba(255,255,255,.12);
    --pageBg:#050509;--mapBg:#08090f;--sidebarTo:#08090f;--wbTo:#0a0a13;
    --field:#0c0d17;--pop:#10111e;--tip:#141627;--popTxt:#dbe4f3;--popClose:#7c8aa3;
    --glass:rgba(7,11,22,.82);--glassSoft:rgba(7,11,22,.5);--labelBg:rgba(7,11,22,.66);
    --labelHalo:#000;--shadow:rgba(0,0,0,.55);--sectorLbl:rgba(233,238,249,.5);--nfzPink:#ff9ec0;
    --doneBright:var(--done);--yBright:var(--y);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  :root[data-theme="light"]{color-scheme:light;
    --bg:#FAFAF9;--panel:#FFFFFF;--panel2:#F6F6F5;--line:rgba(50,49,46,.11);--line2:rgba(50,49,46,.17);
    --txt:#4F4D46;--mut:#5F5D57;--mut2:#6E6C65;--y:#8F6B00;--yglow:rgba(181,133,10,.32);
    --done:#147A41;--doing:#B5850A;--block:#C42B35;--teal:#3557C8;--orange:#B4560F;--internal:#0A7095;
    --yFill:#F0B400;--onY:#1a1300;--onAccent:#FFFFFF;--glowK:0;--tintK:2.6;
    --wash:rgba(50,49,46,.028);--washH:rgba(50,49,46,.05);--track:#DCE1EA;
    --pageBg:#E7EAF0;--mapBg:#EEF1F6;--sidebarTo:#F4F6FA;--wbTo:#F4F6FA;
    --field:#FFFFFF;--pop:#FFFFFF;--tip:#FFFFFF;--popTxt:#1B2333;--popClose:#55617A;
    --glass:rgba(255,255,255,.88);--glassSoft:rgba(255,255,255,.62);--labelBg:rgba(255,255,255,.86);
    --labelHalo:rgba(255,255,255,.95);--shadow:rgba(50,49,46,.14);--sectorLbl:rgba(27,35,51,.62);--nfzPink:#C2185B;
    --doneBright:#17A45C;--yBright:#B5850A}
  /* 底图署名常驻。压到 9px 半透明贴右下角，不动地图渲染本身 —— 公开底图服务的
     使用条款要的是可见的署名，别关掉它，也别改成纯装饰性文字。 */
  .leaflet-control-attribution{font-size:9px;line-height:1.5;padding:1px 6px;border-radius:6px 0 0 0;
    background:rgba(7,8,14,.42);color:var(--mut2);font-family:var(--sans);box-shadow:none}
  .leaflet-control-attribution a{color:var(--mut2);text-decoration:none}
  .leaflet-control-attribution a:hover{color:var(--mut);text-decoration:underline}
  :root[data-theme="light"] .leaflet-control-attribution{background:rgba(255,255,255,.62)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{background:var(--pageBg)}
  body{background:var(--pageBg);color:var(--txt);font-family:var(--sans);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:flex;align-items:center;gap:14px;padding:6px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;z-index:1000;background:var(--bg)}
  .bk{font-family:var(--mono);font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
  .bk:hover{color:var(--y);border-color:var(--y)}
  .ptstage{font-family:var(--mono);font-size:9.5px;color:var(--y);border:1px solid color-mix(in srgb,var(--y) 45%,transparent);background:color-mix(in srgb,var(--yFill) calc(8% * var(--tintK)),transparent);border-radius:6px;padding:2px 8px;letter-spacing:.4px;flex:0 0 auto;white-space:nowrap}
  .pt{font-size:18px;font-weight:800;white-space:nowrap}.pt b{color:var(--y)}
  .ptsub{font-weight:500;color:var(--mut);font-size:14px;letter-spacing:.2px;margin-left:2px}
  /* 数字与单位之间的极窄间隙。不用空格字符：多数数值走等宽字体，窄空格会被撑成整格。 */
  .g{display:inline-block;width:.16em}
  :root[lang="en"] .g{width:auto}
  :root[lang="en"] .g::before{content:" ";white-space:pre}
  .cv,.statc .v,.rv,.verdict .vb .v,.uc-m .v{white-space:nowrap}
  .crumb{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mut2)}
  .crumb .live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--doneBright);margin-right:6px;box-shadow:0 0 calc(8px * var(--glowK)) var(--doneBright);animation:bk 1.6s infinite}
  @keyframes bk{50%{opacity:.35}}
  .langtog{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;flex:0 0 auto}
  .langbtn{font-family:var(--mono);font-size:10px;padding:3px 8px;background:transparent;color:var(--mut);border:none;cursor:pointer;transition:.15s}
  .langbtn.active{background:var(--yFill);color:var(--onY);font-weight:700}
  .thtog{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:999px;padding:0;width:22px;height:22px;background:var(--wash);color:var(--mut);cursor:pointer;flex:0 0 auto;transition:.15s}
  .thtog:hover{color:var(--txt);border-color:var(--y)}
  .thtog svg{width:13px;height:13px;flex:0 0 auto;color:var(--yBright)}
  .stage{flex:1;display:grid;grid-template-columns:288px minmax(360px,1fr) 416px;min-height:0;overflow-x:auto}

  /* ===== 左栏 ===== */
  #sidebar{background:linear-gradient(180deg,var(--panel),var(--sidebarTo));border-right:1px solid var(--line);overflow-y:auto;padding:0 0 20px}
  #sidebar::-webkit-scrollbar{width:6px}#sidebar::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  .sp{padding:12px 14px;border-bottom:1px solid var(--line)}
  .sp h3{font-family:var(--mono);font-size:10px;letter-spacing:1.3px;color:var(--y);margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .sp h3 .r{margin-left:auto;color:var(--mut2);font-size:9px;letter-spacing:0}
  .statg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .statc{background:var(--wash);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
  .statc .v{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--y)}
  .statc .k{font-size:8.5px;color:var(--mut2);margin-top:2px}
  .lt{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;user-select:none}
  .lt:hover{background:var(--washH)}
  .lt input{accent-color:var(--teal);width:13px;height:13px;flex:0 0 auto;cursor:pointer}
  .lt .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .lt .dot.ring{background:transparent!important;border:1.6px solid}
  .lt .lb{font-size:11px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lt .cnt{font-family:var(--mono);font-size:9.5px;color:var(--teal);min-width:30px;text-align:right}
  .lt .sub{display:block;font-size:8.5px;color:var(--mut2);margin-top:1px}
  .ssub{font-size:9px;color:var(--mut2);letter-spacing:1px;margin:8px 0 4px;text-transform:uppercase}
  details.ref summary{font-family:var(--mono);font-size:10px;letter-spacing:1.3px;color:var(--mut);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
  details.ref summary::-webkit-details-marker{display:none}
  details.ref summary::before{content:"▸";color:var(--mut2)}details.ref[open] summary::before{content:"▾"}
  details.ref .refnote{font-size:9px;color:var(--mut2);line-height:1.5;margin:7px 0;padding:7px 9px;background:rgba(52,211,255,.04);border:1px solid rgba(52,211,255,.18);border-radius:6px}
  .foot-src{font-size:8.5px;color:var(--mut2);margin-top:6px;padding-left:6px}

  /* ===== 地图 ===== */
  #map{width:100%;height:100%;background:var(--mapBg)}
  .mapmask{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 34px 11px var(--bg)}
  #timebar{position:absolute;left:14px;right:14px;bottom:14px;z-index:600;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:9px 14px 7px;box-shadow:0 10px 34px var(--shadow)}
  .tbhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .tbhead .tbt{font:700 11px var(--mono);letter-spacing:.8px;color:var(--y)}
  .tbhead .tbsel{font:600 11px var(--mono);color:var(--teal);margin-left:auto}
  .tbhead .tbrst{font:600 10px var(--mono);color:var(--mut2);cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:2px 9px;user-select:none}
  .tbhead .tbrst:hover{color:var(--y);border-color:var(--y)}
  .tbbars{display:flex;align-items:flex-end;gap:2px;height:44px;cursor:crosshair;touch-action:none}
  .tbbars i{flex:1;background:rgba(120,140,245,.16);border-radius:2px 2px 0 0;min-height:6px;transition:background .12s}
  .tbbars i.on{background:linear-gradient(180deg,var(--teal),rgba(94,132,245,.32));box-shadow:0 0 calc(5px * var(--glowK)) color-mix(in srgb,var(--teal) 40%,transparent)}
  .tbaxis{display:flex;justify-content:space-between;font:9px var(--mono);color:var(--mut2);margin-top:3px}
  .leaflet-container{background:var(--mapBg);font-family:inherit}
  .sector-label{font-family:var(--mono);font-size:11px;color:var(--sectorLbl);font-weight:700;letter-spacing:.5px;text-shadow:0 1px 4px var(--labelHalo);white-space:nowrap;pointer-events:none}
  .nfz-label{font-family:var(--mono);font-size:9px;color:var(--nfzPink);text-shadow:0 1px 3px var(--labelHalo);white-space:nowrap;pointer-events:none}
  .hubIcon{width:14px;height:14px;border-radius:50%;background:var(--yBright);box-shadow:0 0 0 5px var(--yglow),0 0 calc(16px * var(--glowK)) var(--yBright);position:relative}
  .hubIcon::after{content:"";position:absolute;inset:-9px;border:1.5px solid color-mix(in srgb,var(--y) 50%,transparent);border-radius:50%;animation:hpulse 2.2s infinite}
  @keyframes hpulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
  .landIcon{width:11px;height:11px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--teal) 30%,transparent),0 0 calc(12px * var(--glowK)) var(--teal)}
  .suggIcon{width:11px;height:11px;border-radius:50%;background:var(--internal);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--internal) 32%,transparent),0 0 calc(12px * var(--glowK)) var(--internal)}
  .leaflet-popup-content-wrapper{background:var(--pop);color:var(--popTxt);border:1px solid rgba(52,211,255,.3);border-radius:12px;box-shadow:0 8px 28px var(--shadow)}
  .leaflet-popup-content{margin:11px 13px}
  .leaflet-popup-tip{background:var(--pop);border:1px solid rgba(52,211,255,.3)}
  .leaflet-popup-close-button{color:var(--popClose)}
  .leaflet-tooltip{background:var(--tip);color:var(--popTxt);border:1px solid rgba(52,211,255,.28);border-radius:8px;box-shadow:0 3px 12px var(--shadow);font-family:var(--mono);font-size:11px;padding:4px 8px}
  .leaflet-tooltip-top:before{border-top-color:var(--tip)}
  .rkbadge{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1.3px solid var(--internal);color:var(--internal);font-size:9px;font-weight:700;font-family:var(--mono);margin-left:3px;line-height:1;flex:0 0 auto}
  .suggtag{display:inline-flex;align-items:center;justify-content:center;height:14px;padding:0 5px;border-radius:4px;border:1px solid var(--internal);color:var(--internal);background:rgba(52,211,255,.1);font-size:9px;font-weight:700;font-family:var(--mono)}
  .moreunits{margin-top:2px}
  .moreunits>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);font-family:var(--mono);padding:9px 4px}
  .moreunits>summary::-webkit-details-marker{display:none}
  .moreunits[open] .caret{transform:rotate(90deg)}
  .beaconHub,.beaconLand{position:relative;border-radius:50%}
  .beaconHub{width:13px;height:13px;background:var(--yBright);color:var(--yBright);box-shadow:0 0 calc(10px * var(--glowK)) var(--yBright),0 0 0 3px var(--yglow);cursor:pointer}
  .beaconLand{width:9px;height:9px;background:var(--teal);color:var(--teal);box-shadow:0 0 calc(9px * var(--glowK)) var(--teal)}
  .beaconHub::before,.beaconHub::after,.beaconLand::before{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid currentColor;animation:bpulse 2.4s cubic-bezier(.2,.55,.3,1) infinite;pointer-events:none}
  .beaconHub::after{animation-delay:1.2s}
  @keyframes bpulse{0%{transform:scale(1);opacity:.85}80%,100%{transform:scale(3.6);opacity:0}}
  .bLabel{position:absolute;left:15px;top:50%;transform:translateY(-50%);white-space:nowrap;font:700 10.5px/1 var(--mono);letter-spacing:.5px;color:var(--y);text-shadow:0 1px 4px var(--labelHalo);background:var(--labelBg);padding:3px 7px;border-radius:6px;border:1px solid var(--yglow)}
  .mapbtns{position:absolute;top:10px;right:54px;display:flex;gap:6px;z-index:600}
  .mapbtns .mb{font-family:var(--mono);font-size:11px;color:var(--mut);background:var(--glass);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;cursor:pointer}
  .mapbtns .mb:hover{border-color:var(--y);color:var(--y)}
  .mapbtns .mb.arming{background:var(--yFill);color:var(--onY)}
  .mapbtns .mb.on{border-color:var(--y);color:var(--y)}

  /* ===== 右栏工作台 ===== */
  .wb{background:linear-gradient(165deg,var(--panel),var(--wbTo));border-left:1px solid var(--line);overflow-y:auto;padding:14px}
  .wb::-webkit-scrollbar{width:7px}.wb::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  .lhead{margin-bottom:12px}.lhead .nm{font-size:16px;font-weight:800}.lhead .meta{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:3px}
  .ucard{border:1px solid var(--line2);border-radius:12px;padding:13px 14px;margin-bottom:11px;background:var(--wash);cursor:pointer;transition:.15s}
  .ucard:hover{border-color:var(--y);background:color-mix(in srgb,var(--yFill) calc(4% * var(--tintK)),transparent);transform:translateY(-1px)}
  .uc-top{display:flex;align-items:center;gap:8px}
  .uc-top .d{width:9px;height:9px;border-radius:50%;background:var(--yBright);box-shadow:0 0 calc(8px * var(--glowK)) var(--yBright);flex:0 0 auto}
  .uc-top .nm{font-size:14px;font-weight:800}
  .uc-top .badge{margin-left:auto;font-family:var(--mono);font-size:9.5px;padding:3px 8px;border-radius:6px;border:1px solid}
  .uc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:11px}
  .uc-m{background:var(--glassSoft);border:1px solid var(--line);border-radius:8px;padding:8px 9px}
  .uc-m .k{font-size:9px;color:var(--mut2);font-family:var(--mono)}
  .uc-m .v{font-size:14px;font-weight:800;font-family:var(--mono);margin-top:3px}
  .uc-foot{font-family:var(--mono);font-size:9.5px;color:var(--mut2);margin-top:10px;display:flex;align-items:center}
  .uc-foot .go{margin-left:auto;color:var(--y)}
  .ucnote{font-size:8.5px;color:var(--mut2);font-family:var(--mono);margin-left:4px;letter-spacing:.2px}
  html[lang="en"] .ucnote{display:block;margin-left:0;margin-top:2px}
  html[lang="en"] .uc-m .k{min-height:25px}
  .uadd{border:1px dashed var(--line2);border-radius:12px;padding:12px;text-align:center;font-size:12px;color:var(--mut);cursor:pointer}
  .uadd:hover{border-color:var(--y);color:var(--y)}
  .mdl{flex:0 0 auto;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.5px;padding:2px 6px;border-radius:6px;color:var(--internal);border:1px solid color-mix(in srgb,var(--internal) 40%,transparent);background:color-mix(in srgb,var(--internal) 10%,transparent);white-space:nowrap}
  .mdl.lr{color:var(--done);border-color:color-mix(in srgb,var(--done) 40%,transparent);background:color-mix(in srgb,var(--done) 10%,transparent)}
  .plansec{margin-top:14px;border:1px dashed rgba(46,212,122,.3);border-radius:12px;padding:12px 13px;background:rgba(46,212,122,.03)}
  .plansec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
  .plansec>summary::-webkit-details-marker{display:none}
  .plansec>summary .nm{font-size:12px;font-weight:800;color:var(--done)}
  .plansec>summary .mdl{margin-left:auto}
  .caret{font-size:9px;color:var(--mut2);transition:transform .15s;flex:0 0 auto}
  .plansec[open] .caret{transform:rotate(90deg)}
  .plansub{font-family:var(--mono);font-size:9.5px;color:var(--mut2);margin-top:4px}
  .planrow{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px}
  .planrow .zd{width:7px;height:7px;border-radius:50%;background:var(--doneBright);flex:0 0 auto}
  .planrow .zn{font-weight:600}
  .planrow .zc{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--mut2);white-space:nowrap}
  .addbox{border:1px solid color-mix(in srgb,var(--y) 40%,transparent);border-radius:12px;padding:13px;margin-bottom:11px;background:color-mix(in srgb,var(--yFill) calc(4% * var(--tintK)),transparent)}
  .addbox .rowf{display:flex;gap:7px;align-items:center;margin-top:8px;font-size:11px}
  .addbox input{flex:1;background:var(--field);border:1px solid var(--line2);border-radius:6px;color:var(--txt);font-family:var(--mono);font-size:11px;padding:6px 8px}
  .addbox input:focus{outline:none;border-color:var(--y)}
  .addbox .btns{display:flex;gap:8px;margin-top:10px}
  .addbox .b{flex:1;text-align:center;font-size:11px;border-radius:8px;padding:7px;cursor:pointer;font-family:var(--mono)}
  .addbox .b.ok{background:var(--yFill);color:var(--onY);font-weight:700}.addbox .b.no{border:1px solid var(--line2);color:var(--mut)}
  .bk-list{font-family:var(--mono);font-size:11px;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .bk-list:hover{color:var(--y)}
  .wbnav{position:sticky;top:0;z-index:6;display:flex;gap:6px;padding:7px 0 6px;margin:-4px 0 4px;background:linear-gradient(180deg,var(--panel) 78%,transparent)}
  .wbnav span{font-family:var(--mono);font-size:9.5px;color:var(--mut);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;cursor:pointer;transition:.12s;white-space:nowrap}
  .wbnav span:hover{color:var(--y);border-color:var(--y)}
  .wbhead{display:flex;align-items:flex-start;gap:10px;margin:8px 0 12px}
  .wbhead .nm{font-size:15px;font-weight:800}.wbhead .meta{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:3px}
  .badge{margin-left:auto;font-size:10px;font-family:var(--mono);padding:4px 9px;border-radius:8px;border:1px solid;white-space:nowrap}
  .sec{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--y);margin:15px 0 9px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
  .sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--yglow),transparent)}
  .sec .x{flex:0 0 auto;font-size:9.5px;color:var(--mut2);letter-spacing:0}
  .sec .smain{flex:0 0 auto;white-space:nowrap}

<script id="ue-model">/*UE_MODEL_START*/
/* ============================================================================
 * 单元经济测算引擎 —— 全站唯一口径单源
 *
 * 浏览器：window.UEModel   Node：globalThis.UEModel
 * 用法：  UEModel.compute({dailyOrders: 200, landingPts: 4, takeoffRent: 9000, ...})
 *         UEModel.findBreakeven(cfg)            → 真实保本线
 *         UEModel.rentFromPoints(rentPoints[,y]) → 逐点租金折算成标量
 *         UEModel.project(cfg[, growth])         → 五年逐年推演
 *
 * 结构要点
 *   收入 = 单均配送收入(客单价×佣金率 + 平台费 + C端配送费) × 月单量 + 广告收入
 *   成本 = 人力 + 设备折旧 + 电池 + 场地办公 + 其他 + 网络运维 + 营销补贴
 *   驱动 = 日均单量。人力与设备都是阶梯量(ceil)，所以利润对单量非单调。
 *   租金 = 逐点四模式(固定 / 仅营业额提成 / 固定+营业额提成 / 固定+配送费提成)
 *          在 rentFromPoints 独立折算后写回标量，compute 只消费标量。
 *
 * 三页共用这一份文件，由 scripts/inject_ue.py 注入到各页的
 * /*UE_MODEL_START* / … /*UE_MODEL_END* / 标记区。改公式只改这里，改完重新注入。
 *
 * 演示说明：本文件里的全部参数取值均为虚构演示值，与任何真实业务无关。
 * ==========================================================================*/
(function (g) {
  'use strict';
  var ceil = Math.ceil, min = Math.min, max = Math.max, pow = Math.pow;

  /* —— 默认参数。★ 标的是业务输入，其余是规格常量。全部为虚构演示值 —— */
  var DEFAULTS = {
    // A 单量与运营（★业务输入）
    takeoffPts: 1,            // 起飞点数量
    landingPts: 4,            // 降落点数量（有逐点租金表时 = 表行数派生）
    routeDist: 2500,          // 平均航线距离 m（单程）
    dailyOrders: 200,         // ★日均单量 = 全部成本的驱动
    peakShare: 0.12,          // 峰值小时单量占比
    lastMileLandingPts: 2,    // 送货上门降落点数（末端配送人数下限）
    lastMileShare: 0.30,      // 送货上门订单占比
    // B 收入参数（★业务输入）
    aov: 52,                  // 实付客单价
    commissionRate: 0.18,     // 商家佣金率
    platformFee: 2,           // 平台费 /单
    deliveryFee: 11,           // C端配送费 /单
    marketing: 8000,          // 广告收入 /月（计入收入与利润）
    subsidyPerOrder: 0,       // 营销补贴 /单（我方承担，调用方按视图传档）
    // C 场地成本（★唯一真正可谈的成本）
    takeoffRent: 9000,
    landingRent: 12000,
    takeoffFitoutPerPt: 3500, // 起飞点每点装修月摊
    landingFitoutPerPt: 900,  // 降落点每点装修月摊
    // 人效与调休（规格）
    annualLeaveDays: 30, weeklyOffDays: 52,   // restFactor = 365/(365-30-52)
    pilotProd: 280, maintProd: 460, groundProd: 110,
    pickupProd: null,         // 取餐人效：null = 按取餐方式取值；显式数值优先
    pickupType: 'Ride',
    pickupProdByType: { Ride: 30, Walk: 50, Other: 40 },
    lastMileProd: 32, patrolProd: 180,
    patrolMinOrders: 180,     // 日均低于此值不配末端巡游
    groundCapPerTakeoff: 4,
    // 人力月薪
    salPilot: 9200, salMaint: 8600, salPickup: 3400, salGround: 4500,
    salLastMile: 3400, salPatrol: 3400,
    // 设备配比（规格）
    droneSpeed: 10,           // m/s 巡航
    takeoffLandingMin: 4,     // 起降阶段合计分钟
    droneIdle: 0.3,           // 闲置率（充电与维护）
    maxDrones: 24,            // 单起飞点机队上限
    markerPerTakeoff: 6,
    cabinetPerOrders: 150,    // 恒温柜：每 150 日单 1 个
    cabinetMaxPerTakeoff: 4,
    chargingPerCabinet: 2,
    storagePerDrones: 2,
    // 设备月折旧单价
    depDrone: 640, depMarker: 45, depPort: 2900, depCabinet: 300,
    depCharging: 120, depStorage: 85, depSpare: 115, depBoxReturn: 44,
    // 电池（规格）
    batteryPrice: 1700, batteryCycleLife: 600, batteryPackEnergy: 390,
    elecCost: 0.41, coulombic: 0.93,
    baseConsume: 0.35, marginalConsume: 0.08, baselineDist: 1700, batterySafety: 0.75,
    // 其他成本（规格）
    equipOM: 1000, opsSupplies: 900,
    simDrone: 580, simPort: 580, simHandheld: 480,
    vehiclePerTakeoff: 600, boxPerOrder: 0.3,
    droneInsurance: 130, rtkPerTakeoff: 200,
    venueElecPerUnit: 300, broadband: 1000, networkOM: 1000,
    daysPerMonth: 30,         // 月度视图 30；五年视图 project 内用 365/12

    /* 地面协同人力：取餐 + 末端配送 + 末端巡游。
       总开关 groundStaff 管取餐员（没有它餐到不了起飞点，不是划不划算的选项），
       末端两项另受 ROI 闸 lastMileSwitch 管，逐单量判。 */
    groundStaff: true,
    roiMultiple: 2,           // 末端 ROI 阈值倍数（假定值，待校准）
    lastMileSwitch: 'auto',   // auto 按 ROI 逐单量判 / on 恒计入 / off 恒不计
    equipDepOn: true,

    /* 逐点末端闸。不传 landingPools 时整段不启用，退回商圈级单闸。
         landingPools: [{ share, bands:[≤1km 占比, 1–2km 占比] }, …]
       归属口径 = 最近点：一单只归离它最近且在圈内的那个降落点，不重复计。 */
    landingPools: null,

    /* 关闸的标价：某个降落点关掉末端配送后只能柜取，该点上门订单按距离的留存率。
       这不是绝对自提意愿，是改变履约形态时的相对调整 —— 因为配送方式选择率的口径
       是「在大网配送与无人机配送之间选无人机的概率」，本身混合了柜取与上门两种形态。
       只取两档：≤1km 视为不丢单，1–2km 取 0.5，超出本就在降落圈外。 */
    lmKeepBands: [{ maxKm: 1.0, keep: 1.00 }, { maxKm: 2.0, keep: 0.50 }]
  };

  /* 营销补贴分档（假定值）。取值随站龄走，调用方按视图取档，不要在引擎里写死一个数。 */
  var SUBSIDY_TIERS = { steady: 2.5, firstYear: 7.5, firstHalf: 10 };

  /* 商圈上下文覆盖：起飞点就在商场里，取餐是楼内步行，人效远高于跑单口径。 */
  var DISTRICT_OVERRIDES = { pickupProd: 80, peakShare: 0.12 };

  function compute(o) {
    var p = Object.assign({}, DEFAULTS, o || {});
    var rest = 365 / (365 - p.annualLeaveDays - p.weeklyOffDays);
    var monthlyOrders = p.dailyOrders * p.daysPerMonth;
    var peakHourVol = p.dailyOrders * p.peakShare;
    var lastMileDaily = p.dailyOrders * p.lastMileShare;

    /* 单均收入前移：末端 ROI 闸在人力段就要用它。 */
    var merchantCommission = p.aov * p.commissionRate + p.platformFee;
    var revPerOrder = merchantCommission + p.deliveryFee;
    /* 净单均 = 毛单均 − 我方承担的补贴。末端 ROI 闸的分子只许用它：
       闸问的是多派这一班末端人力撬动的订单值不值这份人力，而订单拖进来的补贴是
       逐单流出，不管报表上它坐在收入减项还是成本行。分子分母必须同口径。 */
    var revPerOrderNet = revPerOrder - p.subsidyPerOrder;
    var pickupProd = (p.pickupProd != null) ? p.pickupProd
      : (p.pickupProdByType[p.pickupType] != null ? p.pickupProdByType[p.pickupType] : p.pickupProdByType.Other);

    /* —— 逐点末端闸 ——
       ① 每个降落点各判各的 ROI，分子分母都只算该点的上门订单与末端人力；
       ② 关闸的点只能柜取，该点上门订单按 lmKeepBands 留存率打折，收入与成本一起减。
       必须同时减收入：只删成本不删收入的话，关一个点永远是净赚，保本线只会降，
       那不是经济性变好，是模型少算一笔账。
       ROI 用该点未打折的需求算 —— 问的是在这里开末端值不值，开着就不丢单。 */
    var lmPts = null, demandDaily = p.dailyOrders;
    if (Array.isArray(p.landingPools) && p.landingPools.length) {
      var shTot = 0, i;
      for (i = 0; i < p.landingPools.length; i++) shTot += (+p.landingPools[i].share || 0);
      var even = !(shTot > 0);
      lmPts = p.landingPools.map(function (q, idx) {
        var sh = even ? 1 / p.landingPools.length : (+q.share || 0) / shTot;
        var dI = demandDaily * sh;
        var lmDI = dI * p.lastMileShare;
        // 逐点人数下限 = 1。商圈级的 lastMileLandingPts 在这一档不参与，
        // 否则低单量下每个点都 2 人起，ROI 被除散，逐点化会退化成全关。
        var staff = max(1, ceil(lmDI / p.lastMileProd)) * rest;
        var costI = staff * p.salLastMile;
        var leverI = dI * p.daysPerMonth * p.lastMileShare * revPerOrderNet;
        var roiI = costI > 0 ? leverI / costI : Infinity;
        var onI = !!p.groundStaff && (p.lastMileSwitch === 'on' ? true
          : p.lastMileSwitch === 'off' ? false : roiI >= p.roiMultiple);
        var bd = q.bands || [1], bsum = 0, keep = 0, k;
        for (k = 0; k < p.lmKeepBands.length; k++) bsum += (+bd[k] || 0);
        if (bsum <= 0) keep = p.lmKeepBands[0].keep;
        else for (k = 0; k < p.lmKeepBands.length; k++)
          keep += ((+bd[k] || 0) / bsum) * p.lmKeepBands[k].keep;
        return { i: idx, share: sh, daily: dI, lmDaily: lmDI, staff: staff, cost: costI,
                 leverRev: leverI, roi: roiI, on: onI, keep: keep,
                 lostDaily: onI ? 0 : lmDI * (1 - keep) };
      });
      var lost = 0;
      for (i = 0; i < lmPts.length; i++) lost += lmPts[i].lostDaily;
      p.dailyOrders = demandDaily - lost;
      monthlyOrders = p.dailyOrders * p.daysPerMonth;
      peakHourVol = p.dailyOrders * p.peakShare;
      lastMileDaily = p.dailyOrders * p.lastMileShare;
    }

    // —— 机队规模 ——
    var cycleMin = p.routeDist * 2 / p.droneSpeed / 60 + p.takeoffLandingMin;
    var tripsPerHr = 60 / cycleMin;

  document.getElementById('bRoute').onclick=function(){showRoutes=!showRoutes;
    this.classList.toggle('on',showRoutes);if(active!=null)buildLands();};
  document.getElementById('bAdd').onclick=function(){if(view!=='unit')return;
    arming=!arming;this.classList.toggle('arming',arming);
    map.getContainer().style.cursor=arming?'crosshair':'';};
  map.on('click',e=>{if(!arming||view!=='unit')return;const u=units[active];
    u.lands.push({nm:tx('降落点')+' '+(u.lands.length+1),lat:e.latlng.lat,lng:e.latlng.lng,rkm:1.0});
    syncLandingRent(u);arming=false;document.getElementById('bAdd').classList.remove('arming');
    map.getContainer().style.cursor='';buildLands();renderUnit();});
  /* 容器尺寸要自己盯着。首屏布局还没算完时 fitBounds 会按 0 宽算，得出一个离谱的缩放；
     之后换窗口宽度、进出全屏、拖到另一块屏都不一定伴随 window resize 事件。
     ⚠ 只在列表态重新取景 —— 进了工作台再自动拉回全域会把用户的视角抢走。 */
  const relayout=()=>{try{map.invalidateSize(false);}catch(_){}if(view==='list')fitAll();};
  [60,320,900].forEach(ms=>setTimeout(relayout,ms));
  let rzT=null;
  const onResize=()=>{clearTimeout(rzT);rzT=setTimeout(relayout,150);};
  window.addEventListener('resize',onResize);
  if(window.ResizeObserver)new ResizeObserver(onResize).observe(document.getElementById('map'));
}
function fitAll(){const b=[[M.bbox[0],M.bbox[1]],[M.bbox[2],M.bbox[3]]];
  map.fitBounds(b,{animate:false});map.setZoom(map.getZoom()+0.5,{animate:false});}

/* ---------- 图层构建 ---------- */
const dynMax=(arr,idx)=>{const v=arr.map(p=>p[idx]).filter(x=>x>0).sort((a,b)=>a-b);
  if(!v.length)return 1;return Math.max(v[Math.floor(v.length*.90)]||v[v.length-1],1);};
const heatRB=n=>n>20000?[7,6]:n>5000?[9,7]:n>1000?[12,9]:[17,12];
function cellDemand(c){try{return (hourRange[0]===0&&hourRange[1]===23)?c[2]
  :c[3].slice(hourRange[0],hourRange[1]+1).reduce((s,x)=>s+x,0);}catch(e){return c[2]||0;}}

function buildLayers(){
  const P=MAPPAL[thMode()];
  dRB=heatRB(M.demand.length); sRB=heatRB(M.shops.length);
  demLayer=L.heatLayer(M.demand.map(c=>[c[0],c[1],c[2]]),
    {radius:dRB[0],blur:dRB[1],maxZoom:15,max:dynMax(M.demand,2),gradient:P.dem,pane:'heatPane'});
  /* 供给权重开方后再进热力。商家销量是幂律长尾，直接拿销量当权重的话，
     头部几家会变成一串孤立的亮点，读出来是「哪几家大」而不是「哪片供给密」——
     而选址要看的是后者。开方压掉长尾，密度才显出来。 */
  const supW=M.shops.map(s=>[s[0],s[1],Math.sqrt(s[6]||1)]);
  supLayer=L.heatLayer(supW,{radius:sRB[0],blur:sRB[1],maxZoom:15,
    max:dynMax(supW,2)*1.15,gradient:P.sup,pane:'heatPane'});
  supMax=dynMax(supW,2)*1.15;
  demMax=dynMax(M.demand,2)*1.3;

  const areaCv=L.canvas({pane:'areaPane'}),secCv=L.canvas({pane:'sectorPane'});
  areaLayer=L.layerGroup();
  M.communities.forEach(c=>L.polygon(c.poly,{color:c.color,weight:.5,opacity:.25,fillColor:c.color,
    fillOpacity:.04,pane:'areaPane',renderer:areaCv,interactive:false,lyr:'comm'}).addTo(areaLayer));
  M.sectors.forEach(s=>{L.polygon(s.poly,{color:s.color,weight:1.5,opacity:.4,fill:false,dashArray:'10,6',
    pane:'sectorPane',renderer:secCv,interactive:false,lyr:'sect'}).addTo(areaLayer);
    L.marker(s.centroid,{icon:L.divIcon({className:'sector-label',html:s.name,iconSize:[170,18],iconAnchor:[85,9]}),
      pane:'labelPane',interactive:false}).addTo(areaLayer);});

  ['pink','red','beige'].forEach(k=>{const col=P.nfz[k],op=k==='pink'?P.nfz.fillPink:P.nfz.fillOther;
    const g=L.layerGroup();
    M.nfz[k].forEach(z=>{const pg=L.polygon(z.coords,{color:col,weight:1.3,fillColor:col,fillOpacity:op,
      pane:'nfzPane',interactive:false,lyr:'nfz',lyrK:k});pg.addTo(g);
      if(z.name)L.marker(pg.getBounds().getCenter(),{icon:L.divIcon({className:'nfz-label',html:z.name,
        iconSize:[110,12],iconAnchor:[55,6]}),pane:'labelPane',interactive:false}).addTo(g);});
    nfzG[k]=g;});

  const flowCv=L.canvas({pane:'flowPane',padding:1.2});flowLayer=L.layerGroup();
  const maxF=M.flows.length?M.flows[0][4]:1;
  const bez=(a,b,c,d,seg)=>{const mx=(a+c)/2,my=(b+d)/2,nx=-(d-b)*0.2,ny=(c-a)*0.2,cx=mx+nx,cy=my+ny,pts=[];
    for(let i=0;i<=seg;i++){const t=i/seg,u=1-t;pts.push([u*u*a+2*u*t*cx+t*t*c,u*u*b+2*u*t*cy+t*t*d]);}return pts;};
  M.flows.forEach(fl=>{const ratio=fl[4]/maxF;
    L.polyline(bez(fl[0],fl[1],fl[2],fl[3],12),{color:P.flow.color,weight:1.1+ratio*4,
      opacity:P.flow.oBase+ratio*P.flow.oSpan,pane:'flowPane',renderer:flowCv,interactive:false,
      lyr:'flow',lyrR:ratio}).addTo(flowLayer);});

  const villaCv=L.canvas({pane:'villaPane'});villaZoneLayer=L.layerGroup();
  M.villaZones.forEach(z=>L.polygon(z.poly,{color:P.villa.color,weight:1.1,opacity:P.villa.opacity,
    fillColor:P.villa.color,fillOpacity:P.villa.fillOpacity,dashArray:'6,4',pane:'villaPane',
    renderer:villaCv,interactive:false,lyr:'villa'}).addTo(villaZoneLayer));

  /* 配色三层：真实经营点位用发光金与电蓝，公网 POI 用低饱和实心退到背景，
     算法候选用空心环。三层之间不许互换，否则候选点会与真实点位看着一样。 */
  const poiCv=L.canvas({pane:'poiPane'});
  const dotLayer=(pts,col,r,tag)=>{const g=L.layerGroup();
    pts.forEach(p=>L.circleMarker([p[0],p[1]],{radius:r,weight:0,fillColor:col,fillOpacity:P.poiFill,
      pane:'poiPane',renderer:poiCv,interactive:false,lyr:tag}).addTo(g));return g;};
  poiSupply=dotLayer(M.pois.supply,P.poiSup,1.1,'poiSup');
  poiDemand=M.pois.demand.map((pts,i)=>dotLayer(pts,P.poiDem[i],1.2,'poiDem'+i));
  mallG={0:L.layerGroup(),1:L.layerGroup(),2:L.layerGroup()};
  const MALLR={0:4,1:3,2:2.5};
  M.pois.malls.forEach(m=>{const t=m[2];
    L.circleMarker([m[0],m[1]],{radius:MALLR[t],weight:0,fillColor:P.mall[t],fillOpacity:P.mallFill,
      pane:'mallPane',lyr:'mall',lyrT:t}).addTo(mallG[t]);});

  const droneCv=L.canvas({pane:'dronePane'});
  const mkDots=(arr,col,r,tag)=>{const g=L.layerGroup();
    arr.forEach(p=>L.circleMarker([p[0],p[1]],{radius:r,weight:1.1,color:col,opacity:P.dotOp,fill:true,
      fillColor:col,fillOpacity:P.dotFill,pane:'dronePane',renderer:droneCv,interactive:false,lyr:tag}).addTo(g));
    return g;};
  dHubLayer=mkDots(M.drone.hubs,P.dHub,2.8,'dHub');
  dLandBLayer=mkDots(M.drone.portsBldg,P.landB,2.2,'landB');
  dLandVLayer=mkDots(M.drone.portsVilla,P.landV,2.2,'landV');
  dRouteLayer=L.layerGroup();
  M.drone.routes.forEach(r=>L.polyline([[r[0],r[1]],[r[2],r[3]]],{color:P.droute,weight:.8,
    opacity:P.drouteOp,dashArray:'3,5',pane:'dronePane',renderer:droneCv,interactive:false,
    lyr:'droute'}).addTo(dRouteLayer));

  suggLayer=L.layerGroup(); planLayer=L.layerGroup(); buildPlanZones();

  LREG={supply:{layer:supLayer},demand:{layer:demLayer},areas:{layer:areaLayer},flow:{layer:flowLayer},
    villaZones:{layer:villaZoneLayer},
    poiSupply:{layer:poiSupply,poi:1},poiResi:{layer:poiDemand[0],poi:1},poiHotel:{layer:poiDemand[1],poi:1},
    poiOffice:{layer:poiDemand[2],poi:1},poiSchool:{layer:poiDemand[3],poi:1},poiPark:{layer:poiDemand[4],poi:1},
    poiVilla:{layer:poiDemand[5],poi:1},
    mallL:{layer:mallG[0]},mallM:{layer:mallG[1]},mallS:{layer:mallG[2]},
    nfzPink:{layer:nfzG.pink},nfzRed:{layer:nfzG.red},nfzBeige:{layer:nfzG.beige},
    dHub:{layer:dHubLayer},landB:{layer:dLandBLayer},landV:{layer:dLandVLayer},dRoute:{layer:dRouteLayer},
    sugg:{layer:suggLayer},planZone:{layer:planLayer}};
  checked={supply:1,demand:1,areas:1,flow:1,villaZones:1,poiSupply:1,poiVilla:1,mallL:1,mallM:1,mallS:1,
    dHub:0,landB:0,landV:0,dRoute:0,sugg:0,planZone:0,
    poiResi:0,poiHotel:0,poiOffice:0,poiSchool:0,poiPark:0,nfzPink:0,nfzRed:0,nfzBeige:0};
  map.on('zoomend',tuneHeat);
  map.on('zoomend',()=>Object.keys(LREG).forEach(id=>{if(LREG[id].poi)applyLayer(id);}));
  map.whenReady(()=>setTimeout(tuneHeat,300));
}
const POI_Z=11;
function applyLayer(id){const e=LREG[id];if(!e||!e.layer)return;
  const want=checked[id]&&(!e.poi||map.getZoom()>=POI_Z);
  if(want&&!map.hasLayer(e.layer))e.layer.addTo(map);
  else if(!want&&map.hasLayer(e.layer))map.removeLayer(e.layer);}
function applyAll(){Object.keys(LREG).forEach(applyLayer);}

/* 网格是 222 m 的采样格，放大后半径钉死就会越放越稀，所以让半径跟着格距走。
   ⚠ 不做网格插值：拉到很近时会看见采样网格，这是数据分辨率的固有结果，不是渲染缺陷。 */
const cellPx=()=>222/(156543.03392*Math.cos(map.getCenter().lat*Math.PI/180)/Math.pow(2,map.getZoom()));
function rebuildDemHeat(){const pts=[],ws=[];
  for(const c of M.demand){const v=cellDemand(c);if(v>0){pts.push([c[0],c[1],v]);ws.push(v);}}
  ws.sort((a,b)=>a-b);demMax=Math.max((ws[Math.floor(ws.length*0.92)]||1)*1.3,1);
  demLayer.setLatLngs(pts);tuneHeat();}
function tuneHeat(){if(!demLayer)return;
  const z=map.getZoom(),foc=z>=13,rf=z<=10?-4:foc?3:1,mf=foc?0.72:0.85;
  const g=foc?Math.round(cellPx()*0.48):0;
  const dR=Math.max(6,dRB[0]+rf,g),sR=Math.max(6,sRB[0]+rf,g);
  /* 各自 try 不可省：图层被关掉后热力插件的画布是 null，setOptions 内部重绘会抛。
     用 try 而不是 hasLayer 跳过 —— setOptions 是先写 options 再重绘，
     抛错时赋值已经完成，跳过反而会让关闭期间的参数更新丢失。 */
  try{demLayer.setOptions({radius:dR,blur:Math.max(7,Math.round(dR*0.75)),max:demMax*mf});}catch(e){}
  try{supLayer.setOptions({radius:sR,blur:Math.max(7,Math.round(sR*0.7)),max:supMax*mf});}catch(e){}}

function applyMapTheme(mode){
  if(!demLayer)return;
  const P=MAPPAL[mode]||MAPPAL.dark;
  try{baseTile.setUrl(P.tile);}catch(e){}
  try{demLayer.setOptions({gradient:P.dem});}catch(e){}
  try{supLayer.setOptions({gradient:P.sup});}catch(e){}
  const restyle=g=>{if(!g||!g.eachLayer)return;g.eachLayer(l=>{
    if(l.eachLayer){restyle(l);return;}
    if(!l.setStyle||!l.options)return;
    const k=l.options.lyr;if(!k)return;
    if(k==='comm')l.setStyle(P.comm);
    else if(k==='sect')l.setStyle(P.sect);
    else if(k==='nfz')l.setStyle({color:P.nfz[l.options.lyrK],fillColor:P.nfz[l.options.lyrK],
      fillOpacity:l.options.lyrK==='pink'?P.nfz.fillPink:P.nfz.fillOther});
    else if(k==='flow')l.setStyle({color:P.flow.color,opacity:P.flow.oBase+(l.options.lyrR||0)*P.flow.oSpan});
    else if(k==='villa')l.setStyle({color:P.villa.color,fillColor:P.villa.color,
      opacity:P.villa.opacity,fillOpacity:P.villa.fillOpacity});
    /* 只换颜色与不透明度，不碰 radius：点径两档必须一致，否则切主题时点会变大变小。 */
    else if(k==='poiSup')l.setStyle({fillColor:P.poiSup,fillOpacity:P.poiFill});
    else if(k.indexOf('poiDem')===0)l.setStyle({fillColor:P.poiDem[+k.slice(6)]||P.poiDem[0],fillOpacity:P.poiFill});
    else if(k==='mall')l.setStyle({fillColor:P.mall[l.options.lyrT],fillOpacity:P.mallFill});
    else if(k==='dHub'||k==='landB'||k==='landV'){const c=P[k];
      l.setStyle({color:c,fillColor:c,opacity:P.dotOp,fillOpacity:P.dotFill});}
    else if(k==='droute')l.setStyle({color:P.droute,opacity:P.drouteOp});
    else if(k==='ringSup')l.setStyle({color:P.ringSup.color,fillColor:P.ringSup.color,
      fillOpacity:P.ringSup.fillOpacity,weight:P.ringSup.weight});
    else if(k==='ringLand')l.setStyle({color:P.ringLand.color,fillColor:P.ringLand.color,
      fillOpacity:P.ringLand.fillOpacity,weight:P.ringLand.weight});
    else if(k==='ringSugg')l.setStyle({fillOpacity:P.ringSugg.fillOpacity,weight:P.ringSugg.weight});});};
  [areaLayer,flowLayer,villaZoneLayer,poiSupply,mallG[0],mallG[1],mallG[2],
   dHubLayer,dLandBLayer,dLandVLayer,dRouteLayer].forEach(restyle);
  poiDemand.forEach(restyle);['pink','red','beige'].forEach(k=>restyle(nfzG[k]));
  restyle(map);   // 取餐圈 降落圈 推荐圈是直接 addTo(map) 的，不在任何 layerGroup 里
}

/* ---------- 起讫配对 ---------- */
/* odNear：以起飞点为心枚举附近起点格，还原成 [起点纬,起点经,终点纬,终点经,单量] 五元组。
   只取起点落在取餐圈内的格子，消费方各自再过滤终点。
   ⚠ 起点格步长跟着数据走，不硬编码 —— 它由取数的归格步长决定。
     两边写死两个值时，细格会折叠进粗键、起点被还原到偏半格的位置，一声不吭地算错池子。 */
function odNear(hLat,hLng,SR){const OG=OD.origin_grid,out=[],
    ci=Math.round(hLat/OG),cj=Math.round(hLng/OG),
    nI=Math.ceil(SR/111/OG)+1,nJ=Math.ceil(SR/(111*Math.cos(hLat*Math.PI/180))/OG)+1;
  for(let i=-nI;i<=nI;i++){const oLa=+((ci+i)*OG).toFixed(5);
    for(let j=-nJ;j<=nJ;j++){const cell=OD.byCell[(ci+i)+','+(cj+j)];if(!cell)continue;
      const oLn=+((cj+j)*OG).toFixed(5);if(hav(oLa,oLn,hLat,hLng)>SR)continue;
      for(let m=0;m<cell.length;m++){const d=cell[m];out.push([oLa,oLn,d[0],d[1],d[2]]);}}}
  return out;}

/* 归属口径 = 最近点：一单只归离它最近、且在该点圈内的降落点，不重复计。
   并集口径（每个点各算各的圈）会把同一单算给多个点，订单池虚高。
   bands 按到所归降落点的实际距离落档，供引擎算「关闸的标价」。 */
function odMatch(u){
  const SR=(u.supplyRkm!=null?u.supplyRkm:SUPPLY_RKM_DEF),lands=u.lands,nL=lands.length,
    KB=(window.UEModel&&UEModel.DEFAULTS.lmKeepBands)||[{maxKm:1,keep:1}],NB=KB.length,
    bd=lands.map(L0=>({L:L0,odPoolWin:0,bands:new Array(NB).fill(0)})),od=odNear(u.hubLat,u.hubLng,SR);
  let unit=0;
  for(let i=0;i<od.length;i++){const f=od[i];
    if(hav(f[0],f[1],u.hubLat,u.hubLng)>SR)continue;
    let bi=-1,b=Infinity;
    for(let j=0;j<nL;j++){const d=hav(f[2],f[3],lands[j].lat,lands[j].lng);
      if(d<=lands[j].rkm&&d<b){b=d;bi=j;}}
    if(bi<0)continue;
    bd[bi].odPoolWin+=f[4];
    let bk=NB-1;for(let k=0;k<NB;k++){if(b<=KB[k].maxKm){bk=k;break;}}
    bd[bi].bands[bk]+=f[4];unit+=f[4];}
  return {unitPoolWin:unit,breakdown:bd,supplyRkm:SR};}

function aggUnit(u){
  const SR=(u.supplyRkm!=null?u.supplyRkm:SUPPLY_RKM_DEF);
  const odm=odMatch(u),o=odm.unitPoolWin;
  let valid=0,merch=0,sku=0;const cats=new Set(),brands=new Set();
  for(const s of M.shops)if(hav(s[0],s[1],u.hubLat,u.hubLng)<=SR){
    merch++;if(s[2])valid++;if(s[3])cats.add(s[3]);if(s[4])brands.add(s[4]);sku+=s[5];}
  const mo=moOf(o);
  /* 可承接率 = 商家覆盖 × 商品覆盖。
     商品覆盖乘的是条件比率（已上架 ÷ 已签可供给），不是 已上架 ÷ 圈内高销品 ——
     后者分母含未签店，本身已经包含商家覆盖，再乘一次会把商家覆盖算两遍。
     商家覆盖是假定值的商圈整档维持假定，不叠乘实测的商品覆盖：
     假定值 × 实测 0% 得到的「0 单/天」是个假精确，看着像结论，其实一半是猜的。 */
  const sup=u.supply||null, cov=sup&&sup.coverage, cn=cov?cov[cov.default||'near']:null;
  const pc=(sup&&sup.itemCov&&typeof sup.itemCov.rate==='number')?sup.itemCov.rate:null;
  const mix=(cn!=null)&&(pc!=null);
  const acc=(u.servableRate!=null)?u.servableRate:(mix?cn*pc:(cn!=null?cn:0.4));
  const kdMonthly=mo*acc*u.pickRate, dailyOrders=kdMonthly/30;
  let rd=2500;
  if(u.lands.length){let s=0;for(const L0 of u.lands)s+=hav(u.hubLat,u.hubLng,L0.lat,L0.lng)*1000;
    rd=Math.max(500,Math.min(6000,Math.round(s/u.lands.length)));}
  /* 逐点末端闸接线：把每个降落点的池子占比与距离构成交给引擎，由引擎逐点判开关。
     ⚠ 没有起讫数据时不传 —— 引擎会退成等分，而等分在这里是个假精确。 */
  const landingPools=(odm.unitPoolWin>0)
    ?odm.breakdown.map(b=>({share:b.odPoolWin,bands:b.bands})):null;
  const cfg=Object.assign({takeoffPts:1,landingPts:u.lands.length||1,routeDist:rd,
    takeoffRent:u.takeoffRent,landingRent:u.landingRent,
    marketing:0,                                   // 商圈没有商业化数据，不替商圈创造
    takeoffFitoutM:3500,landingFitoutM:(u.lands.length||1)*900,
    landingPools:landingPools,
    subsidyPerOrder:UEModel.SUBSIDY_TIERS.steady}, UEModel.DISTRICT_OVERRIDES);
  const ue=UEModel.compute(Object.assign({dailyOrders},cfg));
  const be=UEModel.findBreakeven(cfg);             // 真实保本，成本随单量阶梯
  const signRate=sup?((sup.signed+sup.signing)/Math.max(sup.shops,1)):null;
  return {o,mo,merch,valid,cats:cats.size,brands:brands.size,sku,acc,kdMonthly,dailyOrders,
    routeDist:rd,ue,win:ue.profit>=0,be,sup,signRate,od:odm};}

/* ---------- 系统推荐降落点 ---------- */
const SUGGP={R_MIN:1.0,R_MAX:3.5,CLUSTER:1.0,SEP:1.0,TOP:3,DECAY:0.15,GEN:12};
let SUGG=[];
function pipJS(la,ln,poly){let inside=false,n=poly.length,j=n-1;
  for(let i=0;i<n;i++){const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];
    if(((yi>la)!=(yj>la))&&(ln<(xj-xi)*(la-yi)/((yj-yi)||1e-12)+xi))inside=!inside;j=i;}
  return inside;}
function sectorNameJS(la,ln){for(const s of (M.sectors||[])){
    if(s.poly&&pipJS(la,ln,s.poly))return (String(s.name||'').split('·').pop()||'').trim()||tx('候选');}
  return tx('候选');}
function findSuggested(u,acc){
  const P=SUGGP,GH=0.002,SR=(u.supplyRkm!=null?u.supplyRkm:SUPPLY_RKM_DEF),
    od=odNear(u.hubLat,u.hubLng,SR),lands=u.lands;
  if(!od.length)return [];
  const gk=(la,ln)=>Math.round(la/GH)+'_'+Math.round(ln/GH);
  const hard=(M.nfz.pink||[]).concat(M.nfz.red||[]).map(z=>z.coords);
  const inConf=(la,ln)=>lands.some(L0=>hav(la,ln,L0.lat,L0.lng)<=L0.rkm);
  const inHard=(la,ln)=>hard.some(z=>pipJS(la,ln,z));
  const odcell={};
  for(const f of od){if(hav(f[0],f[1],u.hubLat,u.hubLng)<=SR){const k=gk(f[2],f[3]);odcell[k]=(odcell[k]||0)+f[4];}}
  const cv=c=>odcell[gk(c[0],c[1])]||0;
  let curWin=0;
  for(const f of od){if(hav(f[0],f[1],u.hubLat,u.hubLng)<=SR&&inConf(f[2],f[3]))curWin+=f[4];}
  const curDaily=curWin/DAYS;
  const pool=[];
  for(const c of M.demand){if(cv(c)<=0)continue;
    const dh=hav(u.hubLat,u.hubLng,c[0],c[1]);
    if(dh<P.R_MIN||dh>P.R_MAX)continue;
    if(inConf(c[0],c[1])||inHard(c[0],c[1]))continue;
    pool.push(c);}
  pool.sort((a2,b)=>cv(b)-cv(a2));
  const used=new Array(pool.length).fill(false),cands=[];
  for(let idx=0;idx<pool.length;idx++){
    if(used[idx]||cands.length>=P.GEN)continue;
    const seed=pool[idx],mem=[];
    for(let k=0;k<pool.length;k++){if(!used[k]&&hav(seed[0],seed[1],pool[k][0],pool[k][1])<=P.CLUSTER)mem.push(k);}
    if(!mem.length)continue;
    let cov=0,wl=0,wn=0;
    for(const k of mem){const v=cv(pool[k]);cov+=v;wl+=pool[k][0]*v;wn+=pool[k][1]*v;}
    if(cov<=0){mem.forEach(k=>used[k]=true);continue;}
    wl/=cov;wn/=cov;
    if(lands.some(L0=>hav(wl,wn,L0.lat,L0.lng)<P.SEP)||cands.some(c=>hav(wl,wn,c.lat,c.lng)<P.SEP)){
      mem.forEach(k=>used[k]=true);continue;}
    cands.push({lat:+wl.toFixed(5),lng:+wn.toFixed(5),coveredWindow:cov,
      distHubKm:+hav(u.hubLat,u.hubLng,wl,wn).toFixed(2)});
    mem.forEach(k=>used[k]=true);}
  for(const c of cands){const cd=c.coveredWindow/DAYS;
    let dem=0;for(const cc of M.demand)if(hav(cc[0],cc[1],c.lat,c.lng)<=P.CLUSTER)dem+=cc[2];
    c.coveredDaily=+cd.toFixed(1);
    c.odWeight=dem>0?+(c.coveredWindow/dem).toFixed(3):0;
    c.score=+(cd*Math.max(0.5,1-P.DECAY*c.distHubKm)).toFixed(1);
    c.dailyPotential=+(cd*acc*u.pickRate).toFixed(1);
    c.vsBaselinePct=curDaily>0?Math.round(cd/curDaily*100):0;
    c.name=sectorNameJS(c.lat,c.lng);delete c.coveredWindow;}
  cands.sort((a2,b)=>b.score-a2.score);
  const top=cands.slice(0,P.TOP);
  /* 同一个分区里可能选出两个候选，光靠分区名会重名。重名的按序号补一个后缀，
     免得列表里出现两行一模一样的标题、采纳完也分不清哪个是哪个。 */
  const seen={};
  top.forEach((c,i)=>{c.rank=i+1;
    seen[c.name]=(seen[c.name]||0)+1;
    if(seen[c.name]>1)c.name=c.name+' '+seen[c.name];});
  return top;}
function buildSugg(){suggLayer.clearLayers();
  SUGG.forEach((f,i)=>{const col='#34D3FF',P=MAPPAL[thMode()];
    const ring=L.circle([f.lat,f.lng],{radius:1000,color:col,weight:P.ringSugg.weight,dashArray:'2 6',
      fillColor:col,fillOpacity:P.ringSugg.fillOpacity,interactive:true,lyr:'ringSugg'});
    const badge=L.marker([f.lat,f.lng],{zIndexOffset:900,
      icon:L.divIcon({className:'',html:'<div class="suggIcon"></div>',iconSize:[11,11],iconAnchor:[5.5,5.5]})});
    const pop='<div style="font:11px/1.6 sans-serif;min-width:180px"><b style="font-size:11.5px">'+
      (f.rank||i+1)+' · '+(f.name||'')+'</b><br>'+tx('潜在')+' '+f.dailyPotential+tx('单/天')+
      ' (+'+f.vsBaselinePct+'%)<br>'+tx('距起飞点')+' '+f.distHubKm+' km<br>'+
      '<button style="margin-top:6px;cursor:pointer;font-size:10px;background:transparent;color:#34D3FF;'+
      'border:1px solid #34D3FF;border-radius:6px;padding:2px 9px;font-weight:600" onclick="adoptSugg('+i+')">✓ '+

function paintSuggList(){const il=document.getElementById('suggList');if(!il)return;

/* 地名查坐标。用公开的 Nominatim 服务，viewbox 限定在演示范围内并 bounded=1，
   这样搜出来的点一定落在图上；不写国家代码，范围由 bbox 自己决定。 */
function bindGeo(){
  const ge=document.getElementById('auGeo'); if(!ge)return;
  const row=document.getElementById('auGeoRow'),
        q=document.getElementById('auGeoQ'),
        st=document.getElementById('auGeoS');
  ge.onclick=()=>{row.style.display=row.style.display==='none'?'flex':'none';
    if(row.style.display==='flex')q.focus();};
  q.onkeydown=e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    const kw=q.value.trim(); if(!kw)return;
    st.textContent=tx('查询中…');
    const vb=[M.bbox[1],M.bbox[2],M.bbox[3],M.bbox[0]].join(',');
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&bounded=1&viewbox='+vb+'&q='+encodeURIComponent(kw))
      .then(r=>r.json())
      .then(j=>{
        if(!j||!j.length){st.textContent=tx('未找到');return;}
        document.getElementById('auLa').value=(+j[0].lat).toFixed(5);
        document.getElementById('auLn').value=(+j[0].lon).toFixed(5);
        st.textContent='';})
      .catch(()=>{st.textContent=tx('查询失败');});};
}

function buildLands(){const u=units[active];

    const rt=showRoutes?L.polyline([[u.hubLat,u.hubLng],[L0.lat,L0.lng]],

/* ---------- 时段栏 ---------- */
function drawTimeBar(){if(!M)return;
  const hmax=Math.max(...M.hourly,1),f=hourRange[0]>0||hourRange[1]<23;
  document.getElementById('tbsel').textContent=f
    ?`${String(hourRange[0]).padStart(2,'0')}–${String(hourRange[1]).padStart(2,'0')}${tx('时')}`
    :`${tx('全天')} 00–23${tx('时')}`;
  document.getElementById('tbbars').innerHTML=M.hourly.map((v,h)=>
    `<i class="${h>=hourRange[0]&&h<=hourRange[1]?'on':''}" style="height:${Math.max(6,Math.round(v/hmax*100))}%" title="${String(h).padStart(2,'0')}:00 · ${v.toLocaleString()}"></i>`).join('');}
function setupTimeBar(){const bars=document.getElementById('tbbars');drawTimeBar();
  let brushing=false,bStart=0;
  const hourAt=e=>{const r=bars.getBoundingClientRect();
    return Math.max(0,Math.min(23,Math.floor((e.clientX-r.left)/r.width*24)));};
  const setR=(a,b)=>{hourRange=[Math.min(a,b),Math.max(a,b)];drawTimeBar();};
  const apply=()=>{rebuildDemHeat();if(view==='unit'&&active!=null)renderUnit();};
  bars.addEventListener('pointerdown',e=>{brushing=true;bStart=hourAt(e);setR(bStart,bStart);
    try{bars.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  bars.addEventListener('pointermove',e=>{if(brushing)setR(bStart,hourAt(e));});
  bars.addEventListener('pointerup',()=>{if(brushing){brushing=false;apply();}});
  bars.addEventListener('pointercancel',()=>{if(brushing){brushing=false;apply();}});
  document.getElementById('tbrst').onclick=()=>{hourRange=[0,23];drawTimeBar();apply();};}

/* ---------- 截图 ----------
   为什么不整页截图：外发图绝不能带经营数据，而「渲染完再把面板擦掉」这条路
   依赖人记得关。这里只从地图 pane 取像素 —— 左栏数据概览、右栏商圈卡、时段条
   压根不进入合成，所以「忘了关面板」在物理上无法泄露，不是靠纪律保证的。
   热力保留形态但不给任何数值标尺，图例只出颜色与名称、不出计数。
   ⚠ 瓦片必须带 crossOrigin，否则 drawImage 会污染画布，toBlob 直接抛。 */
const SHOT_MAXPX=6e7;
const SHOT_DENY=/\d{1,3}(?:,\d{3})+|\d+(?:\.\d+)?\s*(?:万|亿|单\/天|单\/月|%)|订单池|保本线|月利润|利润率|覆盖率|可承接率|承受租金/;
function shotPanes(){const mp=document.querySelector('#map .leaflet-map-pane');if(!mp)return [];
  return Array.from(mp.children).filter(el=>el.classList&&el.classList.contains('leaflet-pane'))
    .map(p=>({p,z:parseInt(getComputedStyle(p).zIndex,10)||0})).sort((a,b)=>a.z-b.z).map(o=>o.p);}
function shotTexts(){const out=[];
  shotPanes().forEach(p=>p.querySelectorAll('*').forEach(el=>{
    if(el.classList&&el.classList.contains('bLabel'))return;   // 商圈名不进图
    Array.from(el.childNodes).forEach(n=>{if(n.nodeType===3){const t=n.textContent.trim();if(t)out.push(t);}});}));
  return out;}
function shotRR(c,x,y,w,h,r){r=Math.max(0,Math.min(r,Math.min(w,h)/2));
  c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function shotEl(c,root,base,k){(function walk(el){
  if(el.classList&&el.classList.contains('bLabel'))return;
  const cs=getComputedStyle(el);
  if(cs.display==='none'||cs.visibility==='hidden'||parseFloat(cs.opacity)===0)return;
  const r=el.getBoundingClientRect();if(!r.width||!r.height)return;
  const x=(r.left-base.left)*k,y=(r.top-base.top)*k,w=r.width*k,h=r.height*k;
  const rad=(parseFloat(cs.borderTopLeftRadius)||0)*k;
  c.save();c.globalAlpha=parseFloat(cs.opacity)||1;
  const bg=cs.backgroundColor;
  if(bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent'){
    if(cs.boxShadow&&cs.boxShadow!=='none'){c.save();c.globalAlpha*=.3;c.fillStyle=bg;
      shotRR(c,x-3*k,y-3*k,w+6*k,h+6*k,rad+3*k);c.fill();c.restore();}
    c.fillStyle=bg;shotRR(c,x,y,w,h,rad);c.fill();}
  const bw=parseFloat(cs.borderTopWidth)||0;
  if(bw>0&&cs.borderTopStyle!=='none'){c.strokeStyle=cs.borderTopColor;c.lineWidth=bw*k;
    shotRR(c,x,y,w,h,rad);c.stroke();}
  const txt=Array.from(el.childNodes).filter(n=>n.nodeType===3).map(n=>n.textContent).join('').trim();
  if(txt){c.fillStyle=cs.color;
    c.font=cs.fontStyle+' '+cs.fontWeight+' '+Math.round(parseFloat(cs.fontSize)*k)+'px '+cs.fontFamily;
    c.textBaseline='middle';c.textAlign=(cs.textAlign==='center'?'center':'left');
    c.fillText(txt,c.textAlign==='center'?x+w/2:x,y+h/2);}
  c.restore();
  Array.from(el.children).forEach(walk);})(root);}
const SHOT_LEGW=208;
function shotLegend(c,LW,H,k){
  const lt=thMode()==='light',ff=getComputedStyle(document.body).fontFamily,on=id=>checked[id];
  /* 渐变条按主题取，不能用初始常量：浅色档下地图跑的是浅色色带，
     图例却画深色档的色，导出图里两者对不上。 */
  const HP=MAPPAL[lt?'light':'dark'];
  const heat=[];
  if(on('demand'))heat.push([HP.dem,tx('需求热力 (送货)')]);
  if(on('supply'))heat.push([HP.sup,tx('供给热力 (取货)')]);
  const skip={demand:1,supply:1};
  const rows=[{id:'__hub',lb:tx('起飞点')},{id:'__land',lb:tx('降落点')}];
  PANEL.forEach(s=>s.items.forEach(it=>{if(it.id&&on(it.id)&&!skip[it.id])rows.push({id:it.id,lb:tx(it.lb)});}));
  const pad=16*k,gw=LW-pad*2;
  c.save();
  c.fillStyle=lt?'#F4F6FA':'#0B0C16';c.fillRect(0,0,LW,H);
  c.fillStyle=lt?'rgba(0,0,0,.10)':'rgba(255,255,255,.08)';c.fillRect(LW-1*k,0,1*k,H);
  c.textBaseline='middle';c.textAlign='left';
  let y=pad+10*k;
  c.fillStyle=lt?'#8F6B00':'#FFD100';c.font='700 '+(11*k)+'px '+ff;
  c.fillText(tx('选址沙盘'),pad,y);y+=20*k;
  heat.forEach(([grad,lb])=>{
    const g=c.createLinearGradient(pad,0,pad+gw,0);
    Object.keys(grad).forEach(stop=>g.addColorStop(+stop,grad[stop]));
    c.fillStyle=g;c.fillRect(pad,y,gw,7*k);
    c.fillStyle=lt?'#4F4D46':'#E9EEF9';c.font=(9.5*k)+'px '+ff;
    c.fillText(lb,pad,y+17*k);
    c.fillStyle=lt?'#6E6C65':'#6B7997';c.font=(8.5*k)+'px '+ff;
    c.fillText(tx('低'),pad,y+28*k);
    c.textAlign='right';c.fillText(tx('高'),pad+gw,y+28*k);c.textAlign='left';
    y+=38*k;});
  y+=4*k;
  rows.forEach(r=>{
    const col=r.id==='__hub'?(lt?'#B5850A':'#FFD100'):r.id==='__land'?(lt?'#3557C8':'#5E84F5'):legDot(r.id,'#888');
    c.fillStyle=col;c.beginPath();c.arc(pad+3*k,y,3.4*k,0,Math.PI*2);c.fill();
    c.fillStyle=lt?'#4F4D46':'#C8D2E4';c.font=(9.5*k)+'px '+ff;
    c.fillText(r.lb,pad+12*k,y+.5*k);y+=17*k;});
  c.fillStyle=lt?'#6E6C65':'#6B7997';c.font=(8.5*k)+'px '+ff;
  c.fillText(tx('热力为相对密度 · 不含绝对量'),pad,H-pad);
  c.restore();}
async function exportShot(btn){
  const old=btn?btn.textContent:'';
  try{
    const bad=shotTexts().find(t=>SHOT_DENY.test(t));
    if(bad){alert(tx('出图已中止：图层里出现了不该进图的数据文字')+'\n· '+bad);return;}
    if(btn){btn.textContent='⧉ '+tx('出图中');btn.style.pointerEvents='none';}
    await new Promise(r=>setTimeout(r,60));
    const cont=map.getContainer(),base=cont.getBoundingClientRect();
    let k=Math.min(2,window.devicePixelRatio||1);
    /* 画布面积是硬上限，越限不报错只是画不出来，所以宁可降清晰度也不越界。 */
    while((base.width+SHOT_LEGW)*k*base.height*k>SHOT_MAXPX&&k>0.5)k-=0.1;
    const LW=Math.round(SHOT_LEGW*k),W=Math.round(base.width*k),H=Math.round(base.height*k);
    const cv=document.createElement('canvas');cv.width=LW+W;cv.height=H;
    const c=cv.getContext('2d');
    c.fillStyle=thMode()==='light'?'#EEF1F6':'#08090f';c.fillRect(LW,0,W,H);
    shotLegend(c,LW,H,k);
    c.save();c.translate(LW,0);
    shotPanes().forEach(p=>{
      p.querySelectorAll('img.leaflet-tile').forEach(img=>{
        if(!img.complete||!img.naturalWidth)return;
        const r=img.getBoundingClientRect();
        c.drawImage(img,(r.left-base.left)*k,(r.top-base.top)*k,r.width*k,r.height*k);});
      p.querySelectorAll('canvas').forEach(cn=>{
        const r=cn.getBoundingClientRect();
        c.drawImage(cn,(r.left-base.left)*k,(r.top-base.top)*k,r.width*k,r.height*k);});
      p.querySelectorAll('.leaflet-marker-icon,.sector-label,.nfz-label').forEach(el=>shotEl(c,el,base,k));});
    c.restore();
    const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='site-sandbox.png';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
  }catch(e){
    alert(tx('出图失败')+'：'+(e&&e.message||e));
  }finally{if(btn){btn.textContent=old;btn.style.pointerEvents='';}}}

/* ---------- 外框 i18n ---------- */
function applyStatic(){
  document.getElementById('bkTxt').textContent=tx('返回经营门户');
  document.getElementById('ptStage').textContent=tx('开航① · 开在哪');
  document.getElementById('ptTitle').innerHTML=(LANG==='en'?'<b>Site</b> Sandbox':'<b>选址</b> 沙盘')+
    '<span class="ptsub"> · '+tx('圈选测算 · 需求洞察')+'</span>';
  document.getElementById('liveTxt').textContent=tx('实时测算');
  document.getElementById('crumbTxt').textContent=' · '+tx('演示数据 · 脚本生成')+(M?' · '+M.window:'');
  document.getElementById('bAdd').textContent='＋ '+tx('点选加降落点');
  document.getElementById('bRoute').textContent='✦ '+tx('航线连接');
  document.getElementById('bFit').textContent='⤢ '+tx('全域');
  document.getElementById('bShot').textContent='⧉ '+tx('截图');
  document.getElementById('tbtTitle').textContent=tx('⏱ 时段分布 · 当地时间');
  document.getElementById('tbrst').textContent=tx('重置');
  document.title=tx('选址沙盘');}
function switchLang(lang){LANG=lang;
  document.documentElement.lang=lang==='en'?'en':'zh-CN';
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  renderThemeBtn();applyStatic();buildSidebar();
  if(view==='unit'&&active!=null)renderUnit();else renderList();
  drawTimeBar();}
</script>
