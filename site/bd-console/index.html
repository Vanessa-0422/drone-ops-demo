  };
  if (listQ) { const ql = listQ.toLowerCase(); list = list.filter(m => String(m.n).toLowerCase().includes(ql)); }
  const shown = list.slice(0, listLimit);
  if (!shown.length) return `<div class="ltabs">${tabs}${searchBox()}${sortSel}</div>
    <div class="emptyst"><b>${tx('无匹配结果')}</b><span>${tx('换个视角或清除搜索与筛选')}</span>${listQ ? `<button class="emptybtn" onclick="setQ('')">${tx('清除搜索')}</button>` : ''}</div>`;
  return `<div class="ltabs">${tabs}${searchBox()}${sortSel}</div>
    <div class="tblwrap"><table>
      <tr><th></th><th>${tx('商家')}</th><th>${thMCat}</th><th class="num">${tx('圈内订单')}</th><th class="num">GTV</th>${thHi}${thSt}<th>${thQual}</th><th>${thAct}</th></tr>
      ${shown.map((m, i) => `<tr><td class="rank">${i + 1}</td><td class="mname" title="${esc(m.n)}"><span class="mcell">${chev(m)}<b>${esc(m.n)}</b>${marks(m)}</span></td><td>${m.cat ? esc(tx(m.cat) || m.cat) : '—'}</td><td class="num">${nf(m.o)}</td><td class="num">${money(m.g || 0)}</td>${tdHi(m)}${tdSt(m)}<td>${qBadge(m)}</td><td>${actOf(m)}</td></tr>${prow(m, nCols)}`).join('')}
    </table></div>${moreBar(list.length, shown.length)}`;
}

/* ---------- 底部助手栏（常驻两视图） ---------- */
const PROMPTS = [
  { q: '今天我该优先拜访哪些商家？', d: '按转正贡献排序的未签商家名单' },
  { q: '还有哪些高销商家没签？', d: '带订单量与 GTV 的建议名单' },
  { q: '哪些高销品还没上架？', d: '催上架与催开通的作业动线' },
  { q: '帮我出这家商家的洽谈要点', d: '洽谈案与机会点话术方向' },
  { q: '商品覆盖还缺哪些品类？', d: '高销品覆盖缺口清单' },
  { q: '离转正还差多少单？', d: '保本线与缺口（与经营工具同源）' },
  { q: '已签商家最近有什么异常变化？', d: '签约趋势与预警' },
];
function promptBar() {
  const chips = PROMPTS.map(p =>
    `<button class="pc" title="${esc(tx(p.d))} · ${tx('复制提示词')}" onclick="copyPrompt('${esc(tx(p.q)).replace(/'/g, '')}')">❯ ${tx(p.q)}</button>`).join('');
  $('pbar').innerHTML = `<span class="plab">${tx('问业务助手')}</span><div class="pchips">${chips}</div><span class="pnote">${tx('复制后粘贴到业务助手')}</span>`;
  fitBarPad(); fitSticky();
}
function copyPrompt(q) {
  /* 复制文案带当前商圈名：不同商圈复制即不同问句，助手按圈作答。 */
  const zn = unit === 'all' ? tx('全部商圈') : zShort(uName(unit));
  const text = LANG === 'en' ? `[${zn}] ${q}` : `【${zn}】${q}`;
  const done = () => {
    const t = $('toast'); t.textContent = tx('已复制，粘贴给业务助手提问');
    t.classList.remove('err'); t.classList.add('ok', 'show');
    setTimeout(() => t.classList.remove('show'), 2600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { } ta.remove(); done(); }
}
/* 降级态：该商圈尚无名单明细（与真实数据现状一致，演示时顺带讲清数据边界）。 */
function nodata(d) {
  const cnt = d.signed != null ? `${tx('已签')} ${d.signed} · ${tx('签约中')} ${d.signing}` : '';
  return `<div class="nodata"><b>${tx('该商圈尚未接入名单明细')}</b>${cnt ? `<div class="mono" style="margin-top:8px;color:var(--mut)">${cnt}</div>` : ''}
    <div class="why">${tx('当前仅商圈级签约计数可用，商家与商品明细待数据侧供给')}</div></div>`;
}
</script>
<script>
'use strict';
/* ---------- 经营概览 = 跨商圈管理汇报（全宽多段 图表前置 跨商圈聚合） ---------- */
const ovHead = (t, sub) => `<div class="sechead"><h2>${tx(t)}</h2>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;

/* 顶部 KPI 条：当前焦点范围的合计，核心信息一眼。 */
function ovKpiStrip(T, goalPct, totalTgt) {
  const box = (v, l, cls) => `<div class="kbox ${cls || ''}"><div class="kv">${nf(v)}</div><div class="kl">${tx(l)}</div></div>`;
  const bullet = (goalPct != null && totalTgt) ? `<div class="blt"><span class="bltl">${tx('目标达成')}</span><div class="bltt"><i style="width:${Math.min(100, Math.max(1, goalPct))}%"></i><div class="bltmark"></div></div><span class="bltv"><b>${nf(T.signed)}</b><span style="color:var(--mut2)"> / ${nf(totalTgt)} · ${goalPct}%</span></span></div>` : '';
  return `<div class="sec"><div class="sechead"><h2>${tx('跨商圈总览')}</h2><span class="sub">${tx('全商圈合计 · 每日播报口径')}</span></div>
    <div class="kpirow" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${box(T.signed, '已签', 'ksg')}${box(T.signing, '签约中', 'ksi')}${box(T.open, '待接触')}${box(T.total, '商家合计')}</div>${bullet}</div>`;
}

/* 签约转化漏斗：商家池 → 已签 → 已开通 → 动销，全部商家维（勿混 SKU 或商品维，量级差两个数量级）。
 * 梯形按固定坡度等比收窄，不按数据比例缩宽——数据悬殊时按比例画会塌成一条线。
 * 层色沿用同屏既有语义（池灰 已签绿 动销橙），中间态用绿系连续的 --funF3。 */
function ovFunnelAgg() {
  const keys = ovKeys();
  const sum = k => keys.reduce((a, u) => a + ((rawUnit(u) || {})[k] || 0), 0);
  const steps = [
    [tx('商家池'), sum('shops'), 1],
    [tx('已签'), sum('signed'), 2],
    [tx('已开通'), sum('opened'), 3],
    [tx('动销'), sum('active'), 4],
  ];
  const wTop = 92, wBot = 58, n = steps.length, top = steps[0][1] || 0;
  const rows = steps.map(([lbl, v, k], i) => {
    const wt = wTop - (wTop - wBot) * i / n, wb = wTop - (wTop - wBot) * (i + 1) / n;
    const tL = ((100 - wt) / 2).toFixed(1), bL = ((100 - wb) / 2).toFixed(1);
    const share = top ? (v / top * 100) : null;
    return `<div class="funrow"><div class="funseg"><div class="funtrap" style="background:var(--funF${k});clip-path:polygon(${tL}% 0,${100 - tL}% 0,${100 - bL}% 100%,${bL}% 100%)"></div>
      <span class="funlbl" style="color:var(--funC${k})">${lbl}<b>${nf(v)}</b>${share != null ? `<small>${share < 10 ? share.toFixed(1) : Math.round(share)}%</small>` : ''}</span></div></div>`;
  }).join('');
  const convs = steps.slice(1).map(([, v], i) => {
    const prev = steps[i][1];
    const c = prev ? v / prev * 100 : null;
    return `<div class="funcv"><span class="arw">→</span><b>${c == null ? '—' : (c < 10 ? c.toFixed(1) : Math.round(c)) + '%'}</b></div>`;
  }).join('');
  return `<div class="card pcard"><div class="funwrap"><div class="funnel">${rows}</div>
    <div class="funcvc"><div class="funcvh">${tx('转化率')}</div>${convs}</div></div></div>`;
}

/* 签约变化趋势。数据只有一条真序列：逐日乘商圈的已签存量与签约中存量。
 * 参考做法里的三个特征刻意不照搬，逐条有据：
 * ▸ 按日按周按月不做：原生粒度只有日；且存量只能取期末、流量必须求和，一个控件下藏两套聚合规则是错误高发点。
 * ▸ 双轴不做：另一条序列在本项目无逐日口径，照搬即臆造。
 * ▸ 平滑曲线必须撤：存量是阶梯量，样条会在两端点同值的区间造出数据里没有的形态。改阶梯线，它就是存量的真实语义。
 * 新签是离散事件，用事件标记而非折线；窗口天数由数据派生，不写死。 */
function ovTrend(bare) {
  const rows = trendRows();
  if (!rows.length) return '';
  const nd = rows.length;
  const tot = i => rows[i].sg;
  const newAt = i => i === 0 ? 0 : Math.max(0, rows[i].sg - rows[i - 1].sg);
  const newTot = rows.reduce((a, r, i) => a + newAt(i), 0);
  const vals = rows.map((r, i) => tot(i));
  const maxT = Math.max.apply(null, vals) || 1, minT = Math.min.apply(null, vals);
  const fmtD = s => s.slice(5);
  /* 空态判据必须同时看存量与在途：只看存量会把「存量没动但在途有变化」误判为无变化。 */
  const flat = newTot === 0 && new Set(vals).size === 1 && new Set(rows.map(r => r.si)).size === 1;
  const span = (maxT - minT) || 1, W = 100, H = 30, H2 = 177;
  const xAt = i => nd > 1 ? i / (nd - 1) * W : 0;
  const yAt = v => H - (v - minT) / span * (H - 5) - 2.5;
  const pts = rows.map((r, i) => [xAt(i), yAt(tot(i))]);
  /* 阶梯线：值在采样点处跳变，平台段保持水平，不造中间态。 */
  const stepPath = ps => {
    if (!ps.length) return '';
    let s = `M${ps[0][0].toFixed(1)},${ps[0][1].toFixed(1)}`;
    for (let i = 1; i < ps.length; i++) s += `L${ps[i][0].toFixed(1)},${ps[i - 1][1].toFixed(1)}L${ps[i][0].toFixed(1)},${ps[i][1].toFixed(1)}`;
    return s;
  };
  const curve = stepPath(pts);
  const spark = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="${H2}" style="display:block" aria-hidden="true">
      <defs><linearGradient id="tgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--y)"/><stop offset="1" stop-color="var(--y)" stop-opacity="0"/></linearGradient></defs>
      <path d="${curve} L${W},${H} L0,${H} Z" fill="url(#tgrad)" opacity="0.16"/>
      <path d="${curve}" fill="none" stroke="var(--y)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="miter" stroke-linecap="butt"/>
    </svg>`;
  const marks = rows.map((r, i) => {
    const n = newAt(i); if (!n) return '';
    return `<div class="trmk" style="left:${(xAt(i) / W * 100).toFixed(1)}%"><span class="trmv">+${n}</span><i></i></div>`;
  }).join('');
  const lp = pts[pts.length - 1] || [0, 0];
  const dotL = (lp[0] / W * 100).toFixed(1), dotT = (lp[1] / H * H2).toFixed(1);
  const sparkBox = `<div class="sparkwrap" style="height:${H2}px">${spark}${marks}
    <div class="sparkdot" style="left:calc(${dotL}% - 4px);top:calc(${dotT}px - 4px)"></div>
    <span class="trcur" style="top:calc(${dotT}px - 20px)">${nf(vals[nd - 1])}</span></div>`;
  const xax = `<div class="trx"><span>${fmtD(rows[0].d)}</span>${nd > 2 ? `<span>${fmtD(rows[Math.floor((nd - 1) / 2)].d)}</span>` : ''}<span>${fmtD(rows[nd - 1].d)}</span></div>`;
  /* 窗口天数由数据派生，写死会在下次拉数时变成错的。 */
  const head = ovHead('签约变化趋势', `${tx('计数口径=签约名单')} · ${tx('窗口')} ${nd}<span class="g"></span>${tx('天')} · ${tx('新签')} <b style="color:var(--txt)">${newTot}</b><span class="g"></span>${tx('家')} · ${tx('存量')} <b style="color:var(--txt)">${minT}→${maxT}</b>`);
  const body = flat
    ? `<div class="trempty"><b>${tx('窗口内签约无变化')}</b><div>${tx('存量已签')} ${maxT}<span class="g"></span>${tx('家')} · ${tx('在途')} ${rows[nd - 1].si}<span class="g"></span>${tx('家')} · ${tx('近')} ${nd}<span class="g"></span>${tx('天无新签落地')}</div></div>`
    : `${sparkBox}${xax}`;
  const card = `<div class="card pcard">${body}<div class="pleg tleg"><span class="trlg"><i class="ln"></i>${tx('存量已签')}</span><span class="trlg"><i class="mk"></i>${tx('新签事件')}</span>
    <span style="color:var(--mut2);margin-left:auto">${rows[0].d}<span class="g"></span>→<span class="g"></span>${rows[nd - 1].d}</span></div></div>`;
  return bare ? `<div class="ovcol">${head}${card}</div>` : `<div class="sec">${head}${card}</div>`;
}

/* 商圈迷你分布图：各商圈按自身坐标投影落位，气泡大小 = 商家数，色深 = 签约率（相对最强圈归一）。
 * 底图是生成的抽象场域（网格加密度晕），不描摹任何真实地理。
 * 这块始终画全部商圈做对比，只把当前焦点高亮，故不随左栏过滤掉其他圈。 */
function ovZoneGeo(bare) {
  const zones = (((DATA || {}).ov) || {}).zones || [];
  if (!zones.length) return '';
  const lats = zones.map(z => z.lat), lngs = zones.map(z => z.lng);
  const pad = 0.02;
  const latMin = Math.min.apply(null, lats) - pad, latMax = Math.max.apply(null, lats) + pad;
  const lngMin = Math.min.apply(null, lngs) - pad, lngMax = Math.max.apply(null, lngs) + pad;
  const px = lng => 10 + (lng - lngMin) / ((lngMax - lngMin) || 1) * 80;
  const py = lat => 14 + (latMax - lat) / ((latMax - latMin) || 1) * 70;
  const maxTot = Math.max.apply(null, zones.map(z => z.shops)) || 1;
  const maxRate = Math.max.apply(null, zones.map(z => z.rate)) || 1;
  const bubbles = zones.map(z => {
    const x = px(z.lng).toFixed(1), y = py(z.lat).toFixed(1);
    const pv = Math.round(z.rate * 100);
    const dm = Math.round(24 + Math.sqrt(z.shops / maxTot) * 42);
    const inten = Math.round(z.rate / maxRate * 100);
    const bg = `color-mix(in srgb, var(--mixHi) ${inten}%, var(--mixLo))`;
    const cur = ovUnit === z.id, dim = ovUnit !== 'all' && !cur;
    return `<div class="geobub${cur ? ' cur' : ''}${dim ? ' dim' : ''}" role="button" tabindex="0" onclick="setOvUnit('${z.id}')" onkeydown="if(event.key==='Enter'){setOvUnit('${z.id}')}" style="left:${x}%;top:${y}%;width:${dm}px;height:${dm}px;background:${bg};border-color:${cur ? 'var(--y)' : (z.rate > 0.001 ? 'color-mix(in srgb,var(--done) 55%,transparent)' : 'var(--bubEdge)')}" title="${esc(zShort(z.nm))} · ${tx('已签')} ${z.signed}/${z.shops} · ${pv}%"><span class="geoval">${pv}%</span></div><div class="geolbl${cur ? ' cur' : ''}${dim ? ' dim' : ''}" style="left:${x}%;top:calc(${y}% + ${Math.round(dm / 2 + 6)}px)">${esc(zShort(z.nm))}</div>`;
  }).join('');
  let note = '';
  const cur = ovUnit !== 'all' ? zones.find(z => z.id === ovUnit) : null;
  if (cur) {
    const h = healthOf([ovUnit]);
    note = `<div class="ovnote"><b style="color:var(--txt)">${esc(zShort(cur.nm))}</b> · ${tx('已签')} ${cur.signed}/${cur.shops} <span style="color:var(--done)">${Math.round(cur.rate * 100)}%</span> · ${tx('动销率')} ${h ? h.activeRate.toFixed(0) + '%' : '—'}</div>`;
  }
  /* 抽象底图：等距网格加每个商圈的密度晕，过高斯模糊后得到场的观感，不是任何真实地形。 */
  const glow = zones.map(z => `<circle cx="${px(z.lng).toFixed(1)}" cy="${py(z.lat).toFixed(1)}" r="${(8 + Math.sqrt(z.shops / maxTot) * 12).toFixed(1)}" fill="var(--geoLine)" opacity="0.5"/>`).join('');
  const grid = Array.from({ length: 9 }, (_, i) => {
    const v = (i + 1) * 10;
    return `<line x1="${v}" y1="0" x2="${v}" y2="100" stroke="var(--geoLine)" stroke-width=".25" opacity=".5"/><line x1="0" y1="${v}" x2="100" y2="${v}" stroke="var(--geoLine)" stroke-width=".25" opacity=".5"/>`;
  }).join('');
  const geoBase = `<svg class="geobase" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><filter id="heatBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2"/></filter></defs>
      <rect x="0" y="0" width="100" height="100" fill="var(--geoBg)"/>
      <g filter="url(#heatBlur)">${glow}</g>${grid}
    </svg>`;
  const head = ovHead('各商圈签约率', tx('气泡=商家数 · 色深=签约率 · 位置按商圈坐标投影'));
  const card = `<div class="card pcard"><div class="geomap">${geoBase}${bubbles}</div>${note}</div>`;
  return bare ? `<div class="ovcol">${head}${card}</div>` : `<div class="sec">${head}${card}</div>`;
}
</script>
<script>
'use strict';
/* squarified treemap 布局：items=[{v,...}]，返回带 {x,y,w,h}（坐标空间 W×H）。 */
function ovSquarify(items, W, H) {
  const nodes = items.map(o => Object.assign({}, o));
  const totalV = nodes.reduce((a, n) => a + n.v, 0) || 1;
  const scale = (W * H) / totalV;
  nodes.forEach(n => n._a = Math.max(1e-6, n.v * scale));
  const result = [];
  let x = 0, y = 0, w = W, h = H, i = 0, row = [];
  const rowArea = r => r.reduce((a, n) => a + n._a, 0);
  const worst = (r, side) => { if (!r.length) return Infinity; const s = rowArea(r), mx = Math.max.apply(null, r.map(n => n._a)), mn = Math.min.apply(null, r.map(n => n._a)); return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn)); };
  function layout(r) {
    const s = rowArea(r);
    if (w >= h) { const sw = s / h; let oy = y; r.forEach(n => { const nh = n._a / sw; result.push(Object.assign({}, n, { x, y: oy, w: sw, h: nh })); oy += nh; }); x += sw; w -= sw; }
    else { const sh = s / w; let ox = x; r.forEach(n => { const nw = n._a / sh; result.push(Object.assign({}, n, { x: ox, y, w: nw, h: sh })); ox += nw; }); y += sh; h -= sh; }
  }
  while (i < nodes.length) {
    const side = Math.min(w, h);
    if (!row.length || worst(row.concat(nodes[i]), side) <= worst(row, side)) { row.push(nodes[i]); i++; }
    else { layout(row); row = []; }
  }
  if (row.length) layout(row);
  return result;
}
/* 品类构成树图：面积 = 该品类商家总量，色深 = 签约占比（按当前视图最大占比归一）。
   归一是必须的：真实占比只到一两成，直接当混色比例等于只用了色带前五分之一，八块肉眼同色。 */
function ovCatAgg() {
  const agg = {}, keys = ovKeys();
  keys.forEach(u => {
    const d = rawUnit(u); if (!d) return;
    (d.catMatrix || []).forEach(c => {
      const a = agg[c.cat] = agg[c.cat] || { signed: 0, signing: 0, open: 0 };
      a.signed += c.signed; a.signing += c.signing; a.open += c.open;
    });
  });
  const cats = Object.keys(agg).map(cat => ({ cat, s: agg[cat].signed, si: agg[cat].signing, o: agg[cat].open, tot: agg[cat].signed + agg[cat].signing + agg[cat].open }))
    .sort((a, b) => b.tot - a.tot).slice(0, 8);
  if (!cats.length) return `<div class="card pcard"><div class="ovnote">${tx('待数据')}</div></div>`;
  const AR = 1.6;   /* 传给 squarify 的容器宽高比，与 .tmap 实测比例一致，错了首块会被切成竖条 */
  const CW = 380, CH = 250;   /* CH 跟随 .tmap 高度，改 CSS 高度须同步改这里 */
  /* fits()：这块放不放得下标签。按标签实际所需折算而非纯几何阈值，
     否则长标签会被裁字。渲染期拿不到真实像素，故用字宽估算，偏保守只会多并一块进「其他」。 */
  const txtW = s => [...String(s)].reduce((w, c) => w + (/[　-鿿＀-￯]/.test(c) ? 11 : 6.6), 0);
  const fits = r => {
    const need = Math.max(txtW(tx(r.cat) || r.cat), txtW(`${r.s}/${r.tot}${r._mg ? ` · ${r._mg.length} ${tx('类')}` : ''}`) * .92);
    return (r.w / AR) * CW >= need + 16 && (r.h * CH) >= 42;
  };
  /* 尾部合并：商圈越小尾部品类越碎，被切成挂不住标签的窄条。
     从 8 起逐档降，每档把尾部并成「其他」，取所有块都放得下标签的最大档；并入清单挂 title，不做静默合并。 */
  const mkList = k => {
    if (k >= cats.length) return cats.slice();
    const tail = cats.slice(k - 1);
    const t = tail.reduce((a, c) => ({ s: a.s + c.s, si: a.si + c.si, o: a.o + c.o, tot: a.tot + c.tot }), { s: 0, si: 0, o: 0, tot: 0 });
    return cats.slice(0, k - 1).concat([{ cat: '其他', s: t.s, si: t.si, o: t.o, tot: t.tot, _mg: tail.map(x => x.cat) }]);
  };
  let list = cats, rects = ovSquarify(cats.map(c => Object.assign({}, c, { v: c.tot })), AR, 1);
  for (let k = cats.length; k >= 3; k--) {
    const cand = mkList(k), rc = ovSquarify(cand.map(c => Object.assign({}, c, { v: c.tot })), AR, 1);
    if (rc.every(fits) || k === 3) { list = cand; rects = rc; break; }
  }
  void list;
  const maxShare = Math.max.apply(null, rects.map(r => (r.tot ? r.s / r.tot : 0))) || 1;
  const tiles = rects.map(r => {
    const share = r.tot ? Math.round(r.s / r.tot * 100) : 0;
    const bg = `color-mix(in srgb, var(--mixHi) ${Math.round((r.tot ? r.s / r.tot : 0) / maxShare * 100)}%, var(--mixLo))`;
    const mg = r._mg;
    const ttl = `${mg ? tx('其他') + ' · ' + mg.map(c => tx(c) || c).join(' · ') : (tx(r.cat) || r.cat)} · ${tx('已签')} ${r.s}/${r.tot} · ${share}%`;
    const lbl = mg ? tx('其他') : (tx(r.cat) || r.cat);
    const val = mg ? `${r.s}/${r.tot} · ${mg.length} ${tx('类')}` : `${r.s}/${r.tot}`;
    return `<div class="tmtile" style="left:${(r.x / AR * 100).toFixed(2)}%;top:${(r.y * 100).toFixed(2)}%;width:${(r.w / AR * 100).toFixed(2)}%;height:${(r.h * 100).toFixed(2)}%;background:${bg}" title="${esc(ttl)}">${fits(r) ? `<div class="tmlbl">${esc(lbl)}</div><div class="tmv">${esc(val)}</div>` : ''}</div>`;
  }).join('');
  return `<div class="card pcard"><div class="tmap">${tiles}</div></div>`;
}

/* 签约后经营：左卡数动销（店 订单 SKU）加待催上架缺口行，右卡三个健康度环。 */
function ovActivation() {
  const keys = ovKeys();
  const single = ovUnit !== 'all';
  const a = droneAgg(keys);
  const h = healthOf(keys) || {};
  const pct = v => v == null ? '—' : v.toFixed(0) + '%';
  const box = (v, l, cls) => `<div class="kbox ${cls || ''}"><div class="kv">${nf(v)}</div><div class="kl">${tx(l)}</div></div>`;
  /* 待催上架高销品：已签可供给（ok）与已上架（lst）之差，取 80 分位档。 */
  let gOk = 0, gLst = 0;
  keys.forEach(u => { const d = rawUnit(u); const lv = d && d.pcov && d.pcov.levels && d.pcov.levels['80']; if (lv) { gOk += lv.ok || 0; gLst += lv.lst || 0; } });
  const gap = gOk - gLst, cov = gOk ? Math.round(gLst / gOk * 100) : null;
  const gapLine = gap > 0 ? `<div class="actgap" title="${tx('已签可供给但未上无人机菜单')}"><b>${nf(gap)}</b> ${tx('个待催上架高销品')}<span style="color:var(--mut2)"> · ${tx('核心上架覆盖')} ${cov}%</span></div>` : '';
  const ring = (l, v, c) => { const CC = 2 * Math.PI * 20, dash = CC * (v == null ? 0 : Math.max(0, Math.min(100, v)) / 100); return `<div class="hring"><div class="zrw"><svg viewBox="0 0 52 52" width="60" height="60" aria-hidden="true"><circle r="20" cx="26" cy="26" fill="none" stroke="var(--panel2)" stroke-width="5"/><circle r="20" cx="26" cy="26" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="${dash} ${CC}" stroke-linecap="${v > 0 ? 'round' : 'butt'}" transform="rotate(-90 26 26)"/></svg><span class="zrp">${pct(v)}</span></div><div class="hrn">${tx(l)}</div></div>`; };
  const countCard = `<div class="card pcard"><h3>${tx('无人机动销')} <span style="font-weight:400;color:var(--mut2)">· ${single ? esc(zShort(uName(ovUnit))) : tx('全商圈')}</span></h3>
    <div class="kpirow" style="grid-template-columns:repeat(3,1fr)">${box(a.shops, '动销店', 'kac')}${box(a.orders, '动销订单')}${box(a.skus, '动销 SKU')}</div>${gapLine}
    <div class="ovnote">${tx('无人机实单 · 窗口内 · 分商圈')} · ${single ? tx('本商圈 · 按店动销明细聚合') : tx('全商圈')}</div></div>`;
  const healthCard = `<div class="card pcard"><h3>${tx('经营健康度')} <span style="font-weight:400;color:var(--mut2)">· ${tx('全商圈按已签数加权')}</span></h3>
    <div class="hrings">${ring('动销率', h.activeRate, 'var(--orange)')}${ring('履约成功率', h.fulfillRate, 'var(--done)')}${ring('复购率', h.repeatRate, 'var(--blue)')}</div>
    <div class="ovnote" style="margin-top:14px">${tx('环=占满 100% 的比例 · 复购为商圈级近似')}</div></div>`;
  return `<div class="ovgrid2 eq">${countCard}${healthCard}</div>`;
}

function renderOverview() {
  $('layout').classList.remove('nol');
  $('rail').style.display = '';
  const sw = signingWide();
  const swF = ovUnit === 'all' ? sw : sw.filter(r => r.unit === ovUnit);
  const T = swF.reduce((a, r) => ({ signed: a.signed + r.signed, signing: a.signing + r.signing, open: a.open + r.open, total: a.total + r.total }), { signed: 0, signing: 0, open: 0, total: 0 });
  const totalTgt = swF.reduce((a, r) => a + (getTgt(r.unit).N || 0), 0);
  const gapF = totalTgt - T.signed;
  const actF = ovKeys().reduce((a, u) => a + ((rawUnit(u) || {}).active || 0), 0);
  const goalPct = totalTgt ? Math.round(T.signed / totalTgt * 100) : null;
  /* 判决句：结论先行。签约中为 0 时整个副行不渲染，不留一句孤零零的口径说明。 */
  const vdct = `<div class="vdct"><div class="vmain">${gapF > 0 ? gapPhrase(gapF) : tx('已达建议目标')}</div>
    ${T.signing > 0 ? `<div class="vsub">${tx('签约中')} ${T.signing}<span class="g"></span>${tx('家待落地')}</div>` : ''}</div>`;
  const kbox = (v, l, cls) => `<div class="kbox ${cls || ''}"><div class="kv">${nf(v)}</div><div class="kl">${tx(l)}</div></div>`;
  const kpi = `<div class="sec"><div class="sechead"><h2 style="font-size:var(--fs-h3)">${tx('指标达成进度')}</h2></div>
    <div class="kpirow">${kbox(T.total, '商家总数')}${kbox(T.signed, '已签', 'ksg')}${kbox(T.signing, '签约中', 'ksi')}${kbox(actF, '动销', 'kac')}</div></div>`;
  /* 环图：段间留 2px 缝（段长够时才留），相邻同色系分档不再糊成一段。viewBox 110 与渲染尺寸 1:1，故 1 单位 = 1px。 */
  const CC = 2 * Math.PI * 40;
  const donut = (segs, ctrV, ctrL, ctrColor) => {
    let off = 0; const tot = segs.reduce((a, s) => a + (s[1] || 0), 0) || 1;
    const arcs = segs.map(([, v, c]) => { const len = CC * (v || 0) / tot; const dl = len > 5 ? len - 2 : len; const s = `<circle r="40" cx="55" cy="55" fill="none" stroke="${c}" stroke-width="13" stroke-dasharray="${dl} ${CC - dl}" stroke-dashoffset="${-off}" transform="rotate(-90 55 55)"/>`; off += len; return s; }).join('');
    const leg = segs.map(([lbl, v, c]) => `<div style="display:flex;align-items:center"><i style="background:${c}"></i>${lbl}<span class="dvv">${nf(v)}</span></div>`).join('');
    return `<div class="drow"><div class="dwrap"><svg viewBox="0 0 110 110" width="110" height="110" aria-hidden="true">${arcs}</svg>
      <div class="dctr"><div class="dv"${ctrColor ? ` style="color:${ctrColor}"` : ''}>${ctrV}</div><div class="dl">${ctrL}</div></div></div><div class="dleg">${leg}</div></div>`;
  };
  const stDonut = `<div class="sec"><div class="sechead"><h2 style="font-size:var(--fs-h3)">${tx('签约状态构成')}</h2></div>
    ${donut([[tx('已签'), T.signed, 'var(--done)'], [tx('签约中'), T.signing, 'var(--yFill)'], [tx('待接触'), T.open, 'var(--pool)']], nf(T.signed), tx('已签'))}</div>`;
  const gb = gmvBandOf(ovKeys());
  const gbTot = Object.values(gb).reduce((a, v) => a + v, 0);
  /* D 档是最大一段，用去饱和蓝的 tint 而不是灰阶：相邻档位靠色相拉开（灰阶只拉得开亮度、拉不开色相），
     语义也自洽——去饱和蓝在本页本就是「未分化的大盘」（见漏斗与状态环的 --pool）。 */
  const bandDonut = gbTot ? `<div class="sec"><div class="sechead"><h2 style="font-size:var(--fs-h3)">${tx('商家GMV分层')}</h2><span class="sub">${tx('S/A/B/C/D 按窗口 GTV')}</span></div>
    ${donut([['S', gb.S, 'var(--yBright)'], ['A', gb.A, 'var(--doneSoft)'], ['B', gb.B, 'var(--blue)'], ['C', gb.C, 'var(--mut)'], ['D', gb.D, 'color-mix(in srgb, var(--blue) 70%, var(--panel))']], nf(gbTot), tx('商家'), 'var(--y)')}</div>` : '';
  $('rail').innerHTML = `<div class="sec"><div class="usel-lab">${tx('商圈')}</div><div class="usel">${['all'].concat(unitList()).map(ovSelBtn).join('')}</div></div>
    ${vdct}${kpi}${stDonut}${bandDonut}`;
  if (!sw.length) { $('main').innerHTML = `<div class="sec"><div class="nodata"><b>${tx('该商圈尚未接入名单明细')}</b></div></div>`; return; }
  $('main').innerHTML =
    ovKpiStrip(T, goalPct, totalTgt) +
    `<div class="sec"><div class="ovgrid2 eq"><div class="ovcol">${ovHead('签约转化', tx('商家池 → 已签 → 已开通 → 动销 · 逐级转化'))}${ovFunnelAgg()}</div>${ovTrend(true)}</div></div>` +
    `<div class="sec"><div class="ovgrid2 eq">${ovZoneGeo(true)}<div class="ovcol">${ovHead('供给质量', tx('面积=量级 · 色深=签约占比'))}${ovCatAgg()}</div></div></div>` +
    `<div class="sec">${ovHead('签约后经营', tx('签了之后真在无人机上动销与履约吗'))}${ovActivation()}</div>`;
}
</script>
<script>
'use strict';
/* ---------- 总渲染 ---------- */
function render() {
  if (!DATA) return;
  header();
  const d = packOf(unit);
  document.body.classList.toggle('work', VIEW === 'work');
  $('hero').style.display = VIEW === 'work' ? 'flex' : 'none';
  $('hband').style.display = 'none';   /* 进度带：工作台有数据时于下方回填 */
  $('rail').style.display = '';
  $('layout').classList.remove('nol');
  $('workEvi').innerHTML = '';         /* 背景证据折叠区：仅工作台满态填充，其余视图清空 */
  promptBar();
  if (VIEW === 'ov') { renderOverview(); return; }
  $('hero').innerHTML = heroBar(d);
  const hb = heroBand(d);
  $('hband').innerHTML = hb;
  $('hband').style.display = hb ? '' : 'none';
  if (!d.full) {
    /* 降级态：hero 承担计数与口径，名单区换成数据边界卡，左栏隐藏。 */
    $('layout').classList.add('nol');
    $('rail').style.display = 'none';
    $('rail').innerHTML = '';
    $('main').innerHTML = `<div class="sec">${nodata(d)}</div>`;
    return;
  }
  $('rail').innerHTML = acts3(d) + alertsBlock(d);
  $('workEvi').innerHTML = eviFold(d);
  const sub3 = (d.coreCount != null)
    ? `${tx('核心商家')} ${d.coreCount}<span class="g"></span>${tx('家')}${tx('（累计贡献 80%）')}`
    : '';
  /* 区头随视角切：商品视角换成商品名单标题加专属副题，解商家区头与商品 tab 的割裂。 */
  const goodsMode = ltab === 'goods';
  $('main').innerHTML =
    `<div class="sechead"><h2 style="font-size:var(--fs-h3)">${tx(goodsMode ? '商品名单' : '商家名单')}</h2><span class="sub">${goodsMode ? tx('店内高销品 · 订单降序') : sub3}</span></div>
     ${listView(d)}`;
  fitSticky();
}

/* ---------- 交互 ---------- */
function setUnit(u) { unit = u; ltab = 'today'; fSt = 'all'; fAct = 'all'; fQual = 'all'; fCat = 'all'; fMCat = 'all'; expShop = null; listLimit = 50; listQ = ''; render(); }
function setOvUnit(u) { ovUnit = u; render(); }
function toggleShopRow(id) { expShop = expShop === id ? null : id; render(); }
function setLtab(k) { ltab = k; fSt = 'all'; fAct = 'all'; fQual = 'all'; fCat = 'all'; fMCat = 'all'; expShop = null; listLimit = 50; listQ = ''; render(); }
function moreRows(n) { listLimit += n; render(); }
function setQ(v) { listQ = (v || '').trim(); listLimit = 50; render(); }
function setFilter(k, v) { if (k === 'fSt') fSt = v; else if (k === 'fQual') fQual = v; else if (k === 'fCat') fCat = v; else if (k === 'fMCat') fMCat = v; else fAct = v; render(); }
function setSort(v) { sortKey = v; render(); }
function setView(v) { VIEW = v; render(); }
function switchLang() {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  try { LANG === 'en' ? localStorage.setItem(LANGKEY, 'en') : localStorage.removeItem(LANGKEY); } catch (e) { }
  applyLang(); render();
}

/* ============ 主题（深色与浅色两态） ============
   默认浅色，只有显式选了深色才落键，不跟随系统。五个页面共用 ops_theme 这一个键。 */
const THKEY='ops_theme';
const TH_ICON={
 light:'<circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/><path d="M12 1.5v2.7M12 19.8v2.7M4.5 4.5l1.9 1.9M17.6 17.6l1.9 1.9M1.5 12h2.7M19.8 12h2.7M4.5 19.5l1.9-1.9M17.6 6.4l1.9-1.9" stroke="currentColor" stroke-width="2.2"/>',
 dark:'<path d="M20.6 14.9A8.7 8.7 0 1 1 9.1 3.4a6.9 6.9 0 0 0 11.5 11.5z" fill="currentColor" stroke="none"/>'};
function thMode(){try{return localStorage.getItem(THKEY)==='dark'?'dark':'light';}catch(e){return 'light';}}
function renderThemeBtn(){const m=thMode(),ic=document.getElementById('thIco'),bt=document.getElementById('thTog');
  if(!ic||!bt)return; ic.innerHTML=TH_ICON[m];
  bt.setAttribute('aria-label',tx('主题')+' · '+tx(m==='light'?'浅色':'深色'));
  bt.title=tx(m==='light'?'切换到深色':'切换到浅色');}
function applyTheme(){const m=thMode();
  if(m==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  renderThemeBtn();
  /* 本页的图表全部用 CSS 变量着色，主题一换自动跟随，无需重上色。 */}
function cycleTheme(){const nx=thMode()==='light'?'dark':'light';
  try{nx==='dark'?localStorage.setItem(THKEY,'dark'):localStorage.removeItem(THKEY);}catch(e){}
  applyTheme();}

/* 底栏高度自适应，body 余量动态跟随（chips 换行后固定值不够用）。 */
function fitBarPad() { const b = $('pbar'); if (b) document.body.style.paddingBottom = (b.offsetHeight + 12) + 'px'; }
function fitSticky() { const h = document.querySelector('header'), d = $('dock'); const hh = h ? h.offsetHeight : 0; const dh = (d && VIEW === 'work') ? d.offsetHeight : 0; const r = document.documentElement.style; r.setProperty('--headerH', hh + 'px'); r.setProperty('--stickyTop', (hh + dh) + 'px'); }

/* ---------- 启动 ---------- */
applyLang();
(function () { const bt = document.getElementById('thTog'); if (bt) bt.onclick = cycleTheme; applyTheme(); })();
fetch('../data/bdboard.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(j => {
    DATA = j;
    unit = 'all';
    render();
    fitBarPad(); fitSticky();
  })
  .catch(e => {
    const b = $('boot');
    if (b) { b.className = 'loadst err'; b.innerHTML = `${tx('数据载入失败')} · ${esc(e.message)}<div class="why">${tx('请先运行 scripts/gen_mock.py 生成 site/data/bdboard.json')}</div>`; }
  });
window.addEventListener('resize', fitBarPad, { passive: true });
window.addEventListener('resize', fitSticky, { passive: true });
/* 回顶浮钮：长名单整页滚配套，滚超 600px 出现。 */
window.addEventListener('scroll', () => { const b = $('toTop'); if (b) b.classList.toggle('show', window.scrollY > 600); }, { passive: true });

/* ═══ 自绘下拉拦截：替原生 OS 白色菜单。select 本体仍是唯一状态源与 aria 载体，onchange 照旧；
       触屏（pointer:coarse）整段不接管，回退原生控件。 ═══ */
(function(){
  if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)return;
  let menu=null,cur=null,idx=-1;
  function close(){if(menu)menu.remove();menu=null;if(cur)cur.setAttribute('aria-expanded','false');cur=null;idx=-1;}
  function mark(){if(!menu)return;[...menu.children].forEach((d,i)=>d.classList.toggle('on',i===idx));const el=menu.children[idx];if(el)el.scrollIntoView({block:'nearest'});}
  function commit(i){if(!cur)return;const s=cur;if(i>=0&&s.selectedIndex!==i){s.selectedIndex=i;s.dispatchEvent(new Event('change',{bubbles:true}));}close();s.focus();}
  function open(sel){
    close();cur=sel;sel.setAttribute('aria-expanded','true');idx=sel.selectedIndex;
    menu=document.createElement('div');menu.className='ddmenu';menu.setAttribute('role','listbox');
    menu.style.fontSize=getComputedStyle(sel).fontSize;   /* 菜单字号跟触发器，宽度随之贴合，勿大于框 */
    [...sel.options].forEach((o,i)=>{
      const d=document.createElement('div');d.className='ddo'+(i===sel.selectedIndex?' sel':'');d.setAttribute('role','option');d.setAttribute('aria-selected',i===sel.selectedIndex?'true':'false');
      /* 第一项（value=all）在菜单里显示「全部」，收起态仍显示列名。
         不能直接把 option 文本改成「全部」——收起态显示的就是它，列名会消失。 */
      const otx=(i===0&&o.value==='all')?tx('全部'):o.text;
      d.innerHTML='<span class="dk"></span>'+otx;
      d.onmouseenter=()=>{idx=i;mark();};
      d.onmousedown=e=>{e.preventDefault();e.stopPropagation();};
      d.onclick=e=>{e.stopPropagation();commit(i);};
      menu.appendChild(d);});
    document.body.appendChild(menu);
    const r=sel.getBoundingClientRect();menu.style.minWidth=Math.min(r.width,menu.offsetWidth+24)+'px';   /* 上限=内容宽加 24px，宽触发框不再把菜单拉出大留白 */
    const mh=menu.offsetHeight,mw=menu.offsetWidth;
    let top=r.bottom+4;if(top+mh>innerHeight-8)top=Math.max(8,r.top-mh-4);
    menu.style.top=top+'px';menu.style.left=Math.max(8,Math.min(r.left,innerWidth-mw-8))+'px';
    mark();
  }
  document.addEventListener('mousedown',e=>{
    const s=e.target&&e.target.closest?e.target.closest('select'):null;
    if(s&&!s.disabled){e.preventDefault();if(cur===s)close();else open(s);s.focus();}
    else if(menu&&!menu.contains(e.target))close();
  },true);
  document.addEventListener('keydown',e=>{
    if(menu){
      if(e.key==='Escape'){e.stopPropagation();const s=cur;close();if(s)s.focus();}
      else if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,menu.children.length-1);mark();}
      else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0);mark();}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();commit(idx);}
      else if(e.key==='Tab')close();
      return;}
    const a=document.activeElement;
    if(a&&a.tagName==='SELECT'&&!a.disabled&&(e.key==='Enter'||e.key===' '||(e.altKey&&(e.key==='ArrowDown'||e.key==='ArrowUp'))))
      {e.preventDefault();open(a);}
  },true);
  addEventListener('scroll',e=>{if(menu&&!menu.contains(e.target))close();},true);
  addEventListener('resize',close);
})();
</script>
</body>
