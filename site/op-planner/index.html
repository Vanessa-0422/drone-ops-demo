function wbAddLand(lat,lng){WB.lands.push({lat:lat,lng:lng,rk:FPC.LAND_R,nm:landName(WB.hub,lat,lng)});

function wbAddByCoord(){

/* 圈边拖拽手柄：在圈的正东边放一个手柄，拖动 = 改半径。与右轨滑杆是同一个状态。
   拖动中只改圈与回显，松手才重算 —— 与滑杆的防抖同一条纪律。
   ⚠ 手柄默认不显示，指针进到它自己那个圈里才浮出来：一个工作台同时挂 1 个供给圈加
     N 个降落圈，手柄常显就是 N+1 个小方块钉在图上抢注意力。 */
function radiusGrip(center,km,cls,lo,hi,apply){
  const east=ll=>[ll[0],ll[1]+km/(111.32*Math.cos(ll[0]*Math.PI/180))];
  const g=L.marker(east(center),{draggable:true,zIndexOffset:1300,icon:L.divIcon({className:'',
    html:`<div class="rgrip ${cls}"><span class="rgtag" style="display:none"></span></div>`,
    iconSize:[12,6],iconAnchor:[6,3]})}).addTo(map);
  const tag=()=>{const e=g.getElement();return e?e.querySelector('.rgtag'):null;};
  const rec={g:g,c:center,km:()=>km,pin:false,hov:false};
  GRIPS.push(rec);
  const e0=g.getElement();if(e0)e0.style.display='none';
  g.on('mouseover',()=>{rec.hov=true;});
  g.on('mouseout',()=>{rec.hov=false;});
  g.on('dragstart',()=>{rec.pin=true;const t=tag();if(t)t.style.display='';});
  g.on('drag',()=>{
    if(!map.hasLayer(g))return;
    const q=g.getLatLng();
    let v=kmD(center[0],center[1],q.lat,q.lng);
    v=Math.max(lo,Math.min(hi,Math.round(v*10)/10));
    g.setLatLng(east(center));km=v;apply(v);
    const t=tag();if(t)t.textContent=v.toFixed(1)+' km';});
  g.on('dragend',()=>{rec.pin=false;const t=tag();if(t)t.style.display='none';wbRecalc();});
  return g;}
function gripsHover(ll){
  GRIPS.forEach(o=>{
    if(o.pin||o.hov)return;
    const e=o.g.getElement();if(!e)return;
    /* ⚠ 判据放宽一成：把手骑在圈边上，一半在圈外。指针从外面靠过来时，
       地图收到的最后一个 mousemove 还在圈外，圈一收把手就没了，等于永远够不着它 */
    e.style.display=(kmD(o.c[0],o.c[1],ll.lat,ll.lng)<=o.km()*1.12)?'':'none';});}

/* 自由放点：任意位置起飞点，与候选点位同口径的实时账 */
let fpArm=false,FPN=0;
function syncFreeBtn(){
  const b=document.getElementById('bFree');if(!b)return;

function runFP(ll){
  const cid=cityAt(ll)||mFocus;

    landings:3,winch:0,avg_leg_km:1.2,rent_takeoff:7000,cov_ceiling:CITY(cid).cov_ceiling,
    pool_monthly:0};
  SCOPE={k:'free'};wbEnter(p);}
function addFPToPlan(){
  if(!WB||!WB.p.free||!WB.res)return;
  FPN++;
  const p=Object.assign({},WB.p,{id:'m'+FPN,nm:(LANG==='en'?'Hand-added ':'手动点位 ')+FPN,
    free:false,manual:true,planned:false,landings:WB.lands.length||1,
    avg_leg_km:+(WB.lands.length?WB.lands.reduce((a,l)=>a+kmD(WB.hub[0],WB.hub[1],l.lat,l.lng),0)/WB.lands.length:1.2).toFixed(2),
    pool_monthly:Math.round(WB.res.cap_day*30),

function setScope(sc){

    if(p){mFocus=p.city;goTo([p.lat,p.lng],12.4,RM?0:.9);wbEnter(p);}}

/* ===== 主题应用到地图 ===== */
function restyleMap(){
  if(!map)return;
  const app=l=>{const o=l.options,k=o.kd;
    if(!k)return;
    if(k==='comm')l.setStyle({opacity:PAL.comm.opacity,fillOpacity:PAL.comm.fillOpacity});
    else if(k==='sect')l.setStyle({opacity:PAL.sect.opacity});
    else if(k==='villa')l.setStyle({color:PAL.villa.color,fillColor:PAL.villa.color,
      opacity:PAL.villa.opacity,fillOpacity:PAL.villa.fillOpacity});
    else if(k==='flow')l.setStyle({color:PAL.flow.color,opacity:PAL.flow.oBase+o.kdR*PAL.flow.oSpan});
    else if(k==='poiSup')l.setStyle({color:PAL.poiSup,fillColor:PAL.poiSup,fillOpacity:PAL.poiFill});
    else if(k==='poiDem')l.setStyle({color:PAL.poiDem[o.kdI],fillColor:PAL.poiDem[o.kdI],fillOpacity:PAL.poiFill});
    else if(k==='mall')l.setStyle({color:PAL.mall[o.kdT],fillColor:PAL.mall[o.kdT],fillOpacity:PAL.mallFill});
    else if(k==='nfz')l.setStyle({color:PAL.nfz[o.kdK],fillColor:PAL.nfz[o.kdK],
      fillOpacity:o.kdK==='pink'?PAL.nfz.fillPink:PAL.nfz.fillOther});};
  const walk=l=>{if(l&&l.eachLayer)l.eachLayer(walk);else if(l)app(l);};
  Object.keys(LY).forEach(k=>walk(LY[k]));}
/* 矢量层打了 kd 标记，这里按标记原地 setStyle 重上色，不重建图层 ——
   重建会丢掉 POI 的按缩放挂载状态。 */
function applyMapTheme(){
  PAL=MAPPAL[thMode()];
  if(!map)return;
  try{
    baseTile.setUrl(PAL.tile);
    demLayer&&demLayer.setOptions({gradient:PAL.dem});
    supLayer&&supLayer.setOptions({gradient:PAL.sup});
    if(demLayer&&demLayer._map)demLayer.redraw();
    if(supLayer&&supLayer._map)supLayer.redraw();
    restyleMap();
  }catch(e){}
  clearHubs();
  if(mapOn){renderHubs();renderRail();renderTbar();renderMapSide();if(WB)wbDraw();}}

/* ===== tab 切换 ===== */
async function bootMap(){
  if(mapBooted)return true;
  const el=document.getElementById('map');
  if(!el.clientWidth||!el.clientHeight)return false;
  if(!MD){
    try{MD=await fetch('../data/mapdata.json',{cache:'no-store'}).then(r=>r.json());}
    catch(e){document.getElementById('mrail').innerHTML=
      `<div class="lgrp"><h4>${tx('载入数据失败')}</h4></div>`;return true;}}
  mapBooted=true;
  map=L.map('map',{zoomControl:false,preferCanvas:true,zoomSnap:.5,zoomDelta:.5,
    attributionControl:true});
  L.control.zoom({position:'bottomright'}).addTo(map);
  baseTile=L.tileLayer(PAL.tile,{maxZoom:19,updateWhenZooming:false,updateWhenIdle:true,
    crossOrigin:'anonymous',attribution:CARTO_ATTR}).addTo(map);
  buildLayers();
  supLayer.addTo(map);demLayer.addTo(map);LY.areas.addTo(map);LY.villa.addTo(map);LY.flow.addTo(map);
  Object.keys(POI_IDS).forEach(applyLayer);
  map.on('zoomend',()=>Object.keys(POI_IDS).forEach(applyLayer));
  map.on('click',e=>{
    if(fpArm){fpArm=false;syncFreeBtn();runFP(e.latlng);return;}
    if(WB&&WB.addArm){wbAddLand(e.latlng.lat,e.latlng.lng);return;}
    if(!mFocus){const c=cityAt(e.latlng);if(c)focusCity(c);}});
  let grpT=0;
  map.on('mousemove',e=>{if(!GRIPS.length)return;
    const n=Date.now();if(n-grpT<60)return;grpT=n;gripsHover(e.latlng);});
  map.invalidateSize();homeFit();
  return true;}
function showTab(w){
  const toMap=w==='map';
  if(toMap===mapOn){if(!toMap)scrollTo(0,0);return;}
  mapOn=toMap;
  document.body.classList.toggle('mapping',toMap);
  document.getElementById('tabM').classList.toggle('on',toMap);
  document.getElementById('tabC').classList.toggle('on',!toMap);
  if(toMap){
    renderRail();renderMapSide();renderTbar();
    setTimeout(async()=>{
      const ok=await bootMap();
      if(!ok){setTimeout(async()=>{await bootMap();afterBoot();},160);return;}
      afterBoot();},60);}
  else renderConc();}
function afterBoot(){
  if(!map)return;
  try{map.invalidateSize();}catch(e){}
  if(mFocus)goToBounds(cityBounds(mFocus),{duration:0,maxZoom:12.5});else homeFit();
  renderHubs();renderRail();renderTbar();renderMapSide();}
function renderAll(){
  renderConc();
  if(mapOn){renderRail();renderMapSide();renderTbar();renderHubs();}}

        ?`<tr class="fsec"><td colspan="2"><b>${f[1]}</b><span>${f[2][0]||''}</span></td></tr>`

        ?`<tr class="fsub"><td colspan="2"><b>${f[1]}</b>${f[2][0]?`<i>${f[2][0]}</i>`:''}</td></tr>`
      :f[0]==='↓'
        ?`<tr class="fdn"><td colspan="2"><span class="dn">↓</span><span class="dnt">${f[1]}</span></td></tr>`
        :`<tr><td><b class="fno">${f[0]}</b> ${f[1]}</td>
      <td class="p">${f[2].map(l=>`<div class="fl1">${l}</div>`).join('')}</td></tr>`).join('')+`</table>
    `+landCaliber()+landByCity()+`
    <h2 style="margin-top:28px">${tx('假定值一览')}</h2>
    <div class="vnote">${tx('暖色是假定值，可调的那几项在正文参数区')}</div>
    <table class="dtbl"><colgroup><col class="c1"><col><col class="c3"></colgroup>
    <tr><th>${tx('参数')}</th><th>${tx('当前值')}</th><th class="st3">${tx('三态')}</th></tr>`
    +reg.map(r=>`<tr><td>${tx(r.t)}</td><td class="p">${r.v}</td>
        <td class="st3"><span class="st ${r.st}">${tx({f:'事实',d:'可推导',a:'假定值'}[r.st])}</span></td></tr>
        <tr class="n"><td colspan="3">${tx(r.why)}</td></tr>`).join('')+'</table></div>';}
function toggleDrawer(v){
  document.getElementById('drawer').classList.toggle('on',v);
  document.getElementById('scrim').classList.toggle('on',v);
  if(v)renderDrawer();}

/* ===== 事件 ===== */
/* 事件委托：click 与键盘走同一条路径。
   ⚠ 只监听 click 的话，可聚焦元素的回车不触发，整页键盘进不去。 */
function concAct(t){
  if(t.closest('[data-close]')){pick(null);return true;}
  if(t.closest('[data-reset]')){PSET={};bump();renderAll();return true;}
  if(t.closest('[data-cal]')){toggleDrawer(true);return true;}
  const vwb=t.closest('[data-vw]');
  if(vwb){VIEW=vwb.dataset.vw;SENS=null;
    if(!YB()[PY])PY=null;renderConc();return true;}
  const pyb=t.closest('[data-py]');
  if(pyb){PY=pyb.dataset.py;renderPlan();return true;}
  if(t.closest('[data-pq]')){PQ=!PQ;renderPlan();return true;}
  const mp=t.closest('[data-map]');
  if(mp){const id=mp.dataset.map;showTab('map');
    setTimeout(()=>{try{setScope({k:'site',id:id});}catch(e){}},mapBooted?80:420);return true;}
  const n=t.closest('[data-go]');
  if(n){pick(n.dataset.go);return true;}
  return false;}
document.addEventListener('click',e=>{
  const c=document.getElementById('conc');
  if(c&&c.contains(e.target)&&concAct(e.target))return;
  const d=document.getElementById('drawer');
  if(d&&d.contains(e.target)&&e.target.closest('[data-drawer]')){toggleDrawer(false);return;}
  const side=document.getElementById('mside'),rail=document.getElementById('mrail'),
        lgd=document.getElementById('mlgd');
  if(lgd&&lgd.contains(e.target)&&e.target.closest('[data-pot]')){togglePot();return;}
  if(rail&&rail.contains(e.target))return;
  if(!side||!side.contains(e.target))return;
  const t=e.target;
  const hit=(a,f)=>{const n2=t.closest('['+a+']');if(n2){f(n2.getAttribute(a));return true;}return false;};
  if(hit('data-leave',()=>leaveCity()))return;
  if(hit('data-back',()=>{if(WB&&WB.p.free){wbExit();SCOPE={k:'all'};renderHubs();renderMapSide();}
    else backToCity();}))return;
  if(hit('data-city',v=>focusCity(v)))return;
  if(hit('data-drop',v=>{const i=DROP.indexOf(v);i>=0?DROP.splice(i,1):DROP.push(v);
    bump();renderAll();}))return;
  if(hit('data-force',v=>{if(FORCE[v])delete FORCE[v];else FORCE[v]=1;bump();renderAll();}))return;
  if(hit('data-exreset',()=>{DROP=[];FORCE={};MANUAL=[];bump();renderAll();}))return;
  if(hit('data-radreset',()=>resetRadius()))return;
  if(hit('data-wbreset',()=>wbReset()))return;
  if(hit('data-delland',v=>wbDelLand(+v)))return;
  if(hit('data-addarm',()=>{WB.addArm=!WB.addArm;renderMapSide();}))return;
  if(hit('data-addcoord',()=>wbAddByCoord()))return;
  if(hit('data-addplan',()=>addFPToPlan()))return;
  if(hit('data-toconc',()=>showTab('conc')))return;
  const card=t.closest('[data-site]');
  if(card){setScope({k:'site',id:card.dataset.site});return;}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('drawer').classList.contains('on'))return toggleDrawer(false);
    if(fpArm){fpArm=false;syncFreeBtn();return;}
    if(WB&&WB.addArm){WB.addArm=false;renderMapSide();return;}
    if(DPICK&&!mapOn){pick(null);return;}
    if(mapOn)return showTab('conc');
    return;}
  if(e.key!=='Enter'&&e.key!==' ')return;
  const c=document.getElementById('conc');
  if(c&&c.contains(e.target)&&concAct(e.target)){e.preventDefault();return;}
  const lgd=document.getElementById('mlgd');
  if(lgd&&lgd.contains(e.target)&&e.target.closest('[data-pot]')){e.preventDefault();togglePot();}});
/* 滑杆：拖动时只更新读数，松手（change）才重算全页。
   ⚠ 别把重算挂在 input 上，一次拖动会排队几十次运行。 */
function tuneAct(e){
  const t=e.target;
  if(!t||!t.dataset)return;
  if(t.dataset.pk){
    const d=PARAMS_LIVE.find(x=>x.k===t.dataset.pk);if(!d)return;
    const v=+t.value,box=t.closest('.pk'),cell=box&&box.querySelector('.pv');
    if(cell)cell.innerHTML=d.fmt(v);
    if(e.type==='change'){
      if(Math.abs(v-PDEF(d.k))<1e-9)delete PSET[d.k];else PSET[d.k]=v;
      bump();renderAll();}
    return;}
  if(t.dataset.ly!==undefined&&e.type==='change'){toggle(t.dataset.ly,t.checked);return;}
  if(t.dataset.supr!==undefined&&WB){WB.supR=+t.value;
    const w=t.nextElementSibling;if(w)w.textContent=WB.supR.toFixed(1)+' km';
    if(WB.supC)try{WB.supC.setRadius(WB.supR*1000);}catch(e2){}
    wbDebounce();return;}
  if(t.dataset.rk!==undefined&&WB){const i=+t.dataset.rk;WB.lands[i].rk=+t.value;
    const w=t.nextElementSibling;if(w)w.textContent=WB.lands[i].rk.toFixed(1);
    wbDebounce();return;}}
document.addEventListener('input',tuneAct);
document.addEventListener('change',tuneAct);
/* 降落点改名：contenteditable 失焦即提交。
   ⚠ 用捕获阶段监听 blur —— blur 不冒泡，挂在容器上不加 true 收不到。 */
document.getElementById('mside').addEventListener('blur',e=>{
  const el=e.target;
  if(!el||!el.classList||!el.classList.contains('lnm'))return;
  const i=+el.dataset.nm;
  if(!WB||!WB.lands||!WB.lands[i])return;
  const v=(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,40);
  WB.lands[i].nm=v||landName(WB.hub,WB.lands[i].lat,WB.lands[i].lng);
  if(el.textContent!==WB.lands[i].nm)el.textContent=WB.lands[i].nm;
  wbDraw();},true);
document.getElementById('mside').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.classList&&e.target.classList.contains('lnm')){
    e.preventDefault();e.target.blur();}});
/* 时间轴：连续播放。⚠ 走 setInterval 不走 rAF：无头环境与后台标签页都不跑 rAF */
(function(){
  const tls=document.getElementById('tls');
  let drag=false;
  const fromE=e=>{const r=tls.getBoundingClientRect();
    stopPlay();tickTo((e.clientX-r.left-10)/(r.width-20)*(QSPAN().length-1));};
  tls.addEventListener('pointerdown',e=>{drag=true;fromE(e);});
  addEventListener('pointermove',e=>{if(drag)fromE(e);});
  addEventListener('pointerup',()=>{drag=false;});
  document.getElementById('play').onclick=function(){
    if(playing){stopPlay();return;}
    playing=true;this.textContent='❚❚';
    const N=QSPAN().length;
    if(TF>=N-1){TQ=-1;tickTo(0);}          /* 尾部重按 = 从头重放，点位全灭再逐季点亮 */
    const STEP=RM?N:33/550;                 /* 550ms 一季 */
    pT=setInterval(()=>{
      if(TF>=N-1){stopPlay();return;}
      tickTo(TF+STEP);},RM?250:33);};
})();
document.getElementById('tabC').onclick=()=>showTab('conc');
document.getElementById('tabM').onclick=()=>showTab('map');
document.getElementById('bFit').onclick=leaveCity;
document.getElementById('bFree').onclick=()=>{fpArm=!fpArm;syncFreeBtn();};
document.getElementById('bFlow').onclick=function(){
  const v=!on.flow;toggle('flow',v);this.classList.toggle('on',v);};
document.getElementById('scrim').onclick=()=>toggleDrawer(false);
document.getElementById('thTog').onclick=cycleTheme;
document.getElementById('lgBtn').onclick=()=>{
  LANG=LANG==='en'?'zh':'en';
  try{LANG==='en'?localStorage.setItem(LGKEY,'en'):localStorage.removeItem(LGKEY);}catch(e){}
  applyStatic();renderAll();
  if(document.getElementById('drawer').classList.contains('on'))renderDrawer();};
addEventListener('resize',()=>{
  if(mapOn)drawTL();
  if(mapOn&&mapBooted&&map)try{map.invalidateSize();}catch(e){}});
function applyStatic(){
  document.querySelectorAll('[data-tx]').forEach(e=>{e.textContent=tx(e.dataset.tx);});
  document.getElementById('lgBtn').textContent=LANG==='en'?'中':'EN';
  document.documentElement.lang=LANG==='en'?'en':'zh-CN';
  renderThemeBtn();
  syncBrand();                  /* applyStatic 刚把每个 [data-tx] 按属性重置过，
                                   顶栏那一行是状态不是招牌，要在这之后重写一次 */
  syncFreeBtn();}

/* ===== 启动 ===== */
fetch('../data/rollout.json',{cache:'no-store'}).then(r=>{
  if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>{
  R=d;
  TQ=TF=QSPAN().length-1;
  PY=PLAN_Y();
  verifyBaked();
  R_ready_hooks.forEach(f=>f());
  applyStatic();applyTheme();renderConc();
}).catch(e=>{
  console.warn('[OP] '+e.message);
  document.getElementById('conc').innerHTML=
    `<div class="errbar">${tx('载入数据失败')}<br>${tx('请确认数据文件已生成')}<br>
     <code>python3 scripts/gen_mock.py</code></div>`;});
</script>
