<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开航排期推演台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ============================================================
   开航排期推演台
   结构：两块。排期（一屏读完的判决）与地图（三栏作战面）。
        两道门：分城表点行进地图，点位卡「看排期」回排期。
   配色：深色写在 :root，浅色在 :root[data-theme="light"] 覆盖；
        默认浅色（不落键即浅色），只有显式选了深色才落 ops_theme。
        单暖色只给转正与已开航，亏损不染红。
   ============================================================ */
:root{
  color-scheme:dark;
  --bg:oklch(0.16 0.008 250);
  --surf:oklch(0.20 0.010 250);
  --surf2:oklch(0.235 0.010 250);
  --line:oklch(0.28 0.010 250);
  --line2:oklch(0.34 0.010 250);
  --ink:oklch(0.95 0.005 250);
  --ink2:oklch(0.68 0.010 250);
  --ink3:oklch(0.643 0.012 250);
  --warm:oklch(0.78 0.150 65);
  --warmDim:oklch(0.78 0.150 65 / .18);
  --warmFaint:oklch(0.78 0.150 65 / .08);
  --sel:oklch(0.72 0.045 250);
  --blue:#5E84F5;
  --block:#FF5E5E;
  --done:#2ED47A;
  --shadow:oklch(0.08 0.01 250 / .55);
  --glowK:1;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --z-head:80;--z-map:70;--z-drawer:100;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:oklch(0.972 0.004 250);
  --surf:oklch(1 0 0);
  --surf2:oklch(0.988 0.003 250);
  --line:oklch(0.905 0.006 250);
  --line2:oklch(0.845 0.008 250);
  --ink:oklch(0.27 0.010 250);
  --ink2:oklch(0.48 0.010 250);
  --ink3:oklch(0.527 0.012 250);
  --warm:oklch(0.558 0.140 60);
  --warmDim:oklch(0.558 0.140 60 / .16);
  --warmFaint:oklch(0.558 0.140 60 / .07);
  --sel:oklch(0.45 0.050 250);
  --blue:#3557C8;
  --block:#C42B35;
  --done:#147A41;
  --shadow:oklch(0.55 0.02 250 / .18);
  --glowK:0;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
table{border-collapse:collapse}
a{color:inherit}
/* 数字与单位之间的极窄间隙。不用空格字符：数值多走等宽字体，窄空格会被撑成整格 */
.g{display:inline-block;width:.16em}
:root[lang="en"] .g{width:auto}
:root[lang="en"] .g::before{content:" ";white-space:pre}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--warmDim)}
:focus-visible{outline:2px solid var(--warm);outline-offset:1px}

/* ===== 顶栏与 tab ===== */
.head{position:sticky;top:0;z-index:var(--z-head);display:flex;align-items:center;gap:14px;
  height:46px;padding:0 18px;background:var(--surf);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:13.5px;white-space:nowrap}
.brand i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink3);margin-left:8px}
.tabs{display:flex;gap:2px;height:100%}
.tabs button{position:relative;padding:0 14px;font-size:12.5px;color:var(--ink2)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--ink)}
.hsp{flex:1}
.hbtn{font-size:11.5px;color:var(--ink2);padding:5px 9px;border-radius:3px}
.hbtn:hover{color:var(--ink);background:var(--surf2)}
.bk2{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink3);
  text-decoration:none;padding:5px 9px;border-radius:3px;white-space:nowrap}
.bk2:hover{color:var(--ink);background:var(--surf2)}
.thtog{display:inline-flex;align-items:center;justify-content:center;width:28px;height:24px;
  border-radius:3px;color:var(--ink2)}
.thtog:hover{color:var(--warm);background:var(--surf2)}
.thtog svg{width:15px;height:15px}

/* ===== 排期页 ===== */
.conc{max-width:1120px;margin:0 auto;padding:22px 26px 28px}
/* 分块靠「面」：每一段坐在自己的面上，块与块之间只有留白，一条分割线都没有。
   首块用暖色眉标，其余中性：靠一处暖色分出主次，不给每块各配一个颜色。 */
.blk{background:var(--surf);border:1px solid var(--line);border-radius:6px;
  padding:16px 20px 18px;margin-bottom:14px;
  box-shadow:0 1px 0 var(--line),0 10px 24px -18px var(--shadow)}
.sq{display:inline-flex;align-items:center;height:20px;padding:0 9px;margin-bottom:12px;
  border-radius:3px;background:var(--surf2);border:1px solid var(--line);
  font-size:10.5px;color:var(--ink2);letter-spacing:.3px}
.blk.lead .sq{background:var(--warmFaint);border-color:color-mix(in oklch,var(--warm) 28%,transparent);
  color:var(--warm)}
.blk.plan-blk .sq{background:color-mix(in oklch,var(--blue) 8%,transparent);
  border-color:color-mix(in oklch,var(--blue) 26%,transparent);color:var(--blue)}

.verdict{display:flex;align-items:flex-end;gap:34px;flex-wrap:wrap;padding-bottom:14px;
  justify-content:space-between;border-bottom:1px solid var(--line)}
.verdict .cap{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.6px;margin-bottom:5px}
.vbig{font-family:var(--mono);font-weight:600;font-size:40px;line-height:1;color:var(--warm);letter-spacing:-.02em}
.vbig small{font-size:15px;font-weight:400;color:var(--ink);margin-left:8px;letter-spacing:0}
.vhi{font-family:var(--mono);font-size:9.5px;color:var(--ink3);letter-spacing:.2px;margin-top:3px}
.vn .vhi{margin-top:1px}
/* 模型拆解入口：实心块。底色走 warmDim（暖色低透明度派生，不是新增色相），
   文字用 warm，与大字同一支，靠「填充 vs 文字」区分层级而不是靠再来一个颜色。 */
.chaintab{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;align-self:center;
  margin:0 auto;padding:9px 16px;border:none;border-radius:5px;background:var(--warmDim);
  color:var(--warm);font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;
  transition:background .15s linear}
.chaintab:hover{background:color-mix(in oklch,var(--warm) 26%,transparent)}
.vnums{display:flex;gap:30px;margin-left:auto}
.vn{text-align:right}
.vn .k{font-size:10px;color:var(--ink3);margin-bottom:4px}
.vn .v{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--ink)}
.vn .v.w{color:var(--warm)}
.vn .v small{font-size:10.5px;color:var(--ink3);font-weight:400;margin-left:2px}
.vn.click{cursor:pointer}
.vn.click:hover .k,.vn.on .k{color:var(--ink2)}
/* 分城市查看切换器：坐在判决区抬头那一行，压到与它同一档字号，不抢大字 */
.vwsel{display:inline-flex;gap:2px;vertical-align:baseline;flex-wrap:wrap}
.vwb{font:inherit;font-size:10.5px;color:var(--ink3);background:transparent;border:0;
  cursor:pointer;padding:1px 5px;border-radius:3px;letter-spacing:.2px}
.vwb:hover{color:var(--ink2);background:var(--surf2)}
.vwb.on{color:var(--warm);background:var(--warmFaint)}
.vrad{width:100%;font:600 11px/1.5 var(--mono);color:var(--warm);
  background:var(--warmFaint);border:1px solid var(--warmDim);border-radius:4px;
  padding:6px 10px;margin-bottom:10px}
.vrad .exr{margin-left:10px;font:inherit;color:var(--warm);background:none;border:none;
  border-bottom:1px dashed var(--warmDim);cursor:pointer;padding:0}

.plan{margin-top:16px}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{text-align:left;font-weight:400;color:var(--ink3);font-size:10px;padding:5px 10px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);color:var(--ink2)}
.tbl td.nm{font-family:var(--sans);color:var(--ink)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
#conc [data-go]:focus-visible{outline:2px solid var(--warm);outline-offset:-2px}
.tbl tr.click:hover td{background:var(--surf2)}
.tbl tr.on td{background:var(--surf2)}
.tbl .w{color:var(--warm)}
.tbl .dim{color:var(--ink3)}
.offm{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-left:4px;white-space:nowrap}
/* 规划表：行线整片撤掉，让眉标成为这张表上唯一的横向结构。
   只剩三条横线：两个眉标各一条底线 + 净利那条合计线。 */
.tbl.plan td{border-bottom:none;padding-top:7px;padding-bottom:7px}
.tbl.plan th.yh{font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right}
.tbl.plan th.turn{color:var(--warm)}
.tbl.plan td.turn{background:var(--warmFaint)}
.tbl.plan td.nm{padding-top:6px;padding-bottom:6px;white-space:nowrap;line-height:1.3}
/* 行名下面的算式：逻辑贴着它算出来的数，页面因此不需要一段散文去讲同一件事 */
.tbl.plan td.nm i{display:block;font-family:var(--mono);font-style:normal;font-size:9.5px;
  color:var(--ink3);margin-top:1px;letter-spacing:.1px;line-height:1.35}
.tbl.plan tr.net td{font-weight:600;font-size:14px;border-top:1px solid var(--line2)}
.tbl.plan tr.net td.nm i{font-weight:400;color:var(--ink3);font-size:9.5px}
.tbl.plan tr.net td.nm{font-weight:600}
.tbl.plan .u{font-family:var(--mono);font-size:9.5px;color:var(--ink3);text-align:right;
  white-space:nowrap;width:76px}
.tbl.plan td.v{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.tbl.plan tr.net td.v{font-size:14px;font-weight:600}
.tbl.plan tr.emrow td{border-bottom:none;padding-top:9px;padding-bottom:1px}
.tbl.plan td.nm.sub2{color:var(--ink2);font-size:11px;padding-left:18px}
.tbl.plan td.nm.sub2 i{display:inline;font-style:normal;font-family:var(--mono);font-size:9.5px;
  color:var(--ink3);margin-left:7px}
.tbl.plan td.nm.sub3{padding-left:34px;color:var(--ink2)}
.tbl.plan tr.strow td{border-bottom:none;padding-top:3px;padding-bottom:3px;font-size:10.5px;
  color:var(--ink3);white-space:nowrap}
.tbl.plan tr.strow{cursor:pointer}
.tbl.plan tr.strow:hover td{background:var(--surf2)}
.tbl.plan tr.strow:last-child td{padding-bottom:9px}
.tbl.plan tr.sep > td{border-top:1px solid var(--line)}
/* 两条眉标同高，靠上下两条横线成一整行的带，不靠上留白拉开组距 */
.tbl tr.grph > td{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.6px;
  color:var(--ink);padding:9px 10px;background:var(--surf2);
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.tbl tr.hirow td{color:var(--ink3)}
.tbl tr.hirow td.nm i{display:block;font-style:normal;font-size:9px;color:var(--ink3);margin-top:2px}
.tbl tr.hirow.first td{border-top:1px dashed var(--line2)}
/* 三类点位：计划 = 业务侧计划里有开航月份的 · 推荐 = 模型排出来的 · 未排期 = 没排上 */
.tbl.plan .pln{font-family:var(--mono);font-size:8.5px;color:var(--blue);
  border:1px solid color-mix(in oklch,var(--blue) 30%,transparent);
  border-radius:2px;padding:0 3px;margin-left:5px;vertical-align:1px}
.tbl.plan .pln.rec{color:var(--warm);border-color:color-mix(in oklch,var(--warm) 35%,transparent)}
.tbl.plan .pln.unp{color:var(--ink3);border-color:var(--line2)}
/* 索降标的是履约形态不是来源，给它自己一档：实心底、无边框 */
.tbl.plan .pln.sd{color:var(--bg);background:var(--warm);border-color:var(--warm)}
.segw{font-family:var(--mono);font-size:9.5px;color:var(--ink3);letter-spacing:.2px;
  border-bottom:1px dashed var(--line2);padding-bottom:1px}
.segt{font-family:var(--mono);font-style:normal;font-size:8.5px;color:var(--ink3);
  border:1px solid var(--line2);border-radius:2px;padding:0 3px;margin-left:5px;
  vertical-align:1px;letter-spacing:.2px;white-space:nowrap}
.pyh{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.pyh b{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}
.pyh span{font-size:10.5px;color:var(--ink3)}
.qtog{font-family:var(--mono);font-size:9px;letter-spacing:.3px;white-space:nowrap;cursor:pointer;
  color:var(--ink3);background:transparent;border:1px solid var(--line2);border-radius:3px;padding:2px 7px}
.qtog:hover{color:var(--ink2);border-color:var(--ink3)}
.qtog.on{color:var(--warm);border-color:var(--warm);background:var(--warmFaint)}
.pyl{display:flex;align-items:baseline;gap:18px;margin-top:14px;padding-top:11px;
  border-top:1px solid var(--line);flex-wrap:wrap}
.cs{font-size:10px;color:var(--ink3);display:flex;flex-direction:column;gap:2px}
.cs b{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink2)}
.cs b.w{color:var(--warm)}
.pyl .cs.yr{cursor:pointer;padding:2px 6px;border-radius:4px;border:1px solid transparent}
.pyl .cs.yr:hover{background:var(--surf2)}
.pyl .cs.yr.on{border-color:var(--warm);background:var(--warmFaint)}
.pyl .cs.yr.on b{color:var(--warm)}

/* ===== 详情 = 一张贴纸 =====
   点表里任意一行，这块从表下面掀出来：自带底色 + 抬起阴影 + 顶部一条略深的标签条。
   ⚠ 只此一张。里面不许再出现第二个有底色的盒子；分区仍靠 1px 细线与留白。 */
.detail[hidden]{display:none}
.detail{margin-top:16px;min-height:210px;display:flex;flex-direction:column;
  background:var(--surf);border:1px solid var(--line);border-radius:5px;
  box-shadow:0 1px 0 var(--line),0 10px 24px -14px var(--shadow);overflow:hidden}
.dhd{display:flex;align-items:baseline;gap:10px;flex:none;
  padding:9px 14px;background:var(--surf2);border-bottom:1px solid var(--line)}
.dhd b{font-size:12px;font-weight:600;color:var(--ink)}
.dhd span{font-size:10.5px;color:var(--ink3)}
.dhd .rst{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink3);
  cursor:pointer;border-bottom:1px dashed var(--line2)}
.dhd .rst:hover{color:var(--warm);border-bottom-color:var(--warm)}
.dhd .rst+.x{margin-left:12px}
.dhd .x{margin-left:auto;font-size:10.5px;color:var(--ink3);cursor:pointer;font-family:var(--mono)}
.dhd .x:hover{color:var(--warm)}
.dbd{flex:1;padding:12px 14px 14px;overflow-x:auto}
.dp{font-size:12px;line-height:1.85;color:var(--ink2);max-width:38em;margin-bottom:9px}
.dfx{font-family:var(--mono);font-size:10.5px;color:var(--ink3);line-height:1.9;margin-bottom:11px}
/* 逻辑链：一步一行，量名 · 算式 · 三态。三态里只有「假定值」上暖色，它是唯一能调的那类 */
.chain{margin-bottom:12px;max-width:880px}
.cst{display:grid;grid-template-columns:20px 118px 1fr auto;gap:10px;align-items:baseline;
  padding:5px 0;border-bottom:1px solid var(--line)}
.cst:last-child{border-bottom:none}
.cst .cn{font-family:var(--mono);font-size:10px;color:var(--ink3);font-weight:400}
.cst .ck{font-size:11px;color:var(--ink2)}
.cst .cf{font-family:var(--mono);font-size:10.5px;color:var(--ink3);line-height:1.7}
.cst .cf u{text-decoration:none;display:block;color:var(--ink3);font-size:9.5px;margin-top:2px}
.cst .c3{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.3px;white-space:nowrap}
.cst .c3.k{color:var(--warm)}
.cst.sum{border-bottom:none;padding-top:7px}
.cst.sum .cn{color:var(--ink2)}
.cst.sum .ck{color:var(--ink);font-weight:600}
.cst.sum .cf{color:var(--ink2);font-size:11.5px}
.cnote{font-family:var(--mono);font-size:10px;color:var(--ink3);line-height:1.8;max-width:880px;
  padding-top:8px;margin-bottom:11px;border-top:1px solid var(--line)}
.cnote b{color:var(--warm);font-weight:400}
/* 就地调参：滑杆长在链条行里，讲这个数和拨这个数是同一处 */
.cst .pk{display:flex;align-items:center;gap:9px;margin-top:5px;flex-wrap:wrap}
.cst .pk input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:14px;
  background:transparent;cursor:pointer;flex:none}
.cst .pk input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line2);border-radius:2px}
.cst .pk input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:10px;height:10px;border-radius:50%;background:var(--ink2);margin-top:-4px;border:none}
.cst .pk input[type=range]:hover::-webkit-slider-thumb{background:var(--warm)}
.cst .pk input[type=range]::-moz-range-track{height:2px;background:var(--line2);border-radius:2px}
.cst .pk input[type=range]::-moz-range-thumb{width:10px;height:10px;border:none;border-radius:50%;background:var(--ink2)}
.cst .pk em.pn{font-style:normal;font-size:10.5px;color:var(--ink2);width:118px;flex:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cst .pk.on em.pn{color:var(--warm)}
.cst .pk b.pv{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink);min-width:76px}
.cst .pk.on b.pv{color:var(--warm)}
.cst .pk i{font-family:var(--mono);font-style:normal;font-size:9px;color:var(--ink3);white-space:nowrap}
/* 抽屉小标题：与年度计划表的眉标同规格，只是不铺底色 */
.dsec{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.5px;color:var(--ink);
  margin:20px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.dsec i{font-style:normal;font-weight:400;font-size:10px;color:var(--ink3);margin-left:9px;letter-spacing:0}
/* 漏斗只在详情里出现 */
.fnl{display:flex;flex-direction:column;margin-top:8px}
.frow{display:grid;grid-template-columns:128px 1fr 96px 200px;align-items:center;gap:14px;padding:4px 0}
.frow .fl{font-size:11px;color:var(--ink2)}
.frow.last .fl{color:var(--ink);font-weight:600}
.fbar{position:relative;height:12px}
.fbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink3);opacity:.3;border-radius:2px}
.frow.last .fbar i{background:var(--warm);opacity:1}
.frow .fv{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink2)}
.frow.last .fv{color:var(--warm);font-weight:600}
.frow .fop{font-family:var(--mono);font-size:9.5px;color:var(--ink3);white-space:nowrap}

@media (min-width:1600px){
  .conc{max-width:1260px}
  .tbl{font-size:12.5px}
  .tbl.plan td.nm i{font-size:10.5px}
  .tbl.plan .u{font-size:10.5px}
  .tbl th{font-size:11px}
  .vbig{font-size:46px}
  .cst .cf{font-size:11.5px}
  .cst .ck{font-size:12px}
}

/* ===== 地图视图 = 三栏 =====
   地图跟页面主题走，深浅都要能看。浅色档不是把深色值调亮：
   · 曜金在白底对比度只有 1.4:1，当细线和文字完全不可读，故填充档取 #E0A400、文字另走 --warm；
   · 电蓝同理下沉；发光在白底上不产生「亮」只产生「糊」，浅色档 --glowK 整条关掉。
   所有会随主题变的量一律走令牌，JS 侧用 cssv() 读 #map 的 computed 值，改一处两档同步。 */
.mapv{--bcn:#FFD100;--lnd:#5E84F5;--hollow:rgba(158,168,194,.75);
  --tbBg:rgba(13,15,26,.80);--mapBg:#07080e;--tip:#141627;--tipFg:#E9EEF9;
  --yglow:rgba(255,209,0,.18);--rwSup:1.5;--rwLand:1.5;--rfSup:.06;--rfLand:.05;
  --lblBg:rgba(7,11,22,.66);--lblHalo:#000;--sectorLbl:rgba(233,238,249,.5);--sectorLblF:rgba(233,238,249,.85);
  position:fixed;left:0;right:0;bottom:0;top:46px;z-index:var(--z-map);background:var(--bg);
  /* ⚠ color 必须显式写：变量只级联定义不改继承链，漏了这行右轨会继承别处的字色 */
  color:var(--ink);
  display:none;grid-template-columns:238px 1fr 312px}
:root[data-theme="light"] .mapv{
  --bcn:#E0A400;--lnd:#3557C8;--hollow:rgba(85,97,122,.7);
  --tbBg:rgba(255,255,255,.86);--mapBg:#F2F2F0;--tip:#FFFFFF;--tipFg:#1B2333;
  --yglow:rgba(240,180,0,.32);--rwSup:2.2;--rwLand:2;--rfSup:.18;--rfLand:.14;
  --lblBg:rgba(255,255,255,.86);--lblHalo:rgba(255,255,255,.9);
  --sectorLbl:rgba(27,35,51,.55);--sectorLblF:rgba(27,35,51,.88)}
body.mapping .mapv{display:grid}
body.mapping .conc{display:none}
.mrail{border-right:1px solid var(--line);overflow-y:auto;background:var(--surf);padding:0 0 24px}
.mrail::-webkit-scrollbar{width:0}
.mside{border-left:1px solid var(--line);overflow-y:auto;background:var(--surf);padding:16px}
.mside::-webkit-scrollbar{width:0}
.mcol{position:relative;min-width:0;display:flex;flex-direction:column}
#map{flex:1;min-height:0;background:var(--mapBg)}
.mtop{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;z-index:700;pointer-events:none}
.mtop button{pointer-events:auto;font-family:var(--mono);font-size:11px;padding:6px 11px;
  border:1px solid var(--line2);border-radius:3px;background:var(--surf);color:var(--ink2)}
.mtop button:hover{color:var(--ink);border-color:var(--ink3)}
.mtop button.on{color:var(--warm);border-color:var(--warmDim)}
.mtop .sp{flex:1}
/* 点位三档图例。⚠ 三个色点与 .dotSched / .dotHollow / .dotPot 逐值同源，改一处三处同改 */
.mlgd{position:absolute;top:44px;left:12px;z-index:700;pointer-events:none;
  display:flex;gap:12px;font:600 10px/1 var(--mono);color:var(--ink2);letter-spacing:.3px}
.mlgd span{display:flex;align-items:center;gap:4px}
.mlgd i{width:7px;height:7px;border-radius:50%;display:inline-block}
.mlgd .lg1{background:var(--bcn);box-shadow:0 0 calc(6px * var(--glowK)) var(--bcn)}
.mlgd .lg2{background:transparent;border:1.4px solid var(--hollow)}
.mlgd .lgtog{pointer-events:auto;cursor:pointer;opacity:.45;transition:opacity .15s}
.mlgd .lgtog.on{opacity:1}
.mlgd .lgtog:hover{opacity:.8}
.mlgd .lg3{width:6px;height:6px;background:transparent;
  border:1.2px solid color-mix(in srgb,var(--sel) 70%,transparent)}
body.fparm .mcol{cursor:crosshair}
body.fparm .leaflet-container{cursor:crosshair}
.lgrp{padding:13px 15px;border-bottom:1px solid var(--line)}
.lgrp:last-child{border-bottom:none}
.lgrp h4{font-size:10.5px;color:var(--ink3);margin-bottom:8px;font-weight:400;line-height:1.5}
.lt{display:flex;align-items:center;gap:8px;padding:4px 5px;border-radius:3px;cursor:pointer;user-select:none}
.lt:hover{background:var(--surf2)}
.lt input{accent-color:var(--blue);width:12px;height:12px;flex:none;margin:0;cursor:pointer}
.lt .dot{width:9px;height:9px;border-radius:50%;flex:none}
.lt .ramp{width:16px;height:6px;border-radius:3px;display:inline-block;flex:none}
.lt .lb{font-size:11px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.lt .cnt{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.kwrap{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kchip{background:var(--surf2);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
.kchip .v{font-family:var(--mono);font-size:14.5px;font-weight:600;color:var(--warm)}
.kchip .v small{font-size:9.5px;font-weight:400;color:var(--ink3);margin-left:2px}
.kchip .k{font-size:9.5px;color:var(--ink3);margin-top:2px;white-space:nowrap}
.neg{color:var(--block)!important}
.pos2{color:var(--done)!important}

/* 时间轴浮层：玻璃浮层 + 播放 + 拖拽游标 + 点火 flare */
#timebar{position:absolute;left:12px;right:12px;bottom:12px;z-index:600;background:var(--tbBg);
  backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:8px;padding:9px 14px 8px;
  box-shadow:0 10px 34px var(--shadow)}
.tbhead{display:flex;align-items:center;gap:11px;margin-bottom:3px}
.tbt{font-size:11px;color:var(--ink2);font-weight:600}
#play{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);font-size:9px;flex:none;
  color:var(--ink2);transition:.15s}
#play:hover{border-color:var(--warm);color:var(--warm)}
#qlab{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--warm)}
#concl{margin-left:auto;font-size:11px;color:var(--ink2);text-align:right;line-height:1.5}
#concl b{color:var(--ink);font-family:var(--mono)}
#concl .mvem{color:var(--warm);font-weight:600}
#concl .ok{color:var(--done)}
#tlw{position:relative;height:56px}
#tls{position:absolute;inset:0;width:100%;height:100%;cursor:ew-resize}
.tlflare{transform-box:fill-box;transform-origin:center;animation:tlfl .9s cubic-bezier(.15,.6,.25,1) both}
@keyframes tlfl{0%{transform:scale(.6);opacity:.95}100%{transform:scale(4.6);opacity:0}}
.igr{position:absolute;inset:0;border-radius:50%;border:2px solid var(--warm);pointer-events:none;
  animation:igring .95s cubic-bezier(.15,.6,.25,1) both}
@keyframes igring{0%{transform:scale(1);opacity:0}14%{opacity:.9}100%{transform:scale(7.5);opacity:0}}

/* 右轨 */
.mside h3{font-size:14px;font-weight:600;margin-bottom:4px}
.mside .sub{font-size:11px;color:var(--ink3);line-height:1.75;margin-bottom:12px}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink2)}
.mrow span:last-child{font-family:var(--mono);color:var(--ink);text-align:right}
.mrow.warm span:last-child{color:var(--warm)}
.mrow.pick{color:var(--warm);font-weight:600}
.mbtn{display:block;width:100%;text-align:center;margin-top:14px;padding:8px 0;border:1px solid var(--line2);
  border-radius:3px;font-size:11.5px;color:var(--ink2)}
.mbtn:hover{color:var(--warm);border-color:var(--warmDim)}
.bk{display:inline-block;font-size:10.5px;color:var(--ink3);margin-bottom:10px;cursor:pointer}
.bk:hover{color:var(--ink)}
.tg{font-family:var(--mono);font-size:9px;border:1px solid var(--line2);border-radius:2px;
  padding:0 4px;color:var(--ink3);white-space:nowrap}
.tg.sdtg{color:var(--warm);border-color:var(--warm)}
.note{font-size:10.5px;color:var(--ink3);line-height:1.7;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--line)}
.warnrow{font-size:10.5px;color:var(--warm);line-height:1.6;margin-top:10px}
.ucard{border:1px solid var(--line);border-radius:5px;padding:11px 12px;margin-bottom:10px;
  cursor:pointer;background:var(--surf)}
.ucard:hover{border-color:var(--warmDim)}
.ucard .uh{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.ucard .un{font-weight:600;font-size:12.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--ink)}
.ucard .un::before{content:"● ";color:var(--warm);font-size:8px;vertical-align:1.5px}
.ucard .uq{font-family:var(--mono);font-size:9.5px;color:var(--ink3);white-space:nowrap}
.ucard .uq.on{color:var(--warm)}
.ucard .chips{display:flex;gap:6px}
.ucard .uc{flex:1;background:var(--surf2);border:1px solid var(--line);border-radius:3px;
  padding:5px 7px;min-width:0}
.ucard .uc .v{font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink)}
.ucard .uc .v small{font-size:9px;font-weight:400;color:var(--ink3)}
/* ⚠ 别给 .k 加 white-space:nowrap：三个芯片 flex:1 平分右轨宽度，长标签会溢出被裁掉 */
.ucard .uc .k{font-size:8.5px;color:var(--ink3);margin-top:2px;line-height:1.35;
  overflow-wrap:anywhere;word-break:break-word}
.ucard .uf{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin-top:7px}
.ucard .ucov{font-size:9.5px;line-height:1.5;color:var(--ink3);margin-top:7px;
  padding-top:6px;border-top:1px dashed var(--line)}
.ucard .ucov b{font-family:var(--mono);font-weight:600;color:var(--ink2)}
/* 增删：✕ 常驻不 hover 才现 —— 右轨是决策面，藏起来的操作等于没有 */
.ucard .ux{flex:none;border:0;background:transparent;cursor:pointer;padding:0 2px;
  font-size:11px;line-height:1;color:var(--ink3);font-family:var(--mono)}
.ucard .ux:hover{color:var(--warm)}
.ucard.off{opacity:.5}
.ucard.off .un{text-decoration:line-through;text-decoration-thickness:1px}
.exb{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:10px;color:var(--warm);
  background:var(--warmFaint);border:1px solid var(--line);border-radius:4px;
  padding:6px 9px;margin-bottom:9px}
.exb .rst{cursor:pointer;color:var(--ink3);border-bottom:1px dashed var(--line2)}
.exb .rst:hover{color:var(--warm);border-bottom-color:var(--warm)}
.exb .exr{margin-left:10px;font:inherit;color:var(--warm);background:none;border:none;
  border-bottom:1px dashed var(--warmDim);cursor:pointer;padding:0}
.exb.busy{color:var(--ink2)}
.wrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);
  font-size:11px;color:var(--ink2)}
.wrow input[type=range]{flex:1;accent-color:var(--blue);height:14px;margin:0;min-width:0}
.wrow .wv{font-family:var(--mono);font-size:10.5px;color:var(--ink);width:52px;text-align:right;flex:none}
.lland{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lland .lnm{flex:1;min-width:60px;font-size:11.5px;color:var(--ink);outline:none;
  border-bottom:1px dashed transparent;cursor:text}
.lland .lnm:hover{border-bottom-color:var(--line2)}
.lland .lnm:focus{border-bottom-color:var(--warm)}
.lland .cc2{flex:0 0 100%;font-family:var(--mono);font-size:9px;color:var(--ink3);
  letter-spacing:.3px;padding-left:23px}
.lland .idx{width:16px;height:16px;border-radius:50%;background:rgba(94,132,245,.16);color:var(--blue);
  font-family:var(--mono);font-size:9px;display:flex;align-items:center;justify-content:center;flex:none}
.lland input[type=range]{flex:1;accent-color:var(--blue);height:12px;margin:0;min-width:24px}
.lland .rv{font-family:var(--mono);font-size:9.5px;color:var(--ink);width:40px;text-align:right;flex:none}
.lland .del{color:var(--ink3);font-size:12px;padding:0 3px;flex:none}
.lland .del:hover{color:var(--warm)}
.addrow{display:flex;gap:6px;margin-top:9px}
.addrow input[type=text]{flex:1;min-width:0;font:10.5px var(--mono);color:var(--ink);background:var(--surf2);
  border:1px solid var(--line2);border-radius:3px;padding:5px 7px;outline:none}
.addrow button,.wbtn{font-size:10.5px;padding:5px 9px;border:1px solid var(--line2);border-radius:3px;
  color:var(--ink2);white-space:nowrap}
.addrow button:hover,.wbtn:hover{color:var(--ink);border-color:var(--ink3)}
.wbtn.on{color:var(--warm);border-color:var(--warmDim)}
.wbtn.join{width:100%;margin-top:9px;border-color:var(--warm);color:var(--warm)}
.devi{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--warm);margin-top:9px;
  padding:6px 8px;border:1px solid var(--warmDim);border-radius:3px}
.devi a{color:var(--warm);text-decoration:underline;cursor:pointer;margin-left:auto}
.wsec{font-size:10px;color:var(--ink3);margin:13px 0 3px;letter-spacing:.4px}
/* 圈边拖拽手柄：拖它即改半径。形状是横向胶囊不是圆点 ——
   同色圆点等于凭空多一个点位，横向也把「沿半径左右拖」这件事说清楚了 */
.rgrip{width:12px;height:6px;border-radius:3px;border:1.2px solid var(--mapBg);cursor:ew-resize;
  position:relative;opacity:.85;transition:opacity .12s var(--ease),transform .12s var(--ease);
  box-shadow:0 0 0 1px var(--shadow),0 1px 4px var(--shadow)}
.rgrip:hover{opacity:1;transform:scale(1.25)}
.rgrip.sup{background:var(--bcn)}
.rgrip.land{background:var(--lnd)}
.rgtag{position:absolute;left:50%;bottom:11px;transform:translateX(-50%);white-space:nowrap;
  font:700 9px/1 var(--mono);letter-spacing:.3px;padding:2px 5px;border-radius:4px;
  background:var(--tip);border:1px solid var(--line2);box-shadow:0 2px 6px var(--shadow)}
.rgrip.sup .rgtag{color:var(--bcn)}
.rgrip.land .rgtag{color:var(--lnd)}
/* 底图署名常驻：公开底图服务的条款要的是可见的署名，别关掉它 */
.leaflet-control-attribution{font-size:9px;line-height:1.5;padding:1px 6px;border-radius:6px 0 0 0;
  background:rgba(7,8,14,.42);color:var(--ink3);font-family:var(--sans);box-shadow:none}
.leaflet-control-attribution a{color:var(--ink3);text-decoration:none}
.leaflet-control-attribution a:hover{color:var(--ink2);text-decoration:underline}
:root[data-theme="light"] .leaflet-control-attribution{background:rgba(255,255,255,.62)}
.leaflet-tooltip.lbl{background:var(--tip);border:1px solid var(--line2);
  box-shadow:0 3px 12px var(--shadow);font-family:var(--mono);font-size:11px;
  color:var(--tipFg);border-radius:8px;padding:4px 8px}
.leaflet-tooltip.lbl::before{display:none}
.sector-label{font-family:var(--mono);font-size:11px;color:var(--sectorLbl);font-weight:700;
  letter-spacing:.5px;text-shadow:0 1px 4px var(--lblHalo);white-space:nowrap;pointer-events:none;
  background:none;border:none;box-shadow:none;text-align:center;
  transition:font-size .25s,color .25s,opacity .25s}
.sector-label.focus{color:var(--sectorLblF)}
.sector-label.dim{opacity:.25}
/* 信标三件：起飞信标 · 静默信标 · 降落点。发光半径一律 calc(Npx * var(--glowK))，浅色档关掉 */
.beaconHub{width:8px;height:8px;border-radius:50%;background:var(--bcn);color:var(--bcn);
  position:relative;cursor:pointer;
  box-shadow:0 0 0 2.5px var(--yglow),0 0 calc(9px * var(--glowK)) var(--bcn)}
.beaconHub::after{content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;
  border:1.2px solid color-mix(in srgb,var(--bcn) 55%,transparent);animation:hpulse 2.2s infinite}
@keyframes hpulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.beaconQuiet{width:7px;height:7px;border-radius:50%;background:var(--bcn);color:var(--bcn);
  position:relative;cursor:pointer;
  box-shadow:0 0 0 2.5px var(--yglow),0 0 calc(9px * var(--glowK)) var(--bcn)}
.beaconQuiet::after{content:"";position:absolute;inset:-4.5px;border-radius:50%;pointer-events:none;
  border:1.2px solid color-mix(in srgb,var(--bcn) 55%,transparent);animation:hpulse 2.2s infinite}
.beaconLand{width:11px;height:11px;border-radius:50%;background:var(--lnd);
  box-shadow:0 0 0 2.5px color-mix(in srgb,var(--lnd) 30%,transparent),
             0 0 calc(12px * var(--glowK)) var(--lnd)}
.beaconFree{width:11px;height:11px;border-radius:50%;background:var(--sel);color:var(--sel);
  position:relative;cursor:pointer;box-shadow:0 0 0 3px var(--warmFaint)}
.dotSched{width:8px;height:8px;border-radius:50%;background:var(--bcn);cursor:pointer;
  box-shadow:0 0 calc(8px * var(--glowK)) var(--bcn)}
.dotHollow{width:7px;height:7px;border-radius:50%;background:transparent;cursor:pointer;
  border:1.4px solid var(--hollow)}
/* 潜在点位取电蓝空心环：金是真实经营点位，蓝是数据算出来的东西 */
.dotPot{width:6px;height:6px;border-radius:50%;background:transparent;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--sel) 40%,transparent)}
.bLabel{position:absolute;left:11px;top:50%;transform:translateY(-50%);white-space:nowrap;
  font:700 9px/1 var(--mono);letter-spacing:.3px;word-spacing:-2px;color:var(--warm);
  text-shadow:0 1px 4px var(--lblHalo);background:var(--lblBg);padding:2px 5px;border-radius:5px;
  border:1px solid var(--yglow)}
.bLabel.mut{color:var(--ink2);border-color:var(--line)}

/* ===== 口径抽屉 ===== */
.drawer{position:fixed;top:0;right:0;bottom:0;left:auto;width:min(720px,94vw);background:var(--surf);
  border-left:1px solid var(--line2);z-index:var(--z-drawer);overflow-y:auto;padding:24px 26px 56px;
  transform:translateX(100%);transition:transform .26s var(--ease);box-shadow:-24px 0 60px -30px var(--shadow)}
.drawer.on{transform:none}
.dwrap{max-width:none}
.drawer h2{font-size:15px;font-weight:600;margin-bottom:8px}
.drawer .close{position:absolute;top:20px;right:22px;color:var(--ink3);font-size:15px;line-height:1}
.drawer .close:hover{color:var(--ink)}
.scrim{position:fixed;inset:0;background:oklch(0.10 0.01 250 / .5);z-index:99;
  opacity:0;pointer-events:none;transition:opacity .2s linear}
.scrim.on{opacity:1;pointer-events:auto}
.vnote{font-size:11px;color:var(--ink3);line-height:1.7;margin-bottom:6px}
.dtbl{width:100%;font-size:11.5px;margin-top:14px;table-layout:fixed}
.dtbl col.c1{width:170px}.dtbl col.c3{width:76px}
.dtbl th{font-size:10px;color:var(--ink3);font-weight:400;text-align:left;padding:7px 9px 7px 0;
  border-bottom:1px solid var(--line2)}
.dtbl th.st3,.dtbl td.st3{text-align:right;padding-right:0}
.dtbl td{padding:9px 9px 3px 0;vertical-align:top;line-height:1.75}
.dtbl td.p{font-family:var(--mono);white-space:normal;overflow-wrap:break-word}
.dtbl .fl1{line-height:1.85}
.dtbl .fl2{display:block;font-size:10px;color:var(--ink3);line-height:1.7;margin-top:1px}
.dtbl .fno{color:var(--warm);font-family:var(--mono);margin-right:4px}
/* 三层分节标题。通栏一行，靠留白与暖色左条分层；不加横线 */
.dtbl tr.fsec td{padding-top:22px;padding-bottom:6px;border-bottom:none}
.dtbl tr.fsec:first-child td{padding-top:2px}
.dtbl tr.fsec b{display:inline-block;font-size:13px;color:var(--ink);
  border-left:3px solid var(--warm);padding-left:8px;line-height:1.2}
.dtbl tr.fsec span{margin-left:10px;font-size:11px;color:var(--ink3)}
.dtbl tr.fsub td{padding:16px 0 2px;border-bottom:none}
.dtbl tr.fsub b{font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.6px}
.dtbl tr.fsub i{font-style:normal;margin-left:8px;font-size:10px;color:var(--ink3);letter-spacing:0}
/* 右列三级缩进：正文顶格，从属子句退一级，数字推导退两级并降一档色 */
.dtbl .d1{display:block;padding-left:1.8em}

<script id="ue-model">/*UE_MODEL_START*/
/* ============================================================================
 * 单元经济测算引擎 —— 全站唯一口径单源
 *
 * 浏览器：window.UEModel   Node：globalThis.UEModel
 * 用法：  UEModel.compute({dailyOrders: 200, landingPts: 4, takeoffRent: 9000, ...})
 *         UEModel.findBreakeven(cfg)            → 真实保本线
 *         UEModel.rentFromPoints(rentPoints[,y]) → 逐点租金折算成标量
 *         UEModel.project(cfg[, growth])         → 五年逐年推演
 *
 * 结构要点
 *   收入 = 单均配送收入(客单价×佣金率 + 平台费 + C端配送费) × 月单量 + 广告收入
 *   成本 = 人力 + 设备折旧 + 电池 + 场地办公 + 其他 + 网络运维 + 营销补贴
 *   驱动 = 日均单量。人力与设备都是阶梯量(ceil)，所以利润对单量非单调。
 *   租金 = 逐点四模式(固定 / 仅营业额提成 / 固定+营业额提成 / 固定+配送费提成)
 *          在 rentFromPoints 独立折算后写回标量，compute 只消费标量。
 *
 * 三页共用这一份文件，由 scripts/inject_ue.py 注入到各页的
 * /*UE_MODEL_START* / … /*UE_MODEL_END* / 标记区。改公式只改这里，改完重新注入。
 *
 * 演示说明：本文件里的全部参数取值均为虚构演示值，与任何真实业务无关。
 * ==========================================================================*/
(function (g) {
  'use strict';
  var ceil = Math.ceil, min = Math.min, max = Math.max, pow = Math.pow;

  /* —— 默认参数。★ 标的是业务输入，其余是规格常量。全部为虚构演示值 —— */
  var DEFAULTS = {
    // A 单量与运营（★业务输入）
    takeoffPts: 1,            // 起飞点数量
    landingPts: 4,            // 降落点数量（有逐点租金表时 = 表行数派生）
    routeDist: 2500,          // 平均航线距离 m（单程）
    dailyOrders: 200,         // ★日均单量 = 全部成本的驱动
    peakShare: 0.12,          // 峰值小时单量占比
    lastMileLandingPts: 2,    // 送货上门降落点数（末端配送人数下限）
    lastMileShare: 0.30,      // 送货上门订单占比
    // B 收入参数（★业务输入）
    aov: 52,                  // 实付客单价
    commissionRate: 0.18,     // 商家佣金率
    platformFee: 2,           // 平台费 /单
    deliveryFee: 11,           // C端配送费 /单
    marketing: 8000,          // 广告收入 /月（计入收入与利润）
    subsidyPerOrder: 0,       // 营销补贴 /单（我方承担，调用方按视图传档）
    // C 场地成本（★唯一真正可谈的成本）
    takeoffRent: 9000,
    landingRent: 12000,
    takeoffFitoutPerPt: 3500, // 起飞点每点装修月摊
    landingFitoutPerPt: 900,  // 降落点每点装修月摊
    // 人效与调休（规格）
    annualLeaveDays: 30, weeklyOffDays: 52,   // restFactor = 365/(365-30-52)
    pilotProd: 280, maintProd: 460, groundProd: 110,
    pickupProd: null,         // 取餐人效：null = 按取餐方式取值；显式数值优先
    pickupType: 'Ride',
    pickupProdByType: { Ride: 30, Walk: 50, Other: 40 },
    lastMileProd: 32, patrolProd: 180,
    patrolMinOrders: 180,     // 日均低于此值不配末端巡游
    groundCapPerTakeoff: 4,
    // 人力月薪
    salPilot: 9200, salMaint: 8600, salPickup: 3400, salGround: 4500,
    salLastMile: 3400, salPatrol: 3400,
    // 设备配比（规格）
    droneSpeed: 10,           // m/s 巡航
    takeoffLandingMin: 4,     // 起降阶段合计分钟
    droneIdle: 0.3,           // 闲置率（充电与维护）
    maxDrones: 24,            // 单起飞点机队上限
    markerPerTakeoff: 6,
    cabinetPerOrders: 150,    // 恒温柜：每 150 日单 1 个
    cabinetMaxPerTakeoff: 4,
    chargingPerCabinet: 2,
    storagePerDrones: 2,
    // 设备月折旧单价
    depDrone: 640, depMarker: 45, depPort: 2900, depCabinet: 300,
    depCharging: 120, depStorage: 85, depSpare: 115, depBoxReturn: 44,
    // 电池（规格）
    batteryPrice: 1700, batteryCycleLife: 600, batteryPackEnergy: 390,
    elecCost: 0.41, coulombic: 0.93,
    baseConsume: 0.35, marginalConsume: 0.08, baselineDist: 1700, batterySafety: 0.75,
    // 其他成本（规格）
    equipOM: 1000, opsSupplies: 900,
    simDrone: 580, simPort: 580, simHandheld: 480,
    vehiclePerTakeoff: 600, boxPerOrder: 0.3,
    droneInsurance: 130, rtkPerTakeoff: 200,
    venueElecPerUnit: 300, broadband: 1000, networkOM: 1000,
    daysPerMonth: 30,         // 月度视图 30；五年视图 project 内用 365/12

    /* 地面协同人力：取餐 + 末端配送 + 末端巡游。
       总开关 groundStaff 管取餐员（没有它餐到不了起飞点，不是划不划算的选项），
       末端两项另受 ROI 闸 lastMileSwitch 管，逐单量判。 */
    groundStaff: true,
    roiMultiple: 2,           // 末端 ROI 阈值倍数（假定值，待校准）
    lastMileSwitch: 'auto',   // auto 按 ROI 逐单量判 / on 恒计入 / off 恒不计
    equipDepOn: true,

    /* 逐点末端闸。不传 landingPools 时整段不启用，退回商圈级单闸。
         landingPools: [{ share, bands:[≤1km 占比, 1–2km 占比] }, …]
       归属口径 = 最近点：一单只归离它最近且在圈内的那个降落点，不重复计。 */
    landingPools: null,

    /* 关闸的标价：某个降落点关掉末端配送后只能柜取，该点上门订单按距离的留存率。
       这不是绝对自提意愿，是改变履约形态时的相对调整 —— 因为配送方式选择率的口径
       是「在大网配送与无人机配送之间选无人机的概率」，本身混合了柜取与上门两种形态。
       只取两档：≤1km 视为不丢单，1–2km 取 0.5，超出本就在降落圈外。 */
    lmKeepBands: [{ maxKm: 1.0, keep: 1.00 }, { maxKm: 2.0, keep: 0.50 }]
  };

  /* 营销补贴分档（假定值）。取值随站龄走，调用方按视图取档，不要在引擎里写死一个数。 */
  var SUBSIDY_TIERS = { steady: 2.5, firstYear: 7.5, firstHalf: 10 };

  /* 商圈上下文覆盖：起飞点就在商场里，取餐是楼内步行，人效远高于跑单口径。 */
  var DISTRICT_OVERRIDES = { pickupProd: 80, peakShare: 0.12 };

  function compute(o) {
    var p = Object.assign({}, DEFAULTS, o || {});
    var rest = 365 / (365 - p.annualLeaveDays - p.weeklyOffDays);
    var monthlyOrders = p.dailyOrders * p.daysPerMonth;
    var peakHourVol = p.dailyOrders * p.peakShare;
    var lastMileDaily = p.dailyOrders * p.lastMileShare;

    /* 单均收入前移：末端 ROI 闸在人力段就要用它。 */
    var merchantCommission = p.aov * p.commissionRate + p.platformFee;
    var revPerOrder = merchantCommission + p.deliveryFee;
    /* 净单均 = 毛单均 − 我方承担的补贴。末端 ROI 闸的分子只许用它：
       闸问的是多派这一班末端人力撬动的订单值不值这份人力，而订单拖进来的补贴是
       逐单流出，不管报表上它坐在收入减项还是成本行。分子分母必须同口径。 */
    var revPerOrderNet = revPerOrder - p.subsidyPerOrder;
    var pickupProd = (p.pickupProd != null) ? p.pickupProd
      : (p.pickupProdByType[p.pickupType] != null ? p.pickupProdByType[p.pickupType] : p.pickupProdByType.Other);

    /* —— 逐点末端闸 ——
       ① 每个降落点各判各的 ROI，分子分母都只算该点的上门订单与末端人力；
       ② 关闸的点只能柜取，该点上门订单按 lmKeepBands 留存率打折，收入与成本一起减。
       必须同时减收入：只删成本不删收入的话，关一个点永远是净赚，保本线只会降，
       那不是经济性变好，是模型少算一笔账。
       ROI 用该点未打折的需求算 —— 问的是在这里开末端值不值，开着就不丢单。 */
    var lmPts = null, demandDaily = p.dailyOrders;
    if (Array.isArray(p.landingPools) && p.landingPools.length) {
      var shTot = 0, i;
      for (i = 0; i < p.landingPools.length; i++) shTot += (+p.landingPools[i].share || 0);
      var even = !(shTot > 0);
      lmPts = p.landingPools.map(function (q, idx) {
        var sh = even ? 1 / p.landingPools.length : (+q.share || 0) / shTot;
        var dI = demandDaily * sh;
        var lmDI = dI * p.lastMileShare;
        // 逐点人数下限 = 1。商圈级的 lastMileLandingPts 在这一档不参与，
        // 否则低单量下每个点都 2 人起，ROI 被除散，逐点化会退化成全关。
        var staff = max(1, ceil(lmDI / p.lastMileProd)) * rest;
        var costI = staff * p.salLastMile;
        var leverI = dI * p.daysPerMonth * p.lastMileShare * revPerOrderNet;
        var roiI = costI > 0 ? leverI / costI : Infinity;
        var onI = !!p.groundStaff && (p.lastMileSwitch === 'on' ? true
          : p.lastMileSwitch === 'off' ? false : roiI >= p.roiMultiple);
        var bd = q.bands || [1], bsum = 0, keep = 0, k;
        for (k = 0; k < p.lmKeepBands.length; k++) bsum += (+bd[k] || 0);
        if (bsum <= 0) keep = p.lmKeepBands[0].keep;
        else for (k = 0; k < p.lmKeepBands.length; k++)
          keep += ((+bd[k] || 0) / bsum) * p.lmKeepBands[k].keep;
        return { i: idx, share: sh, daily: dI, lmDaily: lmDI, staff: staff, cost: costI,
                 leverRev: leverI, roi: roiI, on: onI, keep: keep,
                 lostDaily: onI ? 0 : lmDI * (1 - keep) };
      });
      var lost = 0;
      for (i = 0; i < lmPts.length; i++) lost += lmPts[i].lostDaily;
      p.dailyOrders = demandDaily - lost;
      monthlyOrders = p.dailyOrders * p.daysPerMonth;
      peakHourVol = p.dailyOrders * p.peakShare;
      lastMileDaily = p.dailyOrders * p.lastMileShare;
    }

    // —— 机队规模 ——
    var cycleMin = p.routeDist * 2 / p.droneSpeed / 60 + p.takeoffLandingMin;
    var tripsPerHr = 60 / cycleMin;
    var peakDrones = peakHourVol > 0 ? ceil(peakHourVol / tripsPerHr) : 0;
    var fleetLimit = p.maxDrones * p.takeoffPts;   // 上限随起飞点数放大
    var drones = min(ceil(peakDrones * (1 + p.droneIdle)), fleetLimit);

    // —— 人力（阶梯用工 × 调休系数）——
    var nPilot = ceil(p.dailyOrders / p.pilotProd) * rest;
    var nMaint = ceil(p.dailyOrders / p.maintProd) * rest;
    var nPickup = ceil(p.dailyOrders / pickupProd) * rest;
    var nGround = min(ceil(p.dailyOrders / p.groundProd), p.groundCapPerTakeoff * p.takeoffPts) * rest;
    var lmOpenN = 0, lmOpenDaily = 0, z;
    if (lmPts) for (z = 0; z < lmPts.length; z++) if (lmPts[z].on) {
      lmOpenN++; lmOpenDaily += lmPts[z].lmDaily;
    }
    var nLastMile = lmPts
      ? (lmOpenN ? max(lmOpenN, ceil(lmOpenDaily / p.lastMileProd)) * rest : 0)
      : max(p.lastMileLandingPts, ceil(lastMileDaily / p.lastMileProd)) * rest;
    var nPatrol = p.dailyOrders < p.patrolMinOrders ? 0 : ceil(p.dailyOrders / p.patrolProd) * rest;

    var cPilot = nPilot * p.salPilot, cMaint = nMaint * p.salMaint, cGround = nGround * p.salGround;
    /* 三项地面人力的原值始终算出（供 ROI 判决），计入 labor 分两层门控：
         取餐员   只随总开关 groundStaff
         末端两项 受 ROI 闸，分母只算这两项，与分子（上门订单收入）同口径，逐单量判
       分母若混进取餐员，ROI 会恒在 1 以下、闸恒关，取餐员被一起剔除，
       等于模型认为餐是自己飞到起飞点的。 */
    var cPickupRaw = nPickup * p.salPickup,
        cLastMileRaw = nLastMile * p.salLastMile,
        cPatrolRaw = nPatrol * p.salPatrol;
    var gsOn = p.groundStaff ? 1 : 0;
    var cPickup = cPickupRaw * gsOn;

    /* 逐点档下 nLastMile 只含开闸点的人力，全关时是 0，直接拿它当分母商圈级 ROI 会变 Infinity。
       所以逐点档的商圈级 ROI 改成把每个点都当作开着的合计，语义仍是
       「在这个商圈铺末端配送划不划算」，且恒有定义。逐点的真实判决在 lmPts[].on 上。 */
    var lmCost, lmLeverRev;
    if (lmPts) {
      var cAll = 0, rAll = 0;
      for (z = 0; z < lmPts.length; z++) { cAll += lmPts[z].cost; rAll += lmPts[z].leverRev; }
      lmCost = cAll + cPatrolRaw;
      lmLeverRev = rAll;
    } else {
      lmCost = cLastMileRaw + cPatrolRaw;
      lmLeverRev = monthlyOrders * p.lastMileShare * revPerOrderNet;
    }
    var lmRoi = lmCost > 0 ? lmLeverRev / lmCost : Infinity;
    var lmAdvise = lmRoi >= p.roiMultiple;
    var lmOn = lmPts ? (gsOn && lmOpenN > 0 ? 1 : 0)
      : gsOn && (p.lastMileSwitch === 'on' ? 1
        : p.lastMileSwitch === 'off' ? 0 : (lmAdvise ? 1 : 0));
    var cLastMile = cLastMileRaw * lmOn, cPatrol = cPatrolRaw * lmOn;
    var staffCostAll = cPickupRaw + cLastMileRaw + cPatrolRaw;
    var labor = cPilot + cMaint + cPickup + cGround + cLastMile + cPatrol;

    // —— 设备折旧 ——
    var nMarker = p.takeoffPts * p.markerPerTakeoff;
    var nPort = p.landingPts;
    var nCabinet = min(ceil(p.dailyOrders / p.cabinetPerOrders), p.cabinetMaxPerTakeoff * p.takeoffPts);
    var nCharging = nCabinet * p.chargingPerCabinet;
    var nStorage = ceil(drones / p.storagePerDrones);
    var nSpare = p.takeoffPts;
    var nBoxReturn = p.landingPts;
    var equipDepRaw = drones * p.depDrone + nMarker * p.depMarker + nPort * p.depPort

function thMode(){try{return localStorage.getItem(THKEY)==='dark'?'dark':'light';}catch(e){return 'light';}}
function renderThemeBtn(){const m=thMode(),ic=document.getElementById('thIco'),bt=document.getElementById('thTog');
  if(!ic||!bt)return; ic.innerHTML=TH_ICON[m];
  bt.setAttribute('aria-label',tx('主题')+' · '+tx(m==='light'?'浅色':'深色'));
  bt.title=tx(m==='light'?'切换到深色':'切换到浅色');}
function applyTheme(){const m=thMode();
  if(m==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  renderThemeBtn();
  applyMapTheme();}
function cycleTheme(){const nx=thMode()==='light'?'dark':'light';
  try{nx==='dark'?localStorage.setItem(THKEY,'dark'):localStorage.removeItem(THKEY);}catch(e){}
  applyTheme();}

/* 钱一律以「万」呈现，不写货币符号也不写币种代码；英文档换算成 k */
const money=v=>(LANG==='en'?(v||0)/1000:(v||0)/10000).toFixed(1);
const sgnm=v=>((v||0)>=0?'+':'')+money(v);
const uY=()=>LANG==='en'?'k/y':'万/年';
const uM=()=>LANG==='en'?'k/mo':'万/月';
/* 数字与单位之间的极窄间隙。不用空格字符 */
const G='<span class="g"></span>';
const kmD=(aLat,aLng,bLat,bLng)=>{
  const dx=(aLng-bLng)*111.32*Math.cos((aLat+bLat)/2*Math.PI/180),dy=(aLat-bLat)*110.57;
  return Math.hypot(dx,dy);};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ===== 数据 ===== */
let R=null,MD=null,OD=null;
const CITY=id=>R.cities.find(c=>c.id===id)||{nm:id};
const SITE=id=>R.sites.find(s=>s.id===id);
const BAKED=id=>(R.ladder.find(l=>l.id===id)||{});

/* ===== 推演器 =====
   页面自己跑一遍六十个月的轨迹，不把结果写死在数据里：默认参数下与 rollout.json 的
   months 逐位相同（跑 verifyBaked() 自检），拨任何一个参数即整条链重算。
   ⚠ 这条「默认参数下两边同值」的前提是实测过的，不是假设。对不上就退回烘焙值并在屏上说清楚。 */
const PARAMS_LIVE=[
 {k:'selEnd',t:'配送方式选择率',min:.05,max:.50,step:.01,fmt:v=>pc1(v),st:'假定值',
  why:'全域无实测，全链最缺锚的一项'},
 {k:'covK',t:'商家商品覆盖',min:.5,max:1.5,step:.05,fmt:v=>'×'+v.toFixed(2),st:'假定值',
  why:'逐点位各有自己的天花板，这里整组缩放',scale:true},
 {k:'covMo',t:'覆盖爬坡周期',min:6,max:48,step:3,fmt:v=>Math.round(v)+G+tx('个月'),st:'假定值',
  why:'从开航爬到稳态要多久'},
 {k:'selMo',t:'选择率爬坡周期',min:6,max:48,step:3,fmt:v=>Math.round(v)+G+tx('个月'),st:'假定值',
  why:'从开航爬到稳态要多久'},
 {k:'sub1',t:'营销补贴稳态',min:0,max:12,step:.5,fmt:v=>v.toFixed(1)+G+tx('/单'),st:'假定值',
  why:'爬坡结束后每单还补多少'},
 {k:'sub0',t:'营销补贴起点',min:0,max:20,step:.5,fmt:v=>v.toFixed(1)+G+tx('/单'),st:'假定值',
  why:'开航头几个月的单均补贴'},
 {k:'subFlat',t:'补贴高档持续',min:0,max:12,step:1,fmt:v=>Math.round(v)+G+tx('个月'),st:'假定值',
  why:'起点值维持几个月才开始收敛'},
 {k:'rentK',t:'场地租金',min:.4,max:1.8,step:.05,fmt:v=>'×'+v.toFixed(2),st:'假定值',
  why:'逐城租金系数，整组缩放',scale:true},
 {k:'landRent',t:'降落点租金',min:0,max:9000,step:500,fmt:v=>fmt(v)+G+tx('/月/点'),st:'假定值',
  why:'一份付费合同都没有，全是假定'},
 {k:'capK',t:'年开点上限',min:.25,max:3,step:.25,fmt:v=>'×'+v.toFixed(2),st:'假定值',
  why:'设备到货与部署人力能支撑的开航数',scale:true},
 {k:'obsMo',t:'观察池阈值',min:24,max:60,step:3,fmt:v=>Math.round(v)+G+tx('个月'),st:'假定值',
  why:'转正月数超过它的点位当年不排期'},
 {k:'covCapK',t:'覆盖率天花板',min:.5,max:2,step:.1,fmt:v=>'×'+v.toFixed(1),st:'假定值',
  why:'外推段唯一的新拍值：这座城最终能吃多少',scale:true},
 {k:'pack',t:'媒体包价',min:0,max:60000,step:1000,fmt:v=>money(v)+G+uM(),st:'假定值',
  why:'每个开航点位每月一个包'},
 {k:'sell1',t:'商业化售出率终点',min:0,max:1,step:.05,fmt:v=>pc1(v),st:'假定值',
  why:'爬满之后卖得掉几个包'}];
/* 参数默认值只有一个来源 = 数据里的 params，页面不留第二份。
   ⚠ 整组缩放那几项（covK/rentK/capK/covCapK）推演器里没有对应项，默认 1 = 不缩放 */
function PDEF(k){
  const p=R.params;
  const d={selEnd:p.sels[1],covK:1,covMo:p.cov_months,selMo:p.sel_months,
    sub1:p.subsidy_steady,sub0:p.subsidy_launch,subFlat:p.subsidy_flat_months,
    rentK:1,landRent:3000,capK:1,obsMo:p.obs_months,covCapK:1,
    pack:p.monet_pack,sell1:p.monet_sell[1]};
  return d[k];}
let PSET={},PSEQ=0,SCACHE={},CURK=null,CURS=null,SENS=null,SENSPREV=null;
const pget=k=>PSET[k]!=null?PSET[k]:PDEF(k);
function paramsNow(){const o={};PARAMS_LIVE.forEach(d=>{o[d.k]=pget(d.k)});return o;}
/* ⚠ 拨一次滑杆，敏感度就得重跑两倍参数个数的推演。这期间不清空上一轮结果：
   清空会让整张参数表的排序在你手底下塌一次再长回来，比慢更难受。 */
function bump(){PSEQ++;SCACHE={};CURK=null;CURS=null;if(SENS)SENSPREV=SENS;SENS=null;}

/* 会话态：手动排除 / 强制开航 / 手动加进来的点位。刷新即丢，与「新增点位无持久化」同规矩 */
let DROP=[],FORCE={},MANUAL=[];
const forcedOf=id=>!!FORCE[id];
const exceptionsOn=()=>DROP.length||Object.keys(FORCE).length||MANUAL.length;

const ramp=(t,mo,end)=>{if(t<=0)return 0;const K=R.params.ramp_k,x=Math.min(1,t/mo);
  return end*(1-Math.exp(-K*x))/(1-Math.exp(-K));};
function siteCfg(s,P){
  const D=UEModel.DEFAULTS,big=(s.city==='c1'||s.city==='c2');
  return Object.assign({},D,{
    /* ⚠ 取餐人效必须显式给：引擎默认按取餐方式派生，与这条线的口径不是一个数 */
    pickupProd:80,
    landingPts:s.landings,routeDist:Math.trunc(s.avg_leg_km*1000),
    takeoffRent:Math.round(s.rent_takeoff*P.rentK),
    landingRent:Math.round(P.landRent*s.landings*P.rentK),
    marketing:0,
    salPilot:Math.trunc(D.salPilot*(big?1:.9)),
    salMaint:Math.trunc(D.salMaint*(big?1:.9))});}
function runSite(s,P){
  const cfg=siteCfg(s,P),out=[];let cum=0,pos=null,peak=0;
  const covEnd=Math.min(1,s.cov_ceiling*P.covK),step=R.params.subsidy_step;
  for(let t=1;t<=60;t++){
    const cov=ramp(t,P.covMo,covEnd),sel=ramp(t,P.selMo,P.selEnd);
    const daily=s.pool_monthly*cov*sel/30;
    /* 补贴按站龄递减：开航头几个月高，之后线性收敛到稳态 */
    const sub=t<=P.subFlat?P.sub0:Math.max(P.sub1,P.sub0-(t-P.subFlat)*step);
    const m=UEModel.compute(Object.assign({},cfg,{dailyOrders:Math.max(.1,daily),
      subsidyPerOrder:Math.round(sub*100)/100}));
    cum+=m.profit;if(cum<0)peak=Math.max(peak,-cum);
    if(pos===null&&m.profit>=0)pos=t;
    /* ⚠ 字段名照引擎的：总成本叫 deliveryCost（= 七项相加），不叫 cost；
       设备折旧 equipDep、场地办公 venueOffice、网络运维 networkOM。
       写错一个不会报错，只会让那一列静静地变成 NaN，再被 Math.round 印成空格。 */
    out.push({t:t,daily:daily,profit:m.profit,rev:m.revenue,cost:m.deliveryCost,orders:m.monthlyOrders,
      cs:{labor:m.labor,equip:m.equipDep,battery:m.battery,venue:m.venueOffice,other:m.other,
          netom:m.networkOM,sub:m.subsidy}});}
  return {months:out,pos:pos,peak:peak};}
const tierOfPos=(pos,obs)=>!pos?'OBS':(pos<=18?'T1':pos<=30?'T2':pos<=44?'T3':(pos<=obs?'30+':'OBS'));
const CSK=['labor','equip','battery','venue','other','netom','sub'];
const CS0=()=>({labor:0,equip:0,battery:0,venue:0,other:0,netom:0,sub:0});
const ZEROY=()=>({new:[],cum:0,live:0,daily:0,orders:0,rev:0,cost:0,mkt:0,cs:CS0()});
const netOf=d=>d?((d.rev||0)+(d.mkt||0)-(d.cost||0)):0;
const YSPAN=()=>{const b=R.params.base_year;return [0,1,2,3,4].map(i=>String(b+i));};
const QSPAN=()=>{const b=R.params.base_year,a=[];
  for(let y=0;y<5;y++)for(let q=1;q<=4;q++)a.push((b+y)+'Q'+q);return a;};
/* 商业化随开航点位数走：每个已开点位每月一个媒体包，售出率随站龄线性爬坡 */
const sellAt=(t,P)=>{const s0=R.params.monet_sell[0];
  return P.pack*(s0+(P.sell1-s0)*Math.min(1,t/P.covMo));};

function project(P){
  const by=R.params.base_year,ys=YSPAN(),qs=QSPAN();
  const all=R.sites.concat(MANUAL);
  const runs={};all.forEach(s=>{runs[s.id]=runSite(s,P)});
  /* 排队 = 白名单先落位，其余按转正月份；两道闸：年开点上限、观察池阈值 */
  const order=all.slice().sort((a,b)=>
    (a.planned?0:1)-(b.planned?0:1)||((runs[a.id].pos||999)-(runs[b.id].pos||999))||(a.id<b.id?-1:1));
  const cap=R.params.cap_per_year.map(v=>Math.max(1,Math.round(v*P.capK)));
  const slot=[0,0,0,0,0],pts={},sched=[];
  order.forEach(s=>{
    const r=runs[s.id],tier=tierOfPos(r.pos,P.obsMo);
    pts[s.id]={tier:tier,pos:r.pos,peak:r.peak,openQ:null,openY:null,
      planned:!!s.planned,forced:forcedOf(s.id),manual:!!s.manual};
    if(DROP.indexOf(s.id)>=0)return;
    const ok=s.planned||forcedOf(s.id)||(r.pos&&r.pos<=P.obsMo);
    if(!ok)return;
    for(let y=0;y<5;y++){
      if(slot[y]>=cap[y])continue;
      slot[y]++;
      /* 开航季：默认参数下沿用数据里那一档，好与 rollout.json 对得上；
         点位被参数挪走了年份就按名次顺铺 Q1 至 Q4 */
      const bk=BAKED(s.id);
      const q=(bk.open_year===by+y&&bk.open_q)?+bk.open_q.slice(-1):1+((slot[y]-1)%4);
      pts[s.id].openY=by+y;pts[s.id].openQ=(by+y)+'Q'+q;
      sched.push({s:s,q:q,y:by+y});
      break;}});
  /* 逐月桶：UAE 档与每座城走同一个函数，分城查看才不会是另一套代码、另一套口径 */
  const mk=()=>({y:{},q:{},mon:[]});
  const V={ALL:mk()};R.cities.forEach(c=>{V[c.id]=mk()});
  Object.keys(V).forEach(k=>{ys.forEach(y=>V[k].y[y]=ZEROY());qs.forEach(q=>V[k].q[q]=ZEROY());
    for(let i=0;i<60;i++)V[k].mon.push({orders:0,rev:0,cost:0,mkt:0,cs:CS0(),pool:0,daily:0});});
  const addTo=(b,m,mk2)=>{b.rev+=m.rev;b.cost+=m.cost;b.mkt+=mk2;b.orders+=m.orders;b.live=1;
    CSK.forEach(k=>b.cs[k]+=m.cs[k]);};
  sched.forEach(x=>{
    const launch=(x.y-by)*12+(x.q-1)*3+1,ms=runs[x.s.id].months,ck=x.s.city;
    const qq={};
    for(let t=1;t<=60;t++){
      const cm=launch+t-1;if(cm<1||cm>60)continue;
      const m=ms[t-1],mk2=sellAt(t,P);
      const y=String(by+Math.floor((cm-1)/12)),q=y+'Q'+(1+Math.floor(((cm-1)%12)/3));
      [V.ALL,V[ck]].forEach(vv=>{
        addTo(vv.y[y],m,mk2);addTo(vv.q[q],m,mk2);
        const mo=vv.mon[cm-1];mo.orders+=m.orders;mo.rev+=m.rev;mo.cost+=m.cost;mo.mkt+=mk2;
        mo.pool+=x.s.pool_monthly;mo.daily+=m.daily;CSK.forEach(k=>mo.cs[k]+=m.cs[k]);
        /* 年末与季末的日均：年度轴上的「日均单量」讲的是那一年跑到年底的水平 */
        if((cm-1)%12===11)vv.y[y].daily+=m.daily;
        if((cm-1)%3===2)vv.q[q].daily+=m.daily;});
      qq[q]={d:Math.round(m.daily),net:m.rev+mk2-m.cost,rev:m.rev,cost:m.cost};}
    pts[x.s.id].q=qq;
    V.ALL.y[String(x.y)].new.push(x.s.id);V[ck].y[String(x.y)].new.push(x.s.id);
    V.ALL.q[pts[x.s.id].openQ].new.push(x.s.id);V[ck].q[pts[x.s.id].openQ].new.push(x.s.id);});
  Object.keys(V).forEach(k=>{let run=0;ys.forEach(y=>{run+=V[k].y[y].new.length;V[k].y[y].cum=run;});
    let rq=0;qs.forEach(q=>{rq+=V[k].q[q].new.length;V[k].q[q].cum=rq;});});
  /* 转正年 = 首个「有已开点位且当年净利 ≥ 0」的年。
     ⚠ 一个点位都没开的年份净利为零，那不是不亏，是还没开始，别读成那一年转正 */
  const landOf=v=>{const ys2=YSPAN();for(const y of ys2){if(v.y[y].live&&netOf(v.y[y])>=0)return +y;}return null;};
  const land={};Object.keys(V).forEach(k=>land[k]=landOf(V[k]));
  const counts={T1:0,T2:0,T3:0,'30+':0,OBS:0};
  Object.keys(pts).forEach(id=>{counts[pts[id].tier]=(counts[pts[id].tier]||0)+1});
  const S={pts:pts,V:V,land:land,counts:counts,cap:cap,sched:sched,runs:runs,P:P,
    cutY:sched.length?Math.max.apply(null,sched.map(x=>x.y)):by};
  S.hi=segTwo(S,P);
  return S;}
/* ===== 两段式 =====
   下沿 = 切点之后不再新开点位、已开的把爬坡跑完，一个新拍值都不引入，就是主表那一条。
   上沿 = 下沿 + 继续扩点：每座城给一个覆盖率天花板，余量从切点线性铺到推演期末。
   ⚠ 上沿的三个系数只由切点那一个月的实算拟合，换一个拟合月就能反号，
     所以上沿只能读作方向，不能读作量级。上沿也不一定比下沿好 ——
     单位覆盖的月固定投入高过打平线的城市，继续扩点就是净亏损。 */
function segTwo(S,P){
  const by=R.params.base_year,ys=YSPAN(),cutY=S.cutY;
  if(cutY>=by+4)return null;
  const cutEnd=(cutY-by+1)*12;                    /* 切点年最后一个月的序号 */
  const water=R.params.cov_steady*P.covK*P.selEnd;
  const out={};
  Object.keys(S.V).forEach(k=>{
    const v=S.V[k],m=v.mon[cutEnd-1];
    const pool=k==='ALL'?R.cities.reduce((a,c)=>a+c.pool_monthly,0):CITY(k).pool_monthly;
    const ceil=k==='ALL'
      ? R.cities.reduce((a,c)=>a+c.pool_monthly*c.cov_ceiling,0)/pool
      : CITY(k).cov_ceiling;
    if(!m||!m.orders||!pool)return;
    const cov=m.pool/pool,head=Math.max(0,Math.min(1,ceil*P.covCapK)-cov);
    const revPer=m.rev/m.orders;
    const varPer=(m.cs.battery+m.cs.sub)/m.orders;
    const phi=(m.cs.labor+m.cs.equip+m.cs.venue+m.cs.other+m.cs.netom)/Math.max(1e-9,cov);
    const Y={},Q={};ys.forEach(y=>Y[y]=Object.assign(ZEROY(),{live:v.y[y].live}));
    QSPAN().forEach(q=>Q[q]=Object.assign(ZEROY(),{live:v.q[q].live}));
    ys.forEach(y=>{['rev','cost','mkt','daily','orders','cum','live'].forEach(f=>Y[y][f]=v.y[y][f]);
      Y[y].new=v.y[y].new;});
    QSPAN().forEach(q=>{['rev','cost','mkt','daily','orders','cum','live'].forEach(f=>Q[q][f]=v.q[q][f]);});
    for(let cm=cutEnd+1;cm<=60;cm++){
      const f=(cm-cutEnd)/(60-cutEnd),addCov=head*f;
      const addOrd=pool*addCov*water,addRev=addOrd*revPer,addCost=addOrd*varPer+addCov*phi;
      const y=String(by+Math.floor((cm-1)/12)),q=y+'Q'+(1+Math.floor(((cm-1)%12)/3));
      Y[y].rev+=addRev;Y[y].cost+=addCost;Q[q].rev+=addRev;Q[q].cost+=addCost;
      if((cm-1)%12===11)Y[y].daily+=addOrd/30.4;
      if((cm-1)%3===2)Q[q].daily+=addOrd/30.4;}
    let land=null;for(const y of ys){if(Y[y].live&&netOf(Y[y])>=0){land=+y;break;}}
    out[k]={y:Y,q:Q,land:land,fit:{cov:cov,head:head,phi:phi,varPer:varPer,revPer:revPer,ceil:Math.min(1,ceil*P.covCapK)}};});
  return {cutY:cutY,view:out};}
/* scen() 每次渲染要被调上百次，所以缓存按 O(1) 的版本号命中，不做序列化 */
function scen(){const k='v'+PSEQ;
  if(k===CURK&&CURS)return CURS;
  const s=SCACHE[k]||(SCACHE[k]=project(paramsNow()));
  CURK=k;CURS=s;return s;}
/* 自检：默认参数下页面自己跑的轨迹必须与数据里的 months 逐位相同。
   对不上就说明两边口径漂了，屏上要如实说，别静默给一份来路不明的数。 */
let BAKED_OK=true;
function verifyBaked(){
  try{
    const P=paramsNow(),s=R.sites[0],r=runSite(s,P),b=R.months[s.id];
    for(let t=0;t<60;t++)if(Math.abs(Math.round(r.months[t].profit)-b[t].profit)>1){BAKED_OK=false;return;}
  }catch(e){BAKED_OK=false;}}

/* ===== 视图态 ===== */
/* 解析期就要登记、但内容依赖数据的那几块（分城明细、逐参数明细）挂在这里，
   数据回来之后一次性跑。⚠ 声明必须在任何 push 之前，const 有暂时性死区。 */
const R_ready_hooks=[];
let VIEW='ALL',PY=null,PQ=false,DPICK=null;
const PLAN_Y=()=>String(R.params.base_year);
const vw=()=>scen().V[VIEW];
const vwHi=()=>{const h=scen().hi;return h&&h.view[VIEW]?h.view[VIEW]:null;};
const YB=()=>vw().y;
const years=()=>YSPAN();
const landNow=()=>scen().land[VIEW];
const seg2Y=y=>{const h=scen().hi;return !!h&&+y>h.cutY;};
/* 开航是按年排的，所以不存在「半年可核半年外推」的混合年；这一条留着是为了
   将来切到按季排期时有地方落，现在恒假。 */
const segMixY=()=>false;
/* 城市名走数据自带的中英两份，不进 EN 字典 —— 字典的键是中文原串，
   而这几个名字是数据，改数据不该回来改字典。 */
const cName=c=>(LANG==='en'&&c&&c.nm_en)?c.nm_en:(c?c.nm:'');
const vName=k=>k==='ALL'?tx('全域'):cName(CITY(k));

/* ============================================================
   排期页
   主体是一张逐年规划表：年份作列，链条作行（新开 → 累计 → 日均 → 收 → 支 → 净）。
   一张表把「开多少 / 做多大 / 赚不赚」放进同一个坐标系，列与列可比、行与行是因果。
   漏斗与成本明细退成表里每一行点开的详情，不再各占一段。
   ⚠ 别再往「给页面加第五段」的方向长。要加东西先想它能不能挂进表的某一行或某一列。
   ============================================================ */
const PLANROWS=[
 ['row_new','新开点位','',d=>String((d.new||[]).length),'个'],
 ['row_cum','累计点位','上期累计 + 本期新开',d=>String(d.cum),'个'],
 /* 上面两行讲开了几个点位，下面几行讲这些点位赚不赚钱，是两件事。
    分组只留空隙加一条眉标，不画第二条横线 —— 这张表本来就每行一条细线的时候读起来像表断了。 */
 ['row_daily','日均单量','圈内订单池 × 覆盖 × 选择率',d=>fmt(d.daily),'单/日','gap'],
 ['row_rev','收入','配送收入 + 商业化收入',d=>money(d.rev+d.mkt),'万/年'],
 ['row_cost','支出','六个成本科目 + 营销补贴',d=>money(d.cost),'万/年'],
 /* 「其中」这个词是防重复相加的：补贴已经在上面那行支出里，主表再列一遍是让读表的人
    多做一次「这个要不要加」的判断，所以写全「其中 营销补贴」并在副标里说明。 */
 ['row_sub','其中 营销补贴','已计入上面的支出，不另加',d=>money(d.cs.sub),'万/年'],
 ['row_op','净利','收入 − 支出',d=>sgnm(netOf(d)),'万/年']];

/* 判决区三个数各自可点，落到讲得清它的那一块。
   ⚠ 三个 data-go 必须互不相同：pick() 同 id 再点是收起，两个数共用一个 id 时
     点第二个等于把第一个关掉，看起来像控件坏了。 */
/* ⚠ 单位跟着这个数的口径走：逐年那两个是「万/年」，累计亏损是一个存量，只能写「万」 */
const vnum=(go,k,v,cls,sub,unit)=>`<div class="vn click" data-go="${go}" role="button" tabindex="0" aria-controls="detail">
    <div class="k">${k}</div><div class="v ${cls||''}">${v}<small>${G}${tx(unit||'万/年')}</small></div>${
      sub?`<div class="vhi">${sub}</div>`:''}</div>`;
/* 分城市查看的切换器：放在判决区抬头那一行，因为切的正是这句判决讲的是谁。
   ⚠ 只列有点位排上的城市，一个点位都没排上的城切过去是一屏零，不如不给入口。
   ⚠ 三个 KPI、年度计划、季度拆分、逐年表全部跟着切，不切一半。 */
function vwSel(){
  const s=scen();
  const opts=['ALL'].concat(R.cities.filter(c=>R.sites.concat(MANUAL)
    .some(p=>p.city===c.id&&(s.pts[p.id]||{}).openQ)).map(c=>c.id));
  return `<span class="vwsel">`+opts.map(o=>
    `<button class="vwb${o===VIEW?' on':''}" data-vw="${o}">${vName(o)}</button>`).join('')+`</span>`;}
function renderVerdict(){
  const s=scen(),ys=years(),ld=landNow(),H=vwHi();
  /* 转正前累计亏损 = 转正年之前各年净利相加，也就是累计 P&L 的谷底。
     ⚠ 不是「逐年取负数再加」：转正之后再出现的亏损年不该被折进「转正前」这个标签里。 */
  const preLoss=ys.filter(k=>!ld||+k<ld).reduce((a,k)=>a+netOf(YB()[k]),0);
  const py=YB()[PLAN_Y()]?PLAN_Y():ys[0];
  const ey=ys[ys.length-1];
  const vh=H&&H.y[ey]?netOf(H.y[ey]):null,ve=netOf(YB()[ey]);
  const ldHi=H?H.land:null;
  const dirty=!BAKED_OK?`<div class="vrad">${tx('页面实时推演与数据文件对不上，已按数据文件显示')}</div>`:'';
  document.getElementById('verdict').innerHTML=dirty+`
    <div>
      <div class="cap">${vwSel()}</div>
      <div class="vbig">${ld?`${ld}<small>${tx('年转正')}</small>`:`<small>${tx('推演期内不转正')}</small>`}</div>
      ${H?`<div class="vhi">${tx('继续扩点')}${PU('sp')}${ldHi?xLandY(ldHi):tx('推演期内不转正')}</div>`:''}
    </div>
    <button class="chaintab" data-cal="1" aria-haspopup="dialog">
      <span>${tx('模型拆解')}</span><i>${tx('五段 · 从大盘到开航序列')}</i></button>
    <div class="vnums">
      ${vnum('preloss',tx('转正前累计亏损'),money(preLoss),'','','万')}
      ${vnum('row_op',py+' '+tx('净利'),sgnm(netOf(YB()[py])),netOf(YB()[py])>=0?'w':'')}
      ${ey===py?'':vnum('years',ey+' '+tx('净利'),sgnm(ve),ve>=0?'w':'',
        vh!=null&&Math.abs(vh-ve)>1?tx('继续扩点')+PU('sp')+sgnm(vh):'')}
    </div>`;}

/* 逐年规划表：年份作列、链条作行。行可点（讲这一行怎么算），转正那一列高亮。 */
function planTable(){
  const s=scen(),ys=years(),ld=landNow(),H=vwHi();
  const head=ys.map(y=>`<th class="r yh ${+y===ld?'turn':''}">${y}${+y===ld?' '+tx('转正'):''}${
      seg2Y(y)?`<i class="segt">${tx(segMixY()?'含外推':'外推')}</i>`:''}</th>`).join('');
  const body=PLANROWS.map(r=>(r[5]==='gap'
      ?`<tr class="grph"><td colspan="${ys.length+2}">${tx('年度收益')}</td></tr>`:'')
    +(r[0]==='row_new'?`<tr class="grph"><td colspan="${ys.length+2}">${tx('点位计划')}</td></tr>`:'')
    +`<tr><td class="nm">${tx(r[1])}</td>`
    +ys.map(y=>`<td class="r ${r[0]==='row_op'&&netOf(YB()[y])>=0?'w':''} ${+y===ld?'turn':''}">${r[3](YB()[y])}</td>`).join('')
    +`<td class="r u">${tx(r[4])}</td></tr>`).join('');
  /* 第二段的另一头。主表整条走下沿（切点之后不再新开点位、已开的把爬坡跑完），零拍值；
     上沿单独两行挂在下面。
     ⚠ 不把带塞进每一格 —— 七行五列全变成「A 至 B」，读表的人会失焦；真正要看带的
       只有单量与净利这两行。
     ⚠ 第一段那几列写「—」不写数：那几年两条口径本来就是同一个数，写上去等于说它有带。 */
  const hiRows=!H?'':[['日均单量',d=>fmt(d.daily),'单/日'],['净利',d=>sgnm(netOf(d)),'万/年']]
    .map((r,i)=>`<tr class="hirow${i===0?' first':''}"><td class="nm">${
      tx('继续扩点')+PU('sp')+tx(r[0])}${i===0?`<i>${tx('主表是不再新开点位那一条')}</i>`:''}</td>`
      +ys.map(y=>`<td class="r">${seg2Y(y)&&H.y[y]?r[1](H.y[y]):'—'}</td>`).join('')
      +`<td class="r u">${tx(r[2])}</td></tr>`).join('');
  return `<table class="tbl plan"><tr><th>${tx('经营推演')}</th>${head}<th class="r"></th></tr>${body}${hiRows}</table>`;}

/* 那一年开了哪几个点位，按城市分组。
   ⚠ 分城视图下只列该城的点位：上面判决讲的是这座城，下面却列全域的点位，
     那是最容易被当成数据错的一种不一致。 */
function planSites(y){
  const s=scen(),list=R.sites.concat(MANUAL).map(p=>({p:p,o:s.pts[p.id]||{}}))
    .filter(x=>x.o.openQ&&x.o.openQ.slice(0,4)===String(y))
    .filter(x=>VIEW==='ALL'||x.p.city===VIEW);
  const byC={};list.forEach(x=>{(byC[x.p.city]=byC[x.p.city]||[]).push(x)});
  Object.keys(byC).forEach(c=>byC[c].sort((a,b)=>a.o.openQ<b.o.openQ?-1:1));
  return byC;}
/* 三类点位的徽标：计划 = 业务侧计划里给了开航月份的 · 推荐 = 模型按经济性排出来的。
   ⚠ 别把「推荐」也标成蓝色：蓝标一直是「这是业务定的」那一档的颜色，
     两类混同一个色，读者就分不出哪些是承诺、哪些是模型的建议。 */
const siteTag=(p,o)=>(o.planned?` <span class="pln">${tx('计划')}</span>`
    :o.manual?` <span class="pln unp">${tx('手动加入')}</span>`
    :` <span class="pln rec">${tx('推荐')}</span>`)
  +(o.forced?` <span class="pln unp">${tx('强制')}</span>`:'')
  +(p.winch>0?` <span class="pln sd" title="${tx('其中索降')} ${p.winch}">${tx('索降')}${p.winch}</span>`:'');
function renderPlan(){
  const s=scen(),ys=years();
  const y=YB()[PY]?PY:PLAN_Y();
  const cols=PQ?['Q1','Q2','Q3','Q4'].map(q=>y+q):[y];
  const bk=c=>PQ?(vw().q[c]||ZEROY()):YB()[c];
  const byC=planSites(y);
  const NC=cols.length;
  /* 列数要跟着模式走：全年模式表是 4 列（名字 + 值 colspan 2 + 单位），
     季度模式是 NC + 2 列。最后一格用 colspan 把余下的列吃掉，写死 colspan 会把表撑歪。 */
  const TOTC=NC===1?4:NC+2;
  const siteRows=Object.keys(byC).map(c=>{
    const cy=(scen().V[c]||{y:{}}).y[y]||ZEROY();
    return `<tr class="emrow"><td class="nm sub2" colspan="${TOTC}">${cName(CITY(c))}<i>${
      tx('全年净利')} ${sgnm(netOf(cy))}${G}${tx('万/年')}</i></td></tr>`
      +byC[c].map(x=>{
        const pos=x.o.pos!=null?x.o.pos+G+tx('个月转正'):tx('推演期内不转正');
        /* 季度模式下开航要落进它自己那一季的列，转正回到最末一列自己占一格。
           此前把开航固定在第二格、转正靠 colspan 铺到末尾，屏上读成
           「Q3 开航的点位标在 Q1 底下」，是错的对应。
           ⚠ 单元格数必须凑满 TOTC：名字 1 + 季度 NC + 转正 1。 */
        const cells=PQ
          ?cols.map(q=>`<td class="r">${x.o.openQ===q?x.o.openQ+' '+tx('开航'):''}</td>`).join('')
            +`<td class="r">${pos}</td>`
          :`<td class="r">${x.o.openQ} ${tx('开航')}</td><td class="r" colspan="${TOTC-2}">${pos}</td>`;
        return `<tr class="click strow" data-map="${x.p.id}" role="button" tabindex="0"
            title="${x.o.planned?tx('业务侧计划里的点位，不是模型选出来的'):tx('模型按经济性排出来的点位，不在业务侧的计划里')}">
          <td class="nm sub3">${x.p.nm}${siteTag(x.p,x.o)}</td>${cells}</tr>`;}).join('');}).join('');
  /* 年度轴开始之前就已经开航的点位挂在「累计点位」底下 —— 那一行的副标本来就写着
     「上期累计 + 本期新开」，正好把差的这几个补上。本数据里首年即轴起点，通常为空。 */
  const carried=y===ys[0]?R.sites.concat(MANUAL).map(p=>({p:p,o:scen().pts[p.id]||{}}))
    .filter(x=>x.o.openQ&&x.o.openQ.slice(0,4)<String(y))
    .filter(x=>VIEW==='ALL'||x.p.city===VIEW):[];
  const carrRows=!carried.length?'':`<tr class="emrow"><td class="nm sub2" colspan="${TOTC}">${
      tx('已开')}<i>${carried.length}${G}${tx('个点位')}</i></td></tr>`
    +carried.map(x=>`<tr class="click strow" data-map="${x.p.id}" role="button" tabindex="0">
      <td class="nm sub3">${x.p.nm}</td><td class="r" colspan="${TOTC-2}">${x.o.openQ} ${tx('开航')}</td>
      <td class="r">${x.o.pos!=null?x.o.pos+G+tx('个月转正'):tx('推演期内不转正')}</td></tr>`).join('');
  const head=PQ?`<tr><th>${tx('经营推演')}</th>${cols.map(c=>`<th class="r">${c.slice(4)}</th>`).join('')
      }<th class="r"></th></tr>`:'';
  const rowHTML=r=>{
    const row=`<tr class="click ${r[0]==='row_op'?'net':''}${r[0]==='row_cum'?' sep':''}" data-go="${r[0]}"
      role="button" tabindex="0" aria-controls="detail">
      <td class="nm">${tx(r[1])}${r[2]?`<i>${tx(r[2])}</i>`:''}</td>`
      +cols.map(c=>`<td class="r v"${NC===1?' colspan="2"':''}>${r[3](bk(c))}</td>`).join('')
      +`<td class="u">${tx(r[4])}</td></tr>`;
    // 点位清单挂在「新开点位」底下，它是那一行的明细；已开那批挂「累计点位」底下
    return r[0]==='row_new'?row+siteRows:r[0]==='row_cum'?row+carrRows:row;};
  const cut=PLANROWS.findIndex(r=>r[5]==='gap');
  const grph=t=>`<tr class="grph"><td colspan="${TOTC}">${tx(t)}</td></tr>`;
  const body=`<tbody>${head}${grph('点位计划')}${PLANROWS.slice(0,cut).map(rowHTML).join('')}</tbody>`
    +`<tbody>${grph('年度收益')}${PLANROWS.slice(cut).map(rowHTML).join('')}</tbody>`;
  /* 年份贴纸可点：点一下整块换成那一年，包括点位清单与季度展开。当前年高亮 */
  const strip=ys.map(k=>`<span class="cs yr${k===y?' on':''}" role="button" tabindex="0" data-py="${k}"
      >${k}<b class="${netOf(YB()[k])>=0?'w':''}">${sgnm(netOf(YB()[k]))}</b></span>`).join('');
  document.getElementById('plan').innerHTML=`
    <div class="pyh"><b>${y}</b>${seg2Y(y)?`<span class="segw">${tx('不排新点位')}</span>`:''}
      <button class="qtog${PQ?' on':''}" data-pq="1">${PQ?tx('看全年'):tx('季度拆分')}</button>
      <button class="qtog${DPICK==='robust'?' on':''}" data-go="robust" role="button" tabindex="0"
        aria-controls="detail">${tx('转正年靠不靠谱')}</button></div>
    <table class="tbl plan">${body}</table>
    <div class="pyl">${strip}</div>`;}

/* ===== 详情面板 =====
   逻辑链渲染：一步一行 = 序号 · 量名 · 算式（可带一行出处小字）· 三态。
   三态只有「假定值」上暖色，因为它是唯一留给上级调参的那一类。
   第 6 个字段 = 参数 key：给了就在这一行底下直接长出滑杆，调参和讲这个数的地方是同一处。 */
const NUM=['①','②','③','④','⑤','⑥'];
function knob(k){
  const d=PARAMS_LIVE.find(x=>x.k===k);if(!d)return '';
  const v=pget(k),S=SENS||SENSPREV,sv=S&&S.ok?S.rows.find(r=>r.k===k):null;
  const on=PSET[k]!=null;
  return `<span class="pk${on?' on':''}">
    <em class="pn">${tx(d.t)}</em>
    <input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${v}" data-pk="${k}" aria-label="${tx(d.t)}">
    <b class="pv">${d.fmt(v)}</b>
    <i>${sv?'±'+Math.round(sv.amp*100)+'%'+(sv.moves?' · '+tx('会改变转正年'):''):''}</i></span>`;}
function chain(steps,sum){
  const row=(n,k,f,st,sub,pk)=>`<div class="cst${n==='='?' sum':''}">
    <b class="cn">${n}</b><div class="ck">${tx(k)}</div>
    <div class="cf">${f}${sub?`<u>${tx(sub)}</u>`:''}${
      pk?(Array.isArray(pk)?pk.map(knob).join(''):knob(pk)):''}</div>
    <div class="c3 ${st==='假定值'?'k':''}">${st?tx(st):''}</div></div>`;
  return `<div class="chain">`+steps.map((x,i)=>row(NUM[i],x[0],x[1],x[2],x[3],x[4])).join('')
    +(sum?row('=',sum[0],sum[1],''):'')+`</div>`;}
const note=t=>`<div class="cnote">${t}</div>`;
const sec=(t,hint)=>`<div class="dsec">${tx(t)}${hint?`<i>${tx(hint)}</i>`:''}</div>`;

/* 漏斗锚在同一个时点：今天的大盘 + 稳态水位。
   ⚠ 别用「今天的池子」除「某一年的日均」反解水位 —— 那两端不在同一个时点。 */
function funnelOf(){
  const s=scen(),P=s.P;
  const cs=VIEW==='ALL'?R.cities:R.cities.filter(c=>c.id===VIEW);
  const mkt=cs.reduce((a,c)=>a+c.pool_monthly,0)/30;
  const sched=R.sites.concat(MANUAL).filter(p=>(s.pts[p.id]||{}).openQ)
    .filter(p=>VIEW==='ALL'||p.city===VIEW);
  const pool=sched.reduce((a,p)=>a+p.pool_monthly,0)/30;
  const cov=sched.length?sched.reduce((a,p)=>a+Math.min(1,p.cov_ceiling*P.covK)*p.pool_monthly,0)
    /Math.max(1,sched.reduce((a,p)=>a+p.pool_monthly,0)):R.params.cov_steady*P.covK;
  return {mkt:mkt,pool:pool,cov:cov,capped:pool*cov,ours:pool*cov*P.selEnd,
    sel:P.selEnd,sites:sched.length,cities:cs.length};}
function funnelBars(){
  const f=funnelOf(),W=f.mkt||1;
  const rows=[[tx('可服务大盘'),f.mkt,f.cities+G+tx('城合计')],
    [tx('圈内可服务'),f.pool,tx('排期内')+' '+f.sites+G+tx('个点位')],
    [tx('可承接'),f.capped,'× '+tx('商家商品覆盖')+' '+pc1(f.cov)],
    [tx('我们的日均'),f.ours,'× '+tx('配送方式选择率')+' '+pc1(f.sel)]];
  return `<div class="fnl">`+rows.map((r,i)=>`<div class="frow ${i===3?'last':''}">
      <div class="fl">${r[0]}</div>
      <div class="fbar"><i style="width:${Math.max(.4,r[1]/W*100)}%"></i></div>
      <div class="fv">${fmt(r[1])}</div>
      <div class="fop">${r[2]}</div></div>`).join('')+'</div>';}
function funnelBody(){
  const f=funnelOf();
  return chain([
    ['可服务大盘',fmt(f.mkt)+G+tx('单/日')+PU('dot')+tx('四座城合计'),'事实'],
    ['圈内可服务',fmt(f.pool)+G+tx('单/日')+PU('dot')+tx('排期内')+' '+f.sites+G+tx('个点位'),'可推导'],
    ['商家商品覆盖',pc1(f.cov)+PU('sp')+tx('稳态'),'假定值','逐点位各有自己的天花板，这里整组缩放',['covK','covMo']],
    ['配送方式选择率',pc1(f.sel)+PU('sp')+tx('稳态'),'假定值','全域无实测，全链最缺锚的一项',['selEnd','selMo']]
  ],['日均单量','① × ③ × ④'])
  +sec('今天能接多少','按稳态水位算，不含爬坡')+funnelBars();}

const DET={
  row_new:{t:'新开点位',s:'达标点位按什么顺序、什么速度开',body(){
    const s=scen(),ys=years();
    const rows=ys.map(y=>`<tr><td class="nm">${y}</td><td class="r">${s.cap[ys.indexOf(y)]}</td>
      <td class="r w">${(YB()[y].new||[]).length}</td><td class="r">${YB()[y].cum}</td></tr>`).join('');
    return chain([
      ['算多久回本',tx('把还没开的点位按「就在这一年年初开航」重跑一遍，看几个月月利润转正'),'可推导'],
      ['排队',tx('转正快的先开，同一档里累计投入小的先开'),'可推导'],
      ['产能闸','N(y) = '+s.cap.join(' · '),'假定值','',['capK']],
      ['超过这个月数不排','> '+pget('obsMo')+G+tx('个月')+PU('arrow')+tx('观察池'),'假定值','',['obsMo']]
    ],['当年新开',tx('排队里够格的，取到产能先用完为止')])
    +note(tx('开航季按名次顺铺 Q1 至 Q4'))
    +`<table class="tbl"><tr><th>${tx('年')}</th><th class="r">${tx('产能')}</th><th class="r">${tx('新开')}</th>
        <th class="r">${tx('累计点位')}</th></tr>${rows}</table>`;}},
  row_cum:{t:'累计点位',s:'从候选到排期',body(){
    const s=scen(),c=s.counts,pass=(c.T1|0)+(c.T2|0)+(c.T3|0);
    const rows=R.cities.map(ct=>{
      const all=R.sites.concat(MANUAL).filter(p=>p.city===ct.id);
      let ps=0,op=0;all.forEach(p=>{const o=s.pts[p.id]||{};
        if(o.tier&&o.tier!=='OBS')ps++;if(o.openQ)op++;});
      return `<tr class="click" data-go="city_${ct.id}" role="button" tabindex="0" aria-controls="detail">
        <td class="nm">${cName(ct)}</td><td class="r">${all.length}</td><td class="r">${ps}</td>
        <td class="r ${op?'w':''}">${op||'—'}</td>
        <td class="r ${s.land[ct.id]?'w':''}">${s.land[ct.id]?xLandY(s.land[ct.id]):tx('推演期内不转正')}</td></tr>`;}).join('');
    return chain([

/* ===== 敏感度 =====
   每个参数统一上下各拨 25%，跑两次，量它对两件事的影响：转正年动不动、末年净利差多少。
   统一比例而不是逐参数定敏感带，是为了让排序是同一把尺子量出来的；
   ⚠ 这是弹性排序，不是「这个参数的合理区间」，别把 ±25% 当成业务上的取值范围。
   ⚠ 一次要跑两倍参数个数的全量推演，所以放空闲时算，算完只重渲这一段。 */
const SENS_STEP=.25;
function sensCalc(){
  if(SENS)return SENS;
  try{
    const base=scen(),ys=years(),last=ys[ys.length-1];
    const netOfRun=r=>{const v=r.V[VIEW];return v?netOf(v.y[last]):0;};
    const b=netOfRun(base)||1,bl=base.land[VIEW];
    const rows=PARAMS_LIVE.map(def=>{
      const cur=pget(def.k),
        lo=Math.max(def.min,cur*(1-SENS_STEP)),hi=Math.min(def.max,cur*(1+SENS_STEP));
      const at=v=>{const P=Object.assign({},paramsNow());P[def.k]=v;return project(P);};
      const rl=at(lo),rh=at(hi);
      const dl=(netOfRun(rl)-b)/Math.abs(b),dh=(netOfRun(rh)-b)/Math.abs(b);
      return {k:def.k,t:def.t,st:def.st,why:def.why,cur:cur,fmt:def.fmt,lo:lo,hi:hi,
        dl:dl,dh:dh,amp:Math.max(Math.abs(dl),Math.abs(dh)),
        moves:rl.land[VIEW]!==bl||rh.land[VIEW]!==bl,
        landLo:rl.land[VIEW],landHi:rh.land[VIEW]};})
      .sort((a,b2)=>b2.amp-a.amp);
    SENS={ok:true,rows:rows,land:bl};
  }catch(e){console.warn('[OP] 敏感度算不了：',e&&e.message);SENS={ok:false,rows:[]};}
  return SENS;}
function sensBody(k){
  const S=sensCalc();
  if(!S.ok)return `<div class="dp">${tx('敏感度计算中')}…</div>`;
  const x=S.rows.find(r=>r.k===k);
  if(!x)return `<div class="dp">${tx('这个参数不在敏感度表里')}</div>`;
  const d=PARAMS_LIVE.find(r=>r.k===k),pc=v=>(v>=0?'+':'')+Math.round(v*100)+'%';
  const rows=S.rows.map(r=>`<tr class="${r.k===k?'on':''}"><td class="nm">${tx(r.t)}</td>
    <td class="r">${r.fmt(r.cur)}</td><td class="r ${r.amp>=.2?'w':''}">±${Math.round(r.amp*100)}%</td>
    <td class="r">${r.moves?tx('能'):tx('不能')}</td></tr>`).join('');
  return chain([
    ['当前值',d.fmt(x.cur),x.st,d.why,k],
    ['调到',d.fmt(x.lo)+PU('arrow')+d.fmt(x.hi),'可推导','每个参数都调 25%，各项之间才可比'],
    ['末年净利',pc(x.dl)+PU('arrow')+pc(x.dh),'可推导'],
    /* ⚠ 别写成 landLo → landHi：那读起来像「从低拨到高会这样走」，
       而这是两个各自独立的结果，方向也未必单调。三个数并列写，把基准也带上。 */
    ['转正年',x.moves?tx('会变')+PU('c')+tx('现在')+' '+xLand(S.land)+PU('d')
      +tx('调低')+' '+xLand(x.landLo)+PU('d')+tx('调高')+' '+xLand(x.landHi):tx('不变'),'可推导']
  ],['排名',tx('全部参数里第')+' '+(S.rows.indexOf(x)+1)+' '+tx('位')])
  +`<table class="tbl"><tr><th>${tx('参数')}</th><th class="r">${tx('当前值')}</th>
      <th class="r">${tx('末年净利波动')}</th><th class="r">${tx('会改变转正年')}</th></tr>${rows}</table>`;}

/* ⚠ 任何 flyTo / fitBounds 之前先量尺寸。地图模式关着时 #map 宽高是 0：

/* ===== 时间轴 =====

function drawTL(){

  /* 穿零季 = 首个「有账且不亏」的季，且它前面得真的亏过。
     ⚠ 只写 findIndex(t=>t>=0) 会把还没开航那几季的 0 当成「不亏」 */

  QS.forEach((q,i)=>{if(!/Q1$/.test(q)||i===zi)return;
    sv+=`<text x="${x(i)}" y="9" font-size="9.5" fill="var(--ink3)" text-anchor="middle" font-family="var(--mono)">${q.slice(0,4)}</text>`;});

/* ===== 工作台的几何与账 =====
   ⚠ 几何参数一律从数据的 params 读，页面不留第二份。 */
const FPC={get SUPPLY_R(){return RAD.sup!=null?RAD.sup:R.params.supply_r_km;},
  get LAND_R(){return RAD.land!=null?RAD.land:R.params.land_r_km;},
  get RANGE(){return R.params.range_km;}};
let RAD={sup:null,land:null};
const radDirty=()=>RAD.sup!=null||RAD.land!=null;
function resetRadius(){RAD={sup:null,land:null};if(WB)wbRecalc();renderMapSide();renderConc();}
/* 起讫明细只覆盖取数网格那一片。落在框外的点位没有明细可算，工作台按只读处理，
   屏上如实说是「不在网格覆盖范围内」，不拿别处的数硬凑。 */
const inGrid=(lat,lng)=>!!MD&&lat>=MD.bbox[0]-.02&&lat<=MD.bbox[2]+.02&&lng>=MD.bbox[1]-.02&&lng<=MD.bbox[3]+.02;
async function loadOD(){
  if(OD)return OD;
  OD=await fetch('../data/od_matrix.json',{cache:'no-store'}).then(r=>r.json());
  OD._cells=Object.keys(OD.byCell).map(k=>{const a=k.split(',');
    return {lat:+a[0]*OD.origin_grid,lng:+a[1]*OD.origin_grid,rows:OD.byCell[k]};});
  return OD;}
/* 可服务 = 起点落在取餐圈内、终点落在「航程 + 降落圈半径」内的订单；
   圈定 = 其中终点还落在某一个降落圈里的那部分。两个数除一下就是圈定率。 */
function wbSvc(hub,supR,lands){
  const admR=FPC.RANGE+Math.max.apply(null,lands.length?lands.map(l=>l.rk):[FPC.LAND_R]);
  let tot=0,cap=0;const dc=new Map();
  for(const c of OD._cells){
    if(kmD(hub[0],hub[1],c.lat,c.lng)>supR)continue;
    for(const r of c.rows){
      if(kmD(hub[0],hub[1],r[0],r[1])>admR)continue;
      tot+=r[2];
      const k=r[0]+','+r[1];dc.set(k,(dc.get(k)||0)+r[2]);}}
  dc.forEach((v,k)=>{const a=k.split(',');
    for(const l of lands)if(kmD(+a[0],+a[1],l.lat,l.lng)<=l.rk){cap+=v;break;}});
  const W=OD.window_days||60;
  return {tot:tot,tot_day:tot/W,cap_day:cap/W,capRate:tot?cap/tot:0};}
function wbEcon(p,daily,nl){
  const P=scen().P;
  const cfg=siteCfg(Object.assign({},p,{landings:Math.max(1,nl)}),P);
  const m=UEModel.compute(Object.assign({},cfg,{dailyOrders:Math.max(.1,daily),
    subsidyPerOrder:P.sub1}));
  const be=UEModel.findBreakeven(cfg);
  return {profit:m.profit,be:be.feasible?be.daily:null};}

/* ===== 右轨 ===== */
let WB=null,wbLayers=[],GRIPS=[],wbT=null;
function wbExit(){wbLayers.forEach(l=>{try{map.removeLayer(l);}catch(e){}});wbLayers=[];GRIPS=[];WB=null;}
function wbSig(){return WB.supR.toFixed(1)+'|'+WB.lands.map(l=>l.lat.toFixed(5)+','+l.lng.toFixed(5)+','+l.rk.toFixed(1)).join(';');}
const BEARING=[['正北','N'],['东北','NE'],['正东','E'],['东南','SE'],['正南','S'],['西南','SW'],['正西','W'],['西北','NW']];
function landName(hub,lat,lng){
  const dLat=lat-hub[0],dLng=(lng-hub[1])*Math.cos(hub[0]*Math.PI/180);
  const b=BEARING[Math.round(((Math.atan2(dLng,dLat)*180/Math.PI+360)%360)/45)%8][LANG==='en'?1:0];
  return LANG==='en'?b+' side':b+'侧';}
/* 初始降落点：按需求密度在航程圈里贪心挑，与「可服务量」用的是同一份起讫明细。
   挑不出来（点位在网格外）就不摆，工作台按只读呈现。 */
function greedyLands(hub,n){
  if(!OD)return [];
  const agg=new Map();
  for(const c of OD._cells){
    if(kmD(hub[0],hub[1],c.lat,c.lng)>FPC.SUPPLY_R)continue;
    for(const r of c.rows){
      const d=kmD(hub[0],hub[1],r[0],r[1]);
      if(d>FPC.RANGE||d<.3)continue;
      const k=r[0]+','+r[1];agg.set(k,(agg.get(k)||0)+r[2]);}}
  const cells=[];agg.forEach((v,k)=>{const a=k.split(',');cells.push([+a[0],+a[1],v]);});
  cells.sort((a,b)=>b[2]-a[2]);
  const out=[];
  for(const c of cells){
    if(out.length>=n)break;
    if(out.some(o=>kmD(o.lat,o.lng,c[0],c[1])<FPC.LAND_R*1.2))continue;
    out.push({lat:c[0],lng:c[1],rk:FPC.LAND_R});}
  return out;}
async function wbEnter(p){
  wbExit();
  WB={p:p,hub:[p.lat,p.lng],supR:FPC.SUPPLY_R,lands:[],state:'loading',dirty:false,addArm:false,
      res:null,acct:null,auto:false};
  renderMapSide();
  if(!inGrid(p.lat,p.lng)){WB.state='static';renderMapSide();wbDraw();return;}
  try{await loadOD();}catch(e){WB.state='static';renderMapSide();wbDraw();return;}
  if(!WB||WB.p.id!==p.id)return;
  WB.lands=greedyLands(WB.hub,p.landings||3);
  WB.lands.forEach(l=>{l.nm=landName(WB.hub,l.lat,l.lng);});
  WB.auto=true;WB.base=wbSig();
  wbRecalc();}
function wbRecalc(){
  if(!WB||WB.state==='static')return;
  if(!WB.lands.length){WB.state='ok';WB.res=null;WB.acct=null;WB.dirty=true;renderMapSide();wbDraw();return;}
  const r=wbSvc(WB.hub,WB.supR,WB.lands);
  if(!r.tot){WB.state='err';WB.msg='该点无可服务池';renderMapSide();wbDraw();return;}
  WB.state='ok';WB.res=r;
  const P=scen().P;
  const water=Math.min(1,(WB.p.cov_ceiling||R.params.cov_steady)*P.covK)*P.selEnd;
  const daily=r.cap_day*water;
  WB.acct=Object.assign({daily:daily,water:water},wbEcon(WB.p,daily,WB.lands.length));
  WB.dirty=wbSig()!==WB.base;
  renderMapSide();wbDraw();}
const wbDebounce=()=>{clearTimeout(wbT);wbT=setTimeout(wbRecalc,240);};
function wbReset(){
  if(!WB)return;
  WB.supR=FPC.SUPPLY_R;
  WB.lands=greedyLands(WB.hub,WB.p.landings||3);

  WB.base=wbSig();wbRecalc();}
